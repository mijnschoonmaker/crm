name: Instelling zetten
on:
  workflow_dispatch:
    inputs:
      key: { description: "Veld", required: true }
      val: { description: "Waarde", required: false, default: "" }
jobs:
  zet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
          KEY: ${{ inputs.key }}
          VAL: ${{ inputs.val }}
        run: node tools/zet-instelling.js
