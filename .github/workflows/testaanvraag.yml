name: Testaanmelding webshop (eenmalig)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.48.2 --no-save --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node tools/testaanvraag/test.js
