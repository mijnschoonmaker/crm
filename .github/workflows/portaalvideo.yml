name: Portaal uitlegvideo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gereedschap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q edge-tts
          mkdir -p /home/runner/work/_v && cd /home/runner/work/_v && npm init -y >/dev/null && npm install -q firebase-admin@12 playwright@1.47.2 --no-audit --no-fund >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Stem inspreken
        env: { TEMPO: "+4%", EEN: "1" }
        run: mkdir -p out && python tools/video/tts.py
      - name: Portaal opnemen
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT }}
          LIVEMODE: ashley
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node tools/video/opname.js
      - name: Video maken
        run: python tools/video/maak.py
      - name: Naar media-tak
        run: |
          mkdir -p /tmp/m && cp out/woorden.json /tmp/m/woorden.json; (ls out/fr | wc -l; tail -c 300 out/frames.txt) > /tmp/m/info.txt; cp out/klantportaal-uitleg.mp4 out/controle.png out/stem.m4a /tmp/m/
          git config user.name "video-bot" && git config user.email "bot@mijnschoonmaker.com"
          git fetch origin media && git checkout -B media origin/media && cp /tmp/m/* . && git add klantportaal-uitleg.mp4 controle.png stem.m4a woorden.json info.txt && git commit -qm "Uitlegvideo klantportaal" && git push origin media
