name: CRM opschonen
on:
  workflow_dispatch:
    inputs:
      modus: { description: "tellen of wissen", required: true, default: "tellen" }
      collecties: { description: "Komma-gescheiden collecties om te wissen (alleen bij wissen)", required: false, default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
          MODUS: ${{ inputs.modus }}
          COLLECTIES: ${{ inputs.collecties }}
        run: node tools/opschonen.js
      - if: inputs.modus == 'wissen'
        uses: actions/upload-artifact@v4
        with: { name: backup-opschonen, path: backup/, retention-days: 30 }
