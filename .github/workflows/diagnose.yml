name: Factuur nakijken (alleen lezen)
on:
  workflow_dispatch:
    inputs:
      nummer: { description: "Factuurnummer", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: |
          npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-mansard "python3 tests/regels.py" > out.txt 2>&1 || true
          tail -40 out.txt | while IFS= read -r l; do echo "::warning::$l"; done
