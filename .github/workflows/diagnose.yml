name: Factuur nakijken (alleen lezen)
on:
  workflow_dispatch:
    inputs:
      nummer: { description: "Factuurnummer", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - if: ${{ inputs.nummer == 'maandtop' }}
        env:
          P: ${{ vars.FIREBASE_PROJECT }}
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud scheduler jobs list --project "$P" --location europe-west4 --format="value(name)" | grep -i maand || true
          gcloud scheduler jobs run firebase-schedule-maandWinnaar-europe-west4 --project "$P" --location europe-west4
          sleep 60
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
          NUMMER: ${{ inputs.nummer }}
        run: node tools/diagnose.js
