name: Online zetten
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Server-onderdelen installeren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - name: Inloggen bij Google
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Naar Firebase zetten
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --project "${{ vars.FIREBASE_PROJECT }}" --non-interactive --force 2>&1 | tee deploy.log || {
            msg=$(grep -v "^\s*$" deploy.log | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Online zetten mislukt::$msg"
            exit 1
          }
