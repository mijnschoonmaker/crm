name: Online zetten
on:
  push:
    branches: [main]
  workflow_dispatch:
# nooit twee keer tegelijk online zetten: een nieuwe run wacht tot de vorige klaar is
concurrency:
  group: online-zetten
  cancel-in-progress: false
jobs:
  # ---------- zelftest: eerst controleren, dan pas online zetten ----------
  zelftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Gebouwde versie gelijk aan de broncode
        run: |
          (cd src && python3 build.py >/dev/null) && python3 build_live.py >/dev/null 2>&1
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Zelftest::De gebouwde versie (public/index.html) loopt niet gelijk met de broncode in src/. Draai de build en zet de uitkomst mee in de update."
            git status --short | head -20; exit 1
          fi
      - name: Testbrowser installeren
        run: pip install --quiet playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null
      - name: Zelftest CRM en klantportaal
        run: python tests/selftest.py
      - name: Database-regels (elk bedrijf ziet alleen zijn eigen gegevens)
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-mansard "python3 tests/regels.py"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with: { name: zelftest-uitslag, path: tests/uitslag.json, retention-days: 30 }
  deploy:
    needs: zelftest
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Server-onderdelen installeren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - name: Inloggen bij Google
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "::notice title=Account::$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['client_email'])" "$RUNNER_TEMP/sa.json")"
      - name: Website-site voor mansard.nl (eenmalig aanmaken)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null 2>&1
          T=$(gcloud auth print-access-token)
          curl -s -X POST -H "Authorization: Bearer $T" -H "x-goog-user-project: $P" -H "Content-Type: application/json" "https://firebasehosting.googleapis.com/v1beta1/projects/$P/sites?siteId=mansard-site-95789" -d '{}' | head -c 300; echo
      - name: Mailplaatje met luchtfoto maken
        continue-on-error: true
        run: |
          pip install --quiet pillow
          o=$(python3 tools/mailgif.py --kaart 2>&1 | tail -n 3 | tr '\n' ' '); echo "::notice title=Mailkaart::$o"
          # het gemaakte plaatje bewaren in de repository (geen nieuwe run: pushes met GITHUB_TOKEN starten geen workflow)
          if ! git diff --quiet -- public/mail/live-kaart.gif || [ -n "$(git status --porcelain public/mail/hero-kaart.jpg public/mail/hero-route.json)" ]; then
            git config user.name "mansard-bot"; git config user.email "bot@mansard.nl"
            git add public/mail/live-kaart.gif public/mail/hero-kaart.jpg public/mail/hero-route.json 2>/dev/null; git commit -qm "Mailkaart op luchtfoto bijgewerkt" && git pull -q --rebase && git push -q || echo "bewaren lukte niet"
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: mailplaatjes, path: public/mail/, retention-days: 7 }
      - name: Naar Firebase zetten
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --project "${{ vars.FIREBASE_PROJECT }}" --non-interactive --force 2>&1 | tee deploy.log || {
            msg=$(grep -v "^\s*$" deploy.log | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Online zetten mislukt::$msg"
            exit 1
          }
          msg=$(grep -v "^\s*$" deploy.log | grep -v "npm warn" | tail -n 20 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Resultaat::$msg"
      - name: Database-back-ups bij Google (dagelijks, 14 dagen) en regio controleren
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null 2>&1
          loc=$(gcloud firestore databases describe --database="(default)" --project="$P" --format="value(locationId)" 2>/dev/null)
          echo "::notice title=Regio database::${loc:-onbekend}"
          n=$(gcloud firestore backups schedules list --database="(default)" --project="$P" --format="value(name)" 2>/dev/null | wc -l)
          if [ "$n" = "0" ]; then
            gcloud firestore backups schedules create --database="(default)" --recurrence=daily --retention=14d --project="$P" --quiet \
              && echo "::notice title=Back-ups::Dagelijkse Firestore-back-up ingesteld (14 dagen bewaard)" \
              || echo "::warning title=Back-ups::Instellen van de Google-back-up lukte niet; de eigen nachtelijke back-up (functie dagBackup) draait wel"
          else
            echo "::notice title=Back-ups::Dagelijkse Firestore-back-up staat al aan ($n schema)"
          fi
