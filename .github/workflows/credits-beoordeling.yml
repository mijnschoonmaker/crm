name: Credits beoordeling nakijken
on:
  workflow_dispatch:
    inputs:
      schrijf:
        description: "1 = echt toevoegen, 0 = alleen tonen"
        default: "0"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
          SCHRIJF: ${{ inputs.schrijf }}
        run: node tools/credits-beoordeling.js
