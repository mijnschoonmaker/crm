name: Minimumprijs voor alles (eenmalig)
on: workflow_dispatch
jobs:
  zet:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
        run: node tools/eenmalig/minalles.js
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run webshop.yml --ref main
