name: Akkoord-overzicht opnieuw versturen (eenmalig)
on:
  workflow_dispatch:
    inputs:
      nr: { description: "Offertenummer", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT }}
          FIREBASE_CONFIG: '{"projectId":"${{ vars.FIREBASE_PROJECT }}","storageBucket":"${{ vars.FIREBASE_BUCKET || format('{0}.firebasestorage.app', vars.FIREBASE_PROJECT) }}"}'
          NR: ${{ inputs.nr }}
        run: node tools/akkoord-opnieuw.js
