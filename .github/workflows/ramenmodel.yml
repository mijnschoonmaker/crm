name: Ramenmodel klaarzetten
# Eenmalig: zet het gratis raamherkenningsmodel (YOLOv8, Open Images) om naar ONNX
# en zet het met onnxruntime-web in public/ai, zodat de telefoon zelf ramen kan tellen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ramenmodel.yml", "tools/ramenmodel.py", "tools/testfotos.py"]
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Testfoto's ophalen
        run: python tools/testfotos.py
      - name: Vastleggen
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tools/testfotos || true
          git commit -m "Testfoto's voor raamherkenning" || exit 0
          git pull --rebase -q && git push
