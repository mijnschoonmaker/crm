name: Werkdag corrigeren (terug bij de loods)
on:
  workflow_dispatch:
    inputs:
      dag: { description: "Datum JJJJ-MM-DD", required: true }
      minuten: { description: "Minuten na vertrek", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          P: ${{ vars.FIREBASE_PROJECT }}
          DAG: ${{ inputs.dag }}
          MINUTEN: ${{ inputs.minuten }}
        run: node tools/werkdag-stop.js
