<!--CFG-SKIN: configurator-opbouw voor de dienstenwebshop (alleen testpagina mijnschoonmaker-test.html).
    Zelfde rekenwerk en aanmelden als de gewone webshop; alleen de indeling op grote schermen is anders:
    stappen bovenaan, groot beeld links, keuzes rechts, samenvatting met prijs onderaan. Op de telefoon blijft alles zoals het was. -->
<style>
@media (min-width:1000px){
html body.cfg:not(#zz){background:#fff!important;margin:0;padding:0!important;overflow:hidden}
html body.cfg:not(#zz) .page{display:block!important;min-height:0!important;max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
html body.cfg:not(#zz) .i2-weg,html body.cfg:not(#zz) .ml-steps,html body.cfg:not(#zz) .i2-kick,html body.cfg:not(#zz) .ml-sub{display:none!important}
.cfg-top,.cfg-bar{display:none}
/* bovenrij: stappen links, knop rechts */
html body.cfg:not(#zz) .cfg-top{display:flex;align-items:stretch;justify-content:space-between;height:54px;padding:0 20px 0 30px;background:#fff;margin:0}
.cfg-tabs{display:flex;align-items:stretch;gap:30px}
.cfg-tabs button{all:unset;cursor:pointer;display:flex;align-items:center;font:500 11px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#4a4f57;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.cfg-tabs button:hover{color:#0e1117}
.cfg-tabs button.cfg-aan{color:#0e1117;font-weight:600;border-bottom-color:#0e1117}
.cfg-top .rk{display:flex;align-items:center}
.cfg-top .rk a{display:flex;align-items:center;gap:10px;height:38px;padding:0 18px;border:1px solid #c9ccd1;border-radius:4px;font:600 10.5px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#0e1117;text-decoration:none;background:#fff}
.cfg-top .rk a:hover{border-color:#0e1117}
.cfg-top .rk svg{width:17px;height:17px}
/* hoofddeel */
html body.cfg:not(#zz) .cfg-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:38px;padding:0 34px 0 14px;height:calc(100vh - 54px - 80px);margin:0}
.cfg-stage{position:relative;border-radius:8px;overflow:hidden;background:linear-gradient(118deg,#d9e1ea 0%,#eef0f2 38%,#f3f1ee 62%,#ece3d5 100%);display:grid;place-items:center}
.cfg-stage .i2-vis{display:grid!important;place-items:center;transform:scale(1.1)}
.cfg-stage .cfg-foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.cfg-stage.foto .cfg-foto{display:block}.cfg-stage.foto .i2-vis{display:none!important}
.cfg-acties{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:2}
.cfg-acties a,.cfg-acties button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:6px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);font:600 10.5px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#0e1117}
.cfg-acties button.vk{width:42px;padding:0;justify-content:center}
.cfg-acties svg{width:16px;height:16px}
.cfg-acties a:hover,.cfg-acties button:hover{background:#fff}
.cfg-nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:20px;height:44px;padding:0 16px;border-radius:6px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);font:500 11.5px/1 system-ui,sans-serif;color:#0e1117;z-index:2}
.cfg-nav button{all:unset;cursor:pointer;display:grid;place-items:center;width:22px;height:22px}
.cfg-nav button[disabled]{opacity:.3;cursor:default}
.cfg-nav svg{width:16px;height:16px}
/* rechterkolom */
.cfg-col{overflow-y:auto;overflow-x:hidden;padding:4px 2px 48px 0;scrollbar-width:none}
.cfg-col::-webkit-scrollbar{display:none}
html body.cfg:not(#zz) .cfg-col .intro2{display:block!important;padding:0!important;background:none!important;border:0!important;box-shadow:none!important;margin:0!important;min-height:0!important;color:#0e1117!important;border-radius:0!important}
html body.cfg:not(#zz) .cfg-col .intro2::before,html body.cfg:not(#zz) .cfg-col .intro2::after{display:none!important}
html body.cfg:not(#zz) .cfg-col .i2-txt{max-width:none;text-align:left;padding:0!important}
html body.cfg:not(#zz) .cfg-col h1.ml-title{font:400 31px/1.15 system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:-.01em!important;text-transform:none!important;text-align:left!important;margin:26px 0 18px!important;color:#0e1117!important;padding:0!important;background:none!important;-webkit-text-fill-color:#0e1117!important}
html body.cfg:not(#zz) .cfg-col .wz-two{display:flex!important;flex-direction:column!important;gap:14px!important}
html body.cfg:not(#zz) .cfg-col .wz-opt{position:relative;display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;gap:3px!important;width:100%!important;box-sizing:border-box;min-height:0!important;height:auto!important;padding:20px 48px 20px 18px!important;border:1px solid #d6d9dd!important;border-radius:6px!important;background:#fff!important;box-shadow:none!important;outline:0!important;font:400 14.5px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:0!important;text-transform:none!important;color:#0e1117!important;text-align:left!important}
html body.cfg:not(#zz) .cfg-col .wz-opt>svg{display:none!important}
html body.cfg:not(#zz) .cfg-col .wz-opt::before,html body.cfg:not(#zz) .cfg-col .wz-opt::after{display:none!important;content:none!important}
html body.cfg:not(#zz) .cfg-col .wz-opt:hover,html body.cfg:not(#zz) .cfg-col .wz-opt.on{border-color:#0e1117!important;box-shadow:inset 0 0 0 .6px #0e1117!important}
html body.cfg:not(#zz) .cfg-col .wz-opt small{display:block;font:400 14.5px/1.35 system-ui,sans-serif!important;letter-spacing:0!important;text-transform:none!important;color:#0e1117!important}
html body.cfg:not(#zz) .cfg-col .wz-opt .info{position:absolute;top:18px;right:16px;width:20px;height:20px;border-radius:50%;background:#f1f2f3;display:grid;place-items:center;font:700 11px/1 Georgia,serif;color:#0e1117}
html body.cfg:not(#zz) .cfg-col .wz-opt .cfg-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
html body.cfg:not(#zz) .cfg-col .wz-opt .cfg-chips span{font:400 11.5px/1 system-ui,sans-serif!important;letter-spacing:0!important;text-transform:none!important;background:#f1f2f3;border-radius:999px;padding:9px 12px;color:#0e1117}
html body.cfg:not(#zz) .cfg-col .wz-copy.wz-door{margin-top:30px!important;text-align:left!important}
html body.cfg:not(#zz) .cfg-col .wz-copy.wz-door small{color:#7a7f87!important}
html body.cfg:not(#zz) .cfg-col .wz-copy img{filter:invert(1) brightness(.2)}
html body.cfg:not(#zz) .cfg-col .wz-back{background:#f1f2f3!important;color:#0e1117!important;border-radius:999px!important;box-shadow:none!important}
html body.cfg:not(#zz) .cfg-col .wz-adr{width:100%!important;max-width:none!important;box-sizing:border-box;box-shadow:none!important;border:1.5px solid #0e1117!important;border-radius:6px!important}
html body.cfg:not(#zz) .cfg-col .wrap{max-width:none;margin:34px 0 0;padding:0}
html body.cfg:not(#zz) .cfg-col .card.acc{border:1px solid #d6d9dd!important;border-radius:6px!important;margin:0 0 14px!important;box-shadow:none!important;background:#fff!important}
html body.cfg:not(#zz) .cfg-col .card.acc.open{border-color:#0e1117!important;box-shadow:inset 0 0 0 .6px #0e1117!important}
html body.cfg:not(#zz) .cfg-col .card.acc .num{display:none!important}
html body.cfg:not(#zz) .cfg-col .card.acc .head{padding:18px 18px!important}
html body.cfg:not(#zz) .cfg-col .card.acc .head h2{font:400 14.5px/1.35 system-ui,sans-serif!important;letter-spacing:0!important;text-transform:none!important;color:#0e1117!important;margin:0!important}
html body.cfg:not(#zz) .cfg-col .card.acc .eyebrow{font:400 14.5px/1.35 system-ui,sans-serif!important;letter-spacing:0!important;text-transform:none!important;color:#0e1117!important;margin:0!important;order:2}
html body.cfg:not(#zz) .cfg-col .card.acc .acc-t{display:flex;flex-direction:column-reverse}
html body.cfg:not(#zz) .cfg-col .card.acc .acc-sum{font:400 13px/1.3 system-ui,sans-serif!important;color:#4a4f57!important}
html body.cfg:not(#zz) .cfg-col .card.acc .body{padding:0 18px 18px!important}
html body.cfg:not(#zz) .cfg-col .wrap.cfg-leeg::before{display:none}
html body.cfg:not(#zz) .cfg-col .wrap::before{content:"Uw keuzes";display:block;font:400 31px/1.15 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;color:#0e1117;margin:0 0 18px}
html body.cfg:not(#zz) .cfg-col .i2-go,html body.cfg:not(#zz) .cfg-col .btn2.pri,html body.cfg:not(#zz) .cfg-col .calc,html body.cfg:not(#zz) .cfg-col .go2{border-radius:4px;background:#0e1117;color:#fff;letter-spacing:.14em;text-transform:uppercase;font-size:12px;box-shadow:none}
html body.cfg:not(#zz) .cfg-col .desk-calc{display:none}
/* onderbalk */
html body.cfg:not(#zz) .cfg-bar{display:flex;align-items:center;gap:50px;position:fixed;left:0;right:0;bottom:0;height:80px;padding:0 34px 0 50px;background:#fff;z-index:40}
.cfg-bar .blok{display:flex;flex-direction:column;gap:6px;min-width:0}
.cfg-bar .blok b{font:400 14.5px/1.2 system-ui,sans-serif;color:#0e1117;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.cfg-bar .blok small{font:400 11px/1.2 system-ui,sans-serif;color:#5b6068;white-space:nowrap}
.cfg-bar .blok small i{font-style:normal;padding:0 10px;color:#c9ccd1}
.cfg-bar .blok.lk b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.cfg-bar .ruimte{flex:1}
.cfg-bar .prijs b{display:block;font:400 22px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#0e1117}
.cfg-bar .prijs small{display:block;margin-top:6px;font:400 11px/1 system-ui,sans-serif;color:#5b6068;text-decoration:underline;text-underline-offset:2px}
.cfg-bar .knop{all:unset;cursor:pointer;display:grid;place-items:center;width:160px;height:48px;border-radius:4px;background:#0e1117;color:#fff;font:600 11px/1 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.cfg-bar .knop:hover{background:#262b33}
}
</style>
<script>
(function(){
  if(!matchMedia("(min-width:1000px)").matches)return;
  const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
  const B=typeof BEDRIJF==="object"?BEDRIJF:{};
  const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  document.body.classList.add("cfg");
  const h1=document.querySelector("h1.ml-title");if(h1){h1.style.setProperty("letter-spacing","-0.01em","important");h1.style.setProperty("text-transform","none","important")}
  const m=document.createElement("meta");m.name="robots";m.content="noindex";document.head.append(m);
  const page=$(".page"),intro=$(".intro2"),wrap=$(".wrap"),foot=$(".foot"),vis=$(".i2-vis");
  /* keuzekaarten rechts: korte uitleg onder de titel */
  const UITLEG={particulier:["Vaste prijs per beurt",["Foto maken","Ramen aantikken","Direct uw prijs"]],zakelijk:["Prijs op maat",["Kantoor","Winkel","VvE"]]};
  document.querySelectorAll(".wz-opt[data-soort]").forEach(b=>{const u=UITLEG[b.dataset.soort];if(!u||b.querySelector("small"))return;b.insertAdjacentHTML("beforeend",`<small>${u[0]}</small><span class="info">i</span><span class="cfg-chips">${u[1].map(t=>`<span>${t}</span>`).join("")}</span>`)});
  /* bovenrij: stappen links, klantportaal rechts */
  const top=el("div","cfg-top");
  const STAPPEN=[[0,"Adres"],[1,"Foto’s"],[2,"Ramen"],[3,"Bijzonder"],[4,"Frequentie"],[5,"Gegevens"]];
  const tabs=el("nav","cfg-tabs");STAPPEN.forEach(([n,t])=>{const b=el("button","",t);b.type="button";b.dataset.n=n;b.onclick=()=>naar(n);tabs.appendChild(b)});
  top.append(tabs,el("div","rk",`<a href="https://app.mansard.nl/portaal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>Klantportaal</a>`));
  /* hoofddeel */
  const main=el("div","cfg-main"),stage=el("div","cfg-stage"),col=el("div","cfg-col");
  const foto=el("img","cfg-foto");foto.alt="";stage.append(foto);if(vis)stage.append(vis);
  const acties=el("div","cfg-acties",`${B.whatsapp?`<a href="https://wa.me/${esc(B.whatsapp)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"/></svg>Hulp via WhatsApp</a>`:""}<button type="button" class="vk" aria-label="Volledig scherm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>`);stage.append(acties);
  acties.querySelector(".vk").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen()}catch(e){}};
  const PIJL=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const nav=el("div","cfg-nav",`<button type="button" data-d="-1" aria-label="Vorige foto">${PIJL("M15 5l-7 7 7 7")}</button><span class="i">1 / 1</span><button type="button" data-d="1" aria-label="Volgende foto">${PIJL("M9 5l7 7-7 7")}</button>`);stage.append(nav);
  if(intro)col.append(intro);if(wrap)col.append(wrap);if(foot)col.append(foot);
  main.append(stage,col);
  /* onderbalk */
  const bar=el("div","cfg-bar",`<div class="blok"><b id="cfgB1">Uw woning</b><small><span id="cfgS1">Vul uw adres in</span><i>|</i><span id="cfgB3">–</span></small></div><div class="blok lk"><b id="cfgB2">0 ramen</b><small>Geteld op uw foto’s</small></div><div class="ruimte"></div><div class="prijs"><b id="cfgP">€ –</b><small id="cfgPs">per beurt</small></div><button type="button" class="knop" id="cfgKnop">Volgende</button>`);
  page.prepend(top,main);document.body.append(bar);
  /* ingebed op de homepage: de website heeft zelf al een menubalk */
  if(/[?&]embed=1/.test(location.search)){top.querySelector(".rk").style.display="none"}
  /* navigeren */
  const huidig=()=>{const o=document.querySelector(".acc.open:not([hidden])");if(!o)return 0;return +o.dataset.step};
  function naar(n){if(n===0){col.scrollTo({top:0,behavior:"smooth"});return}
    if(typeof openStep==="function")openStep(n);const c=document.querySelector(`.acc[data-step="${n}"]`);if(c)setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"start"}),60)}
  $("#cfgKnop").onclick=()=>{const n=huidig(),start=$("#goStart");
    if(!document.querySelector(".acc.open:not([hidden])")||(start&&!start.hidden&&col.scrollTop<200)){if(start&&!start.hidden){start.click();return}naar(1);return}
    if(n<4){naar(n+1);return}
    if(n===4){const tf=$("#toForm");if(tf)tf.click();else{const c=$("#calcBtn");if(c)c.click()}return}
    const ind=$("#indienen");if(ind)ind.click()};
  /* foto's in het grote beeld */
  let fi=0;nav.addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;fi+=+b.dataset.d;toon()});
  function fotos(){return [...document.querySelectorAll("#photos .ph img")].map(i=>i.src).filter(Boolean)}
  function toon(){const f=fotos(),n=Math.max(1,f.length);stage.classList.toggle("foto",f.length>0);nav.querySelectorAll("button").forEach(b=>b.disabled=f.length<2);fi=(fi%n+n)%n;if(f.length&&foto.src!==f[fi])foto.src=f[fi];nav.querySelector(".i").textContent=(fi+1)+" / "+n}
  /* samenvatting en actieve stap bijwerken */
  const txt=s=>{const e=$(s);return e?e.textContent.trim():""};
  function bij(){const n=huidig();if(wrap)wrap.classList.toggle("cfg-leeg",!document.querySelector(".acc:not([hidden])"));
    tabs.querySelectorAll("button").forEach(b=>{const k=+b.dataset.n;b.classList.toggle("cfg-aan",k===n||(k===0&&!document.querySelector(".acc.open:not([hidden])")));const s=k?txt("#sum"+k):"";b.classList.toggle("cfg-ok",!!s&&k!==n)});
    const adr=$("#adrQ");$("#cfgB1").textContent=txt("#wzSoort")||"Uw woning";$("#cfgS1").textContent=adr&&adr.value?adr.value:"Vul uw adres in";
    const cnt=txt("#barCount")||"0";$("#cfgB2").textContent=cnt+(cnt==="1"?" raam":" ramen");
    const fr=$("#freq");$("#cfgB3").textContent=fr&&fr.selectedOptions[0]?fr.selectedOptions[0].textContent:"–";
    const p=document.querySelector("#out .op-l b");$("#cfgP").textContent=p?p.textContent:"€ –";$("#cfgPs").textContent=p?"per beurt, "+(document.querySelector("#out .op-l small:nth-of-type(2)")||{textContent:"incl. btw"}).textContent.replace(/^.*·\s*/,""):"per beurt, na het tellen";
    $("#cfgKnop").textContent=n===5?"Indienen":n===4?(p?"Gegevens invullen":"Bereken prijs"):"Volgende";
    toon()}
  bij();setInterval(bij,500);
})();
</script>
