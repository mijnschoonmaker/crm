<!--FOTO-OFFERTE: de klant maakt alleen foto's en vult zijn gegevens in; het bedrijf telt zelf (luchtfoto's + foto's)
    en stuurt binnen 24 uur een offerte op maat. Geen ramen aantikken, geen prijs op de site. Werkt met en zonder configurator-opbouw. -->
<style>
/* niets meer tellen of aantikken */
html body.cfg:not(#a):not(#b):not(#c):not(#d) .cfg-voor .cfg-leg,html body:not(#a):not(#b):not(#c):not(#d) .cfg-leg{display:none!important}
html body.cfg:not(#a):not(#b):not(#c):not(#d) .cfg-col .wrap::before{content:"Uw gegevens"!important}
html body:not(#a):not(#b) .cfg-bar #cfgB3,html body:not(#a):not(#b) .cfg-bar .blok:first-child small i{display:none!important}
html body .acc[data-step="2"],html body .acc[data-step="3"],html body .acc[data-step="4"],html body #ov,html body #result,html body .desk-calc,
html body .phhint,html body #phsum,html body .i2-vis,html body p.foot,html body .cfg-leg,html body #ed,
html body .cfg-tabs button[data-n="2"],html body .cfg-tabs button[data-n="3"],html body .cfg-tabs button[data-n="4"],
html body .cfg-bar .blok.lk,html body .cfg-bar .prijs,html body .cfg-bar .cfg-hint,html body .cfg-bar #cfgKnop,html body .cfg-bar .cfg-knop2,
html body .cfg-uitleg .st:nth-child(n+5){display:none!important}
html body .cfg-stage .cfg-foto{cursor:default!important}
/* stappen in het intro (telefoon) */
.fo-lijst{list-style:none;margin:0;padding:0}
/* fotostap: minimaal 2 foto's, daarna door naar de gegevens */
.fo-verder{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.fo-verder button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:12px;background:#0e1117;color:#fff;
  font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-align:center}
.fo-verder button[disabled]{background:#e6e8ec;color:#8a8f98;cursor:not-allowed}
.fo-verder small{font:400 13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#6b717c;text-align:center}
/* belofte: offerte binnen 24 uur */
.fo-belofte{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:14px 16px;border-radius:14px;background:#f6f7f9;border:1px solid #eceef1;
  font:400 13.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#4a4f57}
.fo-belofte svg{flex:0 0 20px;width:20px;height:20px;color:#0e1117;margin-top:1px}
.fo-belofte b{color:#0e1117;font-weight:600;display:block}
/* onderbalk (configurator): eigen knop, foto-teller en belofte */
.cfg-bar .fo-blok{display:flex;flex-direction:column;gap:3px;min-width:0}
.cfg-bar .fo-blok b{font:500 17px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:#0e1117}
.cfg-bar .fo-blok small{font:400 12.5px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:#6b717c}
.cfg-bar .fo-knop{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;height:56px;min-width:240px;padding:0 28px;border-radius:4px;background:#0e1117;color:#fff;
  font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.2em;text-transform:uppercase}
.cfg-bar .fo-knop[disabled]{opacity:.75;cursor:default}
.cfg-bar .fo-stap{display:flex;flex-direction:column;gap:3px}
.cfg-bar .fo-stap small{font:600 10.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8a8f98}
.cfg-bar .fo-stap b{font:500 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:#0e1117}
@media (max-width:999px){.cfg-bar .fo-stap,.cfg-bar .fo-foto{display:none!important}.cfg-bar .fo-knop{min-width:0;flex:1;height:52px}}
/* bedankt */
.fo-klaar{margin-top:14px;padding:18px 20px;border-radius:14px;background:#f3f7f4;border:1px solid #dfe9e2;font:400 14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:#2f4a3a}
.fo-klaar b{display:block;font-weight:600;color:#1f3a2b;margin-bottom:2px}
</style>
<script>
(function(){
  if(window.__fotoOfferte)return;window.__fotoOfferte=true;
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],G=id=>document.getElementById(id);
  const MIN=2;
  const KLOK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const nF=()=>typeof photos!=="undefined"?photos.length:0;
  const zet=(sel,t)=>{const e=$(sel);if(e&&e.textContent!==t)e.textContent=t};
  /* ---------- teksten ---------- */
  zet("h1.ml-title","Vraag uw offerte aan");zet(".ml-sub","Foto’s maken, wij doen de rest.");
  {const ol=$(".ml-steps");if(ol)ol.innerHTML=[["Maak foto’s","Van alle kanten van uw woning, minimaal "+MIN+"."],["Vul uw gegevens in","Naam, adres en hoe wij u bereiken."],["Binnen 24 uur uw offerte","Wij tellen de ramen en sturen u een vaste prijs."]].map((x,i)=>`<li><span class="n">${i+1}</span><div><b>${x[0]}</b><span>${x[1]}</span></div></li>`).join("")}
{const gs=G("goStart");if(gs){gs.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg>Foto’s maken'}}
  {const s1=$('.acc[data-step="1"]');if(s1){const i=s1.querySelector(".intro");if(i)i.textContent="Maak minimaal "+MIN+" foto’s van uw woning, van alle kanten. Zorg dat alle ramen erop staan; maak de foto’s van een afstand.";
    const h=s1.querySelector("h2");if(h)h.textContent="Foto’s van uw woning";
    const v=document.createElement("div");v.className="fo-verder";v.innerHTML=`<button type="button" id="foVerder" disabled>Verder naar uw gegevens</button><small id="foTel"></small>`;
    (s1.querySelector(".body")||s1).append(v);v.querySelector("button").onclick=naarGegevens}}
  {const s5=G("aanvraag");if(s5){const n=s5.querySelector(".num");if(n)n.textContent="2";const i=s5.querySelector(".intro");if(i)i.textContent="Vul uw gegevens in. Binnen 24 uur ontvangt u van ons een offerte op maat, met een vaste prijs per beurt.";
    const h=s5.querySelector("h2");if(h)h.textContent="Voor uw offerte";
    const b=document.createElement("div");b.className="fo-belofte";b.innerHTML=KLOK+`<div><b>Binnen 24 uur uw offerte</b>Wij bekijken uw foto’s en de luchtfoto’s van uw woning en tellen de ramen voor u. U hoeft niets te tellen.</div>`;
    const snd=s5.querySelector(".send");if(snd)snd.before(b);const ind=G("indienen");if(ind)ind.textContent="Offerte aanvragen"}}
  /* configurator: uitleg rechts en keuzekaart */
  function cfgTeksten(){
    const u=$(".cfg-uitleg");if(u&&!u.dataset.fo){u.dataset.fo="1";const L=[["Kies particulier of zakelijk","Met de knop hierboven."],["Vul uw postcode in","Wij kijken of uw adres in ons werkgebied ligt."],["Maak of upload foto’s","Minimaal "+MIN+", van alle kanten van uw woning."],["Binnen 24 uur uw offerte","Wij tellen de ramen voor u. U hoeft niets te doen."]];
      u.querySelectorAll(".st").forEach((st,i)=>{if(L[i])st.innerHTML=`<b>${i+1}</b><div>${L[i][0]}<small>${L[i][1]}</small></div>`})}
    $$(".wz-opt[data-soort=particulier] .cfg-chips").forEach(c=>{if(!c.dataset.fo){c.dataset.fo="1";c.innerHTML="<span>Foto’s maken</span><span>Gegevens</span><span>Offerte binnen 24 uur</span>"}});
    $$(".wz-opt[data-soort=particulier] small").forEach(s=>{if(s.textContent!=="Offerte binnen 24 uur")s.textContent="Offerte binnen 24 uur"});
    const tip=$(".cfg-fotos .tip-w");if(tip&&!/24 uur/.test(tip.textContent))tip.innerHTML="<b>Tip</b>Maak minimaal "+MIN+" foto’s: voorkant en achterkant. Daarna vult u uw gegevens in en ontvangt u binnen 24 uur uw offerte.";
    const nog=$(".cfg-nog span");if(nog&&nog.textContent!=="Nog een foto")nog.textContent="Nog een foto"}
  /* ---------- geen aantikscherm: een foto erbij is gewoon een foto erbij ---------- */
  window.openEd=function(){};try{openEd=window.openEd}catch(e){}
  /* ---------- naar de gegevens ---------- */
  function naarGegevens(){if(nF()<MIN){const i=G("ph-in");if(i)i.click();return}
    try{doneStep(1)}catch(e){}try{openStep(5)}catch(e){}
    const a=G("aanvraag");if(a){a.hidden=false;setTimeout(()=>{a.scrollIntoView({behavior:"smooth",block:"start"});const k=G("k-naam");if(k&&!k.value)k.focus({preventScroll:true})},120)}}
  /* ---------- controleren en versturen ---------- */
  const zeg=(t,c)=>{try{say(t,c)}catch(e){const m=G("msg");if(m){m.textContent=t||"";m.className="msg"+(c?" "+c:"")}}};
  window.check=function(){if(nF()<MIN){zeg("Maak minimaal "+MIN+" foto’s van uw woning, van verschillende kanten.","bad");try{openStep(1)}catch(e){}return false}
    if(typeof SOORT!=="undefined"&&SOORT==="zakelijk"&&G("k-bedrijf")&&!G("k-bedrijf").value.trim()){G("k-bedrijf").focus();zeg("Vul de naam van het bedrijf of de VvE in.","bad");return false}
    for(const [id,l] of [["k-naam","uw naam"],["k-adres","uw adres"]])if(!G(id).value.trim()){G(id).focus();zeg("Vul "+l+" in.","bad");return false}
    if(!G("k-email").value.trim()&&!G("k-tel").value.trim()){G("k-email").focus();zeg("Vul uw e-mailadres of telefoonnummer in, zodat wij u de offerte kunnen sturen.","bad");return false}
    const em=G("k-email").value.trim();if(em&&!/^\S+@\S+\.\S+$/.test(em)){G("k-email").focus();zeg("Controleer uw e-mailadres.","bad");return false}
    zeg("");return true};try{check=window.check}catch(e){}
  const advies=()=>{try{return typeof FREQ_ADV!=="undefined"&&FREQ_ADV?FREQ_ADV:(G("freq")&&G("freq").value)||"m8"}catch(e){return "m8"}};
  window.aanvraagData=function(){const v=id=>{const e=G(id);return e?e.value.trim():""};
    return {formaat:"zeem.aanvraag",versie:1,opMaat:true,gemaakt:new Date().toISOString(),ref:(typeof refCode==="function"?refCode():"")||"",
      soort:typeof SOORT!=="undefined"?SOORT:"particulier",klant:{bedrijf:SOORT==="zakelijk"?v("k-bedrijf"):"",naam:v("k-naam"),adres:v("k-adres"),postcode:v("k-pc"),plaats:v("k-plaats"),email:v("k-email"),telefoon:v("k-tel"),opmerking:v("k-opm")},
      telling:{freq:advies()},prijs:null,
      fotos:photos.map((p,i)=>({naam:`woning-foto-${i+1}.jpg`,breedte:p.cv.width,hoogte:p.cv.height}))}};try{aanvraagData=window.aanvraagData}catch(e){}
  window.tekst=function(){const v=id=>{const e=G(id);return e?e.value.trim():""},pl=[v("k-pc"),v("k-plaats")].filter(Boolean).join(" ");
    return ["Offerte-aanvraag glasbewassing (op maat, met foto’s)","",SOORT==="zakelijk"?`Bedrijf / VvE: ${v("k-bedrijf")}`:"",`Naam: ${v("k-naam")}`,`Adres: ${v("k-adres")}${pl?", "+pl:""}`,v("k-email")?`E-mail: ${v("k-email")}`:"",v("k-tel")?`Telefoon: ${v("k-tel")}`:"","",
      `Foto’s: ${nF()} (graag als bijlage meesturen)`,v("k-opm")?"\nOpmerking: "+v("k-opm"):"","","Aanvraagcode voor "+BEDRIJF.naam+" (niet wijzigen):","ZEEM1:"+aanvraagCode()].filter((x,i,a)=>x!==""||a[i-1]!=="").join("\n")};try{tekst=window.tekst}catch(e){}
  /* na versturen: duidelijke bevestiging met de belofte */
  function bedankt(){const m=G("msg");if(!m||m.dataset.fo)return;m.dataset.fo="1";m.className="msg";m.innerHTML="";
    const k=document.createElement("div");k.className="fo-klaar";k.innerHTML="<b>Bedankt, uw aanvraag is binnen.</b>Binnen 24 uur ontvangt u van ons uw offerte op maat"+(G("k-email").value.trim()?" per e-mail":"")+". U hoeft verder niets te doen.";m.after(k)}
  {const ind=G("indienen");if(ind)new MutationObserver(()=>{if(ind.dataset.klaar==="1"){if(ind.textContent!=="Aanvraag verstuurd ✓")ind.textContent="Aanvraag verstuurd ✓";bedankt()}}).observe(ind,{attributes:true,childList:true,characterData:true,subtree:true})}
  /* ---------- configurator-onderbalk: eigen stap, teller en knop ---------- */
  let knop=null,stapEl=null,fotoEl=null;
  function balk(){const bar=$(".cfg-bar");if(!bar||knop)return;
    stapEl=document.createElement("div");stapEl.className="fo-stap";stapEl.innerHTML="<small></small><b></b>";
    fotoEl=document.createElement("div");fotoEl.className="fo-blok fo-foto";fotoEl.innerHTML="<b></b><small>Minimaal "+MIN+" foto’s</small>";
    const bel=document.createElement("div");bel.className="fo-blok fo-24";bel.innerHTML="<b>Binnen 24 uur</b><small>uw offerte op maat</small>";
    knop=document.createElement("button");knop.type="button";knop.className="fo-knop";knop.onclick=knopKlik;
    const r=bar.querySelector(".ruimte");if(r){r.before(stapEl,fotoEl);r.after(bel)}else bar.append(stapEl,fotoEl,bel);bar.append(knop)}
  const midSt=()=>{const m=$(".cfg-mid");return m?m.dataset.st:""};
  const gegOpen=()=>{const a=G("aanvraag");return !!(a&&a.classList.contains("open")&&!a.hidden)};
  function knopKlik(){const st=midSt();
    if(st==="kies"||st==="adres"||st==="zak"){const o=G("cfgKnop");if(o)o.click();return}
    if(nF()<MIN){const i=G("ph-in");if(i)i.click();return}
    if(!gegOpen()){naarGegevens();return}
    const ind=G("indienen");if(ind){ind.scrollIntoView({behavior:"smooth",block:"center"});ind.click()}}
  function bij(){cfgTeksten();const n=nF();
    const vb=G("foVerder"),tl=G("foTel");if(vb){vb.disabled=n<MIN;vb.textContent=n<MIN?(n?"Nog "+(MIN-n)+" foto"+(MIN-n>1?"’s":"")+" nodig":"Eerst foto’s maken"):"Verder naar uw gegevens"}
    if(tl)tl.textContent=n?n+(n===1?" foto":" foto’s")+(n<MIN?" · nog "+(MIN-n)+" nodig":" · meer foto’s mag altijd"):"";
    balk();if(!knop)return;const st=midSt(),klaar=G("indienen")&&G("indienen").dataset.klaar==="1";
    let s=null,t="Volgende";
    if(st==="kies"){s=["Stap 1 van 3","Particulier of zakelijk?"];t="Beginnen"}
    else if(st==="adres"){s=["Stap 1 van 3","Vul uw postcode in"];t="Volgende"}
    else if(st==="zak"){s=["Zakelijk","Vul het formulier in"];t="Versturen"}
    else if(n<MIN){s=["Stap 2 van 3",n?"Nog "+(MIN-n)+" foto"+(MIN-n>1?"’s":"")+" maken":"Maak foto’s van uw huis"];t=n?"Nog een foto":"Foto’s maken"}
    else if(!gegOpen()){s=["Stap 2 van 3",n+" foto’s, alle kanten gehad?"];t="Gegevens invullen"}
    else{s=["Laatste stap","Vul uw gegevens in"];t="Offerte aanvragen"}
    if(klaar){s=["Verstuurd","Binnen 24 uur uw offerte"];t="Verstuurd ✓"}
    if(knop.textContent!==t)knop.textContent=t;knop.disabled=!!klaar;
    stapEl.querySelector("small").textContent=s?s[0]:"";stapEl.querySelector("b").textContent=s?s[1]:"";
    fotoEl.querySelector("b").textContent=n+(n===1?" foto":" foto’s");
    /* tabbladen: Gegevens actief als het formulier open is */
    $$(".cfg-tabs button").forEach(b=>{const k=+b.dataset.n;if(k===5&&gegOpen())b.classList.add("cfg-aan");else if(k===1&&gegOpen())b.classList.remove("cfg-aan")})}
  bij();setInterval(bij,400);
  document.addEventListener("change",e=>{if(e.target&&e.target.id==="ph-in")setTimeout(bij,600)},true);
})();
</script>
