  window.tekst=function(){const v=id=>{const e=G(id);return e?e.value.trim():""},pl=[v("k-pc"),v("k-plaats")].filter(Boolean).join(" ");
    return ["Offerte-aanvraag glasbewassing (op maat, met foto’s)","",SOORT==="zakelijk"?`Bedrijf / VvE: ${v("k-bedrijf")}`:"",`Naam: ${v("k-naam")}`,`Adres: ${v("k-adres")}${pl?", "+pl:""}`,v("k-email")?`E-mail: ${v("k-email")}`:"",v("k-tel")?`Telefoon: ${v("k-tel")}`:"","",
      `Foto’s: ${nF()} (graag als bijlage meesturen)`,v("k-opm")?"\nOpmerking: "+v("k-opm"):"",v("k-bijz")?"Bijzonderheden: "+v("k-bijz"):"","","Aanvraagcode voor "+BEDRIJF.naam+" (niet wijzigen):","ZEEM1:"+aanvraagCode()].filter((x,i,a)=>x!==""||a[i-1]!=="").join("\n")};try{tekst=window.tekst}catch(e){}
  /* na versturen: duidelijke bevestiging met de belofte */
  function bedankt(){const m=G("msg");if(!m||m.dataset.fo)return;m.dataset.fo="1";m.className="msg";m.innerHTML="";
    const k=document.createElement("div");k.className="fo-klaar";k.innerHTML="<b>Bedankt, uw aanvraag is binnen.</b>Binnen 24 uur ontvangt u van ons uw offerte op maat"+(G("k-email").value.trim()?" per e-mail":"")+". U hoeft verder niets te doen.";m.after(k)}
  {const ind=G("indienen");if(ind)new MutationObserver(()=>{if(ind.dataset.klaar==="1"){if(ind.textContent!=="Aanvraag verstuurd ✓")ind.textContent="Aanvraag verstuurd ✓";bedankt()}}).observe(ind,{attributes:true,childList:true,characterData:true,subtree:true})}
  /* ---------- configurator-onderbalk: eigen stap, teller en knop ---------- */
  let knop=null,stapEl=null,fotoEl=null;
  function balk(){const bar=$(".cfg-bar");if(!bar||knop)return;
    stapEl=document.createElement("div");stapEl.className="fo-stap";stapEl.innerHTML="<small></small><b></b>";
    fotoEl=document.createElement("div");fotoEl.className="fo-blok fo-foto";fotoEl.innerHTML="<b></b><small>Minimaal "+MIN+" foto’s</small>";
    const bel=document.createElement("div");bel.className="fo-blok fo-24";bel.innerHTML="<b>Binnen 24 uur</b><small>uw offerte op maat</small>";
    knop=document.createElement("button");knop.type="button";knop.className="fo-knop";knop.onclick=knopKlik;
    const r=bar.querySelector(".ruimte");if(r){r.before(stapEl,fotoEl);r.after(bel)}else bar.append(stapEl,fotoEl,bel);bar.append(knop)}
  const midSt=()=>{const m=$(".cfg-mid");return m?m.dataset.st:""};
  const gegOpen=()=>{const a=G("aanvraag");return !!(a&&a.classList.contains("open")&&!a.hidden)};
  function knopKlik(){const st=midSt();
    if(st==="kies"||st==="adres"||st==="zak"){const o=G("cfgKnop");if(o)o.click();return}
    if(nF()<MIN){const i=G("ph-in");if(i)i.click();return}
    if(!gegOpen()){naarGegevens();return}
    const ind=G("indienen");if(ind){ind.scrollIntoView({behavior:"smooth",block:"center"});ind.click()}}
  function achter(){const st=$(".cfg-stage"),f=st&&st.querySelector(".cfg-foto");if(!f)return;let a=st.querySelector(".fo-achter");
    if(!a){a=document.createElement("img");a.className="fo-achter";a.alt="";a.setAttribute("aria-hidden","true");st.prepend(a);st.style.overflow="hidden"}if(f.src&&a.src!==f.src)a.src=f.src}
  function bij(){cfgTeksten();achter();const n=nF();
    const vb=G("foVerder"),tl=G("foTel");if(vb){vb.disabled=n<MIN;vb.textContent=n<MIN?(n?"Nog "+(MIN-n)+" foto"+(MIN-n>1?"’s":"")+" nodig":"Eerst foto’s maken"):"Verder naar uw gegevens"}
    if(tl)tl.textContent=n?n+(n===1?" foto":" foto’s")+(n<MIN?" · nog "+(MIN-n)+" nodig":" · meer foto’s mag altijd"):"";
    balk();if(!knop)return;const st=midSt(),klaar=G("indienen")&&G("indienen").dataset.klaar==="1";
    let s=null,t="Volgende";
    if(st==="kies"){s=["Stap 1 van 3","Particulier of zakelijk?"];t="Beginnen"}
    else if(st==="adres"){s=["Stap 1 van 3","Vul uw postcode in"];t="Volgende"}
    else if(st==="zak"){s=["Zakelijk","Vul het formulier in"];t="Versturen"}
    else if(n<MIN){s=["Stap 2 van 3",n?"Nog "+(MIN-n)+" foto"+(MIN-n>1?"’s":"")+" maken":"Maak foto’s van uw huis"];t=n?"Nog een foto":"Foto’s maken"}
    else if(!gegOpen()){s=["Stap 2 van 3",n+" foto’s, alle kanten gehad?"];t="Gegevens invullen"}
    else{s=["Laatste stap","Vul uw gegevens in"];t="Offerte aanvragen"}
    if(klaar){s=["Verstuurd","Binnen 24 uur uw offerte"];t="Verstuurd ✓"}
    if(knop.textContent!==t)knop.textContent=t;knop.disabled=!!klaar;
    stapEl.querySelector("small").textContent=s?s[0]:"";stapEl.querySelector("b").textContent=s?s[1]:"";
    fotoEl.querySelector("b").textContent=n+(n===1?" foto":" foto’s");
    /* tabbladen: Gegevens actief als het formulier open is */
    $$(".cfg-tabs button").forEach(b=>{const k=+b.dataset.n;if(k===5&&gegOpen())b.classList.add("cfg-aan");else if(k===1&&gegOpen())b.classList.remove("cfg-aan")})}
  /* uitlijnen: tekst begint waar de kolom rechts begint, knop eindigt waar die kolom eindigt */
  function lijn(){const bar=$(".cfg-bar"),bel=bar&&bar.querySelector(".fo-24"),col=$(".cfg-col");if(!bar||!bel||!knop||!col)return;
    if(!matchMedia("(min-width:1000px)").matches){bar.style.paddingRight="";bel.style.marginLeft="";knop.style.width="";return}
    const ref=col.querySelector("h1.ml-title")||col,r=ref.getBoundingClientRect(),cr=col.getBoundingClientRect(),cs=getComputedStyle(col),rechts=cr.right-parseFloat(cs.paddingRight||0),
      br=bar.getBoundingClientRect(),pr=Math.max(0,br.right-rechts),links=r.left-br.left;
    bar.style.paddingRight=pr+"px";const r0=bar.querySelector(".ruimte");if(r0)r0.style.display="none";
    bel.style.position="absolute";bel.style.left=links+"px";bel.style.top="50%";bel.style.transform="translateY(-50%)";bar.style.position=bar.style.position||"";
    knop.style.marginLeft="auto";const kw=Math.round(Math.min(220,Math.max(160,(rechts-r.left)*.42)));knop.style.width=kw+"px"}
  addEventListener("resize",lijn);
  bij();setInterval(()=>{bij();lijn()},400);
  document.addEventListener("change",e=>{if(e.target&&e.target.id==="ph-in")setTimeout(bij,600)},true);
})();
</script>
