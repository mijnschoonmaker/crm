.fo-ov .fo-kies button:hover{border-color:#0e1117}
.fo-ov .fo-kies b{font:500 15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:#0e1117}
.fo-ov .fo-kies small{grid-column:1;font-size:13px;color:#6b717c;line-height:1.45}
.fo-ov .fo-kies svg{grid-row:1/3;grid-column:2;width:16px;height:16px;color:#0e1117}
.fo-ov label.fo-v{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;font:600 10.5px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6b717c}
.fo-ov label.fo-v input,.fo-ov label.fo-v textarea{font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0;text-transform:none;color:#0e1117;border:1px solid #e3e5e8;border-radius:12px;padding:12px 14px;outline:none;background:#fff;box-sizing:border-box;width:100%}
.fo-ov label.fo-v input:focus,.fo-ov label.fo-v textarea:focus{border-color:#0e1117}
.fo-ov .fo-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fo-ov .fo-fout{color:#b42318;font-size:13px;margin:4px 0 0;min-height:18px}
.fo-ov .fo-chat{display:flex;flex-direction:column;gap:10px;max-height:46vh;min-height:160px;overflow:auto;padding:14px;margin:14px 0 12px;border-radius:14px;background:#f6f7f9}
.fo-ov .fo-m{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.fo-ov .fo-m.bez{align-self:flex-end;background:#0e1117;color:#fff;border-bottom-right-radius:4px}
.fo-ov .fo-m.team{align-self:flex-start;background:#fff;color:#0e1117;border:1px solid #e3e5e8;border-bottom-left-radius:4px}
.fo-ov .fo-m small{display:block;margin-top:4px;font-size:11px;opacity:.6}
.fo-ov .fo-wacht{align-self:center;text-align:center;font-size:12.5px;color:#8a8f98;max-width:90%}
.fo-ov .fo-in{display:flex;gap:8px}
.fo-ov .fo-in textarea{flex:1;resize:none;font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;border:1px solid #e3e5e8;border-radius:12px;padding:11px 14px;outline:none;min-height:46px;max-height:120px;box-sizing:border-box}
.fo-ov .fo-in button{all:unset;cursor:pointer;flex:0 0 auto;height:46px;padding:0 18px;border-radius:12px;background:#0e1117;color:#fff;font:600 11px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center}
.fo-ov .fo-in button[disabled]{opacity:.5}
.fo-ov .fo-link{all:unset;cursor:pointer;font-size:12.5px;color:#6b717c;text-decoration:underline;margin-top:10px;display:inline-block}

/* het gesprek als echt ticketscherm: groot, chat vult de ruimte */
.fo-ov.fo-groot .fo-doos{width:min(880px,100%);height:min(86vh,820px);display:flex;flex-direction:column;padding:34px 38px 26px}
.fo-ov.fo-groot .fo-chat{flex:1 1 auto;max-height:none;min-height:0;padding:20px;gap:12px}
.fo-ov.fo-groot .fo-m{max-width:68%;font-size:15px;padding:12px 16px}
.fo-ov.fo-groot .fo-in textarea{min-height:52px;font-size:15px}
.fo-ov.fo-groot .fo-in button{height:52px;padding:0 24px}
@media (max-width:599px){.fo-ov.fo-groot{padding:0}.fo-ov.fo-groot .fo-doos{width:100%;height:100%;max-height:none;border-radius:0;padding:24px 18px 18px}.fo-ov.fo-groot .fo-m{max-width:85%}}
/* stappen in het intro (telefoon) */
.fo-lijst{list-style:none;margin:0;padding:0}

.fo-verder button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:12px;background:#0e1117;color:#fff;
  font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-align:center}

.fo-belofte svg{flex:0 0 20px;width:20px;height:20px;color:#0e1117;margin-top:1px}
.fo-belofte b{color:#0e1117;font-weight:600;display:block}

.cfg-bar .fo-blok small{font:400 12.5px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:#6b717c}

.cfg-bar .fo-stap{display:flex;flex-direction:column;gap:3px}
.cfg-bar .fo-stap small{font:600 10.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8a8f98}
.cfg-bar .fo-stap b{font:500 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:#0e1117}
@media (max-width:999px){.cfg-bar .fo-stap,.cfg-bar .fo-foto{display:none!important}.cfg-bar .fo-knop{min-width:0;flex:1;height:52px}}
/* bedankt */

  function infoKnop(){const a=$(".cfg-acties");if(!a||a.querySelector(".fo-info"))return;const b=document.createElement("button");b.type="button";b.className="fo-info";b.setAttribute("aria-label","Over "+(B.naam||"ons"));b.title="Over ons";

  const TICKET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4V7a1 1 0 0 1 1-1z"/><path d="M14 6v12" stroke-dasharray="2 2.2"/></svg>';

  const VEP=(()=>{const e=String(B.endpoint||"");if(!/^https?:/.test(e))return "";return e.replace("/api/aanvraag","/api/vraag")})();
  const vUrl=q=>VEP+(VEP.includes("?")?"&":"?")+q;
  const VK="ms.vraag."+String(B.naam||"").toLowerCase().replace(/[^a-z0-9]+/g,"");
  const vLees=()=>{try{return JSON.parse(localStorage.getItem(VK)||"null")}catch(e){return null}},vZet=x=>{try{x?localStorage.setItem(VK,JSON.stringify(x)):localStorage.removeItem(VK)}catch(e){}};
  function venster(html,kl){const o=document.createElement("div");o.className="fo-ov"+(kl?" "+kl:"");o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");

  function nieuw(){const adr=G("k-naam");const o=venster(`<h2>Uw vraag</h2><p class="fo-sub">Wij reageren zo snel mogelijk.</p>
      <label class="fo-v">Naam<input id="fvN" autocomplete="name" value="${esc((G("k-naam")||{}).value||"")}"></label>

    setTimeout(()=>{const n=G("fvN");(n.value?G("fvQ"):n).focus()},40);
    G("fvS").onclick=async()=>{const f=o.querySelector(".fo-fout"),b=G("fvS"),d={actie:"start",naam:G("fvN").value.trim(),email:G("fvE").value.trim(),telefoon:G("fvT").value.trim(),tekst:G("fvQ").value.trim(),website_url:G("fvH").value,pagina:location.pathname};
      if(!d.naam){f.textContent="Vul uw naam in.";G("fvN").focus();return}if(!d.tekst){f.textContent="Vul uw vraag in.";G("fvQ").focus();return}

  function ticketKnop(){const a=$(".cfg-acties");if(!a||a.querySelector(".fo-tk"))return;const b=document.createElement("button");b.type="button";b.className="fo-tk";b.setAttribute("aria-label","Vraag stellen");b.title="Vraag stellen";b.innerHTML=TICKET+"Vraag stellen";b.onclick=ticket;
