<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#f5f8f8">
<title>Mijn klantomgeving</title>
<link rel="icon" href="/logo.png" type="image/png"><link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e2f36; --ink2:#47616a; --ink3:#7d9399; --paper:#f5f8f8; --card:#ffffff; --line:#e2eaeb; --soft:#eef4f5;
  --brand:#137a8a; --brand-d:#0e5f6c; --brand-s:#e0f1f3;
  --sun:#f2b33d; --sun-s:#fdf3dc; --sun-d:#8a5a00;
  --ok:#23845a; --ok-s:#e2f3ea; --warn:#b5560f; --warn-s:#fcebdc; --late:#c0392b; --late-s:#fbe6e3;
  --glass1:#d6edf2; --glass2:#f4fbfc; --frame:#0e2f36;
  --r:20px; --sh:0 1px 2px rgb(14 47 54 / .05),0 10px 30px -18px rgb(14 47 54 / .28);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e8f2f3; --ink2:#a9bec2; --ink3:#7f979c; --paper:#0c1b1f; --card:#132529; --line:#22393e; --soft:#182e33;
  --brand:#45b7c6; --brand-d:#6fd0dc; --brand-s:#123a40; --sun-s:#3a2d10; --sun-d:#f2c46a;
  --ok-s:#123826; --warn-s:#3d2410; --late-s:#3e1915; --glass1:#18414a; --glass2:#10292e; --frame:#e8f2f3;
  --sh:0 1px 2px rgb(0 0 0 / .3),0 14px 30px -18px rgb(0 0 0 / .6);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
svg{width:20px;height:20px;flex:none}

/* kop */
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.top img{height:40px;width:auto;max-width:150px;object-fit:contain}
.top .bn{font-weight:800;font-size:17px;letter-spacing:-.01em}
.top .sp{flex:1}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-s);color:var(--brand-d);display:grid;place-items:center;font-weight:800;border:0;cursor:pointer}

/* begroeting */
.hello{margin:18px 0 18px}
.hello h1{font-size:30px;line-height:1.12;letter-spacing:-.025em;margin:0;font-weight:800}
.hello p{margin:6px 0 0;color:var(--ink2)}

/* het raam: volgende bezoek */
.raam{position:relative;border-radius:28px;padding:10px;background:var(--frame);box-shadow:0 24px 50px -28px rgb(14 47 54 / .55)}
.ruit{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(160deg,var(--glass2) 0%,var(--glass1) 100%);padding:22px 22px 18px;min-height:210px}
.ruit::before{content:"";position:absolute;inset:-40% auto auto -30%;width:70%;height:180%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,rgb(255 255 255 / .55) 45%,rgb(255 255 255 / .1) 60%,transparent);pointer-events:none}
.ruit::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--frame);opacity:.08}
@media (prefers-reduced-motion:no-preference){.ruit.glans::before{animation:glans 1.6s cubic-bezier(.3,.7,.2,1) .25s both}}
@keyframes glans{from{transform:translateX(-60%) rotate(24deg);opacity:0}to{transform:none rotate(24deg);opacity:1}}
.r-kop{position:relative;color:var(--ink2);font-weight:600;font-size:15px}
.r-dag{position:relative;display:flex;align-items:flex-end;gap:14px;margin:6px 0 2px}
.r-dag b{font-size:76px;line-height:.86;font-weight:800;letter-spacing:-.05em;color:var(--ink)}
.r-dag span{display:flex;flex-direction:column;padding-bottom:4px}
.r-dag span i{font-style:normal;font-size:22px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.r-dag span em{font-style:normal;color:var(--ink2);font-weight:600}
.r-tijd{position:relative;margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:rgb(255 255 255 / .7);border-radius:99px;padding:7px 13px 7px 10px;font-weight:700;font-size:15px;color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .r-tijd{background:rgb(0 0 0 / .25)}}
.r-tijd svg{width:18px;height:18px;color:var(--brand)}
.r-over{position:absolute;right:20px;top:20px;font-weight:800;font-size:13px;color:var(--brand-d);background:var(--brand-s);padding:5px 11px;border-radius:99px}
.r-leeg h2{position:relative;font-size:24px;letter-spacing:-.02em;margin:8px 0 6px;line-height:1.2}
.r-leeg p{position:relative;margin:0;color:var(--ink2);max-width:40ch}
.r-bezig{position:relative;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-top:10px}
.puls{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgb(35 132 90 / .5)}
@media (prefers-reduced-motion:no-preference){.puls{animation:puls 1.8s infinite}}
@keyframes puls{70%{box-shadow:0 0 0 12px rgb(35 132 90 / 0)}100%{box-shadow:0 0 0 0 rgb(35 132 90 / 0)}}
.r-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0 2px}
.r-acts button{border:0;background:rgb(255 255 255 / .08);color:#fff;border-radius:14px;padding:11px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s}
.r-acts button:hover{background:rgb(255 255 255 / .16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .r-acts button{color:var(--paper);background:rgb(0 0 0 / .08)}}
.r-daarna{margin:10px 4px 0;color:var(--ink2);font-size:14px}
.r-daarna b{color:var(--ink)}

/* secties */
.sec{margin-top:28px}
.sec>h2{font-size:19px;letter-spacing:-.015em;margin:0 0 10px 2px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.sec>h2 small{font-size:14px;color:var(--ink3);font-weight:600}
.groep{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rij{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;border:0;background:none;text-align:left;cursor:default}
button.rij,a.rij{cursor:pointer;text-decoration:none;color:inherit}
button.rij:hover,a.rij:hover{background:var(--soft)}
.rij+.rij{border-top:1px solid var(--line)}
.rij .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--brand);flex:none}
.rij .tx{flex:1;min-width:0}.rij .tx b{display:block;font-weight:700}.rij .tx small{display:block;color:var(--ink2);font-size:14px;line-height:1.4}
.rij .rt{text-align:right;font-weight:700;white-space:nowrap}.rij .rt small{display:block;font-weight:600;font-size:13px}
.rij .chev{color:var(--ink3);width:18px;height:18px}
.pil{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px}
.pil.ok{background:var(--ok-s);color:var(--ok)}.pil.open{background:var(--brand-s);color:var(--brand-d)}.pil.late{background:var(--late-s);color:var(--late)}.pil.wacht{background:var(--sun-s);color:var(--sun-d)}.pil.grijs{background:var(--soft);color:var(--ink2)}

/* meldingen op home */
.melding{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:12px}
.melding .tx{flex:1;min-width:0}.melding b{display:block}.melding small{color:var(--ink2);font-size:14px}
.melding .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.melding.fact .ic{background:var(--late-s);color:var(--late)}
.melding.tegoed .ic{background:var(--sun-s);color:var(--sun-d)}
.knop{border:0;border-radius:13px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:filter .15s,transform .1s}
.knop:hover{filter:brightness(1.07)}.knop:active{transform:scale(.98)}
.knop.zacht{background:var(--brand-s);color:var(--brand-d)}
.knop.licht{background:var(--soft);color:var(--ink)}
.knop.groot{width:100%;padding:15px;font-size:16.5px;border-radius:15px}
.knop:disabled{opacity:.55;cursor:default}
.blad .acties .knop{white-space:nowrap}

/* sterren */
.beoor{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:12px}
.beoor b{display:block;font-size:17px}.beoor small{color:var(--ink2)}
.sterren{display:flex;gap:6px;margin-top:12px}
.sterren button{border:0;background:var(--soft);width:48px;height:48px;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:var(--ink3);transition:all .12s}
.sterren button svg{width:26px;height:26px}
.sterren button.aan{background:var(--sun-s);color:var(--sun)}
.sterren button:hover{transform:translateY(-2px)}

/* aanbevelen */
.ref-hero{position:relative;overflow:hidden;background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:24px 22px 22px}
.ref-hero .bedrag{display:flex;align-items:baseline;gap:10px}
.ref-hero .bedrag b{font-size:58px;line-height:1;font-weight:800;letter-spacing:-.045em;color:var(--sun-d)}
.ref-hero .bedrag span{font-weight:700;color:var(--ink2);max-width:18ch;line-height:1.3}
.ref-hero h2{font-size:22px;letter-spacing:-.02em;margin:14px 0 6px;line-height:1.2}
.ref-hero p{margin:0;color:var(--ink2)}
.ref-hero .zon{position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--sun-s) 0 55%,transparent 56%);opacity:.9}
.stappen{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
.stappen li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.stappen li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--sun-s);color:var(--sun-d);font-weight:800;font-size:13.5px;display:grid;place-items:center;flex:none;margin-top:1px}
.code{display:flex;align-items:center;gap:10px;margin-top:18px;background:var(--soft);border-radius:14px;padding:6px 6px 6px 16px}
.code b{flex:1;font-size:20px;letter-spacing:.08em;font-weight:800}
.deel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.deel .knop{flex-direction:column;gap:6px;padding:12px 6px;font-size:14px}
.deel .wa{background:#1f9d55}

/* lijst bezoeken: tijdlijn */
.tl{position:relative}
.tl .rij .ic{background:var(--ok-s);color:var(--ok)}
.tl .rij.komt .ic{background:var(--brand-s);color:var(--brand)}
.mini-st{display:inline-flex;gap:1px;color:var(--sun)}.mini-st svg{width:13px;height:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stats div{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px}
.stats b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stats small{color:var(--ink2);font-size:13.5px}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:700;color:var(--ink3);cursor:pointer;border-radius:12px;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:99px;background:var(--late);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
@media(min-width:760px){
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:6px 16px}
  .tabs .in{display:flex;gap:4px}
  .tabs button{flex-direction:row;gap:7px;font-size:14.5px;padding:9px 14px}
  .tabs button svg{width:19px;height:19px}
  .tabs button[aria-current="page"]{background:var(--brand-s)}
  .tabs .dot{position:static;margin-left:2px}
  .wrap{padding-bottom:60px}
}

/* bladen (sheets) */
.ov{position:fixed;inset:0;z-index:50;background:rgb(10 30 34 / .38);display:flex;align-items:flex-end;justify-content:center}
@media (prefers-reduced-motion:no-preference){.ov{animation:fade .18s ease-out}.blad{animation:op .28s cubic-bezier(.2,.9,.25,1)}}
@keyframes fade{from{opacity:0}}@keyframes op{from{transform:translateY(40px);opacity:.4}}
.blad{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom))}
.blad .greep{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@media(min-width:620px){.ov{align-items:center}.blad{border-radius:26px;padding-bottom:22px}.blad .greep{display:none}}
.blad h3{font-size:22px;letter-spacing:-.02em;margin:4px 0 4px;line-height:1.2}
.blad .sub{color:var(--ink2);margin:0 0 16px}
.veld{display:block;margin:0 0 14px}
.veld>span{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
.veld input,.veld textarea,.veld select{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:13px;padding:12px 14px;font-size:16px;outline:none}
.veld input:focus,.veld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
.veld textarea{min-height:100px;resize:vertical}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keus{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.keus label{cursor:pointer}
.keus input{position:absolute;opacity:0;pointer-events:none}
.keus span{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14.5px;transition:all .12s}
.keus input:checked+span{border-color:var(--brand);background:var(--brand-s);color:var(--brand-d)}
.keus input:focus-visible+span{outline:2.5px solid var(--brand);outline-offset:2px}
.blad .acties{display:flex;gap:10px;margin-top:8px}.blad .acties .knop{flex:1}
.fout{color:var(--late);font-weight:600;font-size:14.5px;min-height:20px;margin:4px 0 0}
.klaar-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-s);color:var(--ok);display:grid;place-items:center;margin:10px auto 14px}
.klaar-ic svg{width:30px;height:30px}

/* factuur */
.fact-doc{border:1px solid var(--line);border-radius:16px;padding:18px;margin:6px 0 14px;font-size:14.5px}
.fact-doc .fh{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.fact-doc table{width:100%;border-collapse:collapse}
.fact-doc td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.fact-doc td.r{text-align:right;white-space:nowrap;padding-left:10px}
.fact-doc tr.tot td{border:0;font-weight:800;font-size:17px;padding-top:12px}
.fact-doc tr.sub td{border:0;color:var(--ink2);padding:3px 0}
.fact-doc .neg{color:var(--ok)}

/* inloggen / welkom */
.welkom{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;padding:30px 20px}
.welkom .logo{height:64px;width:auto;max-width:200px;object-fit:contain;align-self:flex-start;margin-bottom:28px}
.welkom h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0 0 10px}
.welkom p{color:var(--ink2);margin:0 0 24px;font-size:17px}
.welkom .klein{font-size:14px;color:var(--ink3);margin-top:16px}
.ruitje{width:100%;height:130px;border-radius:22px;background:var(--frame);padding:8px;margin-bottom:26px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ruitje i{border-radius:15px;background:linear-gradient(160deg,var(--glass2),var(--glass1));position:relative;overflow:hidden}
.ruitje i::before{content:"";position:absolute;inset:-40% auto auto -40%;width:60%;height:200%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,rgb(255 255 255 / .6),transparent)}
.laden{display:grid;place-items:center;min-height:70vh;color:var(--ink2);gap:14px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand)}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(1turn)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;box-shadow:var(--sh);max-width:calc(100% - 32px)}
.leeg{padding:26px 18px;text-align:center;color:var(--ink2)}
.voet{text-align:center;color:var(--ink3);font-size:13px;margin-top:34px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--brand-s);color:var(--brand-d);border-radius:14px;padding:12px 14px;font-size:14.5px;margin-bottom:14px}
.hint svg{margin-top:1px}
@media print{.tabs,.top,.blad .acties,.blad .greep,.ov~*{display:none!important}.ov{position:static;background:none}.blad{max-height:none;box-shadow:none;padding:0}body>.wrap{display:none}}
</style></head>
<body><div id="app"><div class="laden"><div class="spin"></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(n<0?"− ":"")+"€ "+(Math.round(Math.abs(+n||0)*100)/100).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const eur0=n=>{n=Math.round((+n||0)*100)/100;return "€ "+(n%1?n.toFixed(2).replace(".",","):String(n))};
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  huis:sv('<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),
  kal:sv('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  fact:sv('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>'),
  hart:sv('<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/>'),
  ik:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  klok:sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  verzet:sv('<path d="M4 7h13l-3-3M20 17H7l3 3"/>'),
  pauze:sv('<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'),
  sleutel:sv('<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/>'),
  check:sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  chev:sv('<path d="m9 6 6 6-6 6"/>'),
  ster:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>',
  tel:sv('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
  mail:sv('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>'),

const MND=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const p=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const vandaag=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dagNaam=d=>d.toLocaleDateString("nl-NL",{weekday:"long"});
const lang=s=>{const d=p(s);return dagNaam(d)+" "+d.getDate()+" "+MND[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")};
const kort=s=>{const d=p(s);return d.getDate()+" "+MND[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")};
const dagenTot=s=>Math.round((p(s)-vandaag())/864e5);
const overTxt=n=>n===0?"Vandaag":n===1?"Morgen":n<7?"Over "+n+" dagen":n<14?"Volgende week":"Over "+Math.round(n/7)+" weken";
const groet=()=>{const h=new Date().getHours();return h<6?"Goedenacht":h<12?"Goedemorgen":h<18?"Goedemiddag":"Goedenavond"};
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?+m[1]*60+ +m[2]:null};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function tijdTxt(t,w){const m=toMin(t);if(m==null)return"In de loop van de dag";
  if(w==="exact")return"Rond "+hm(m);
  if(w==="vak")return m<720?"In de ochtend":m<1020?"In de middag":"In de avond";
  const s=Math.floor(m/30)*30;return"Tussen "+hm(s)+" en "+hm(s+120)}
const weekNr=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};

/* ---------- api ---------- */
const SK="ms.portaal.s";
const sessie={get(){try{return localStorage.getItem(SK)||""}catch(e){return window.__s||""}},set(v){window.__s=v;try{v?localStorage.setItem(SK,v):localStorage.removeItem(SK)}catch(e){}}};
async function api(pad,opt={}){
  const r=await fetch("/api/portaal/"+pad,{method:opt.body?"POST":"GET",headers:{...(opt.body?{"content-type":"application/json"}:{}),...(sessie.get()?{authorization:"Bearer "+sessie.get()}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!opt.open){sessie.set("");toonLogin();throw new Error("uit")}
  if(!r.ok)throw new Error(j.fout||"Er ging iets mis. Probeer het zo opnieuw.");
  return j}
function toast(t){const o=document.createElement("div");o.className="toast";o.setAttribute("role","status");o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),3200)}

let B={naam:"",logo:"/logo.png"};
function welkomKop(){return `<img class="logo" src="/logo.png" alt="${esc(B.naam||"mijnschoonmaker.com")}" onerror="this.remove()">`}
function toonLogin(melding){
  document.title="Inloggen · klantomgeving";
  $("#app").innerHTML=`<main class="welkom">${welkomKop()}
    <div class="ruitje" aria-hidden="true"><i></i><i></i></div>
    <h1>Uw ramen, uw afspraken, alles op één plek</h1>
    <p>Vul het e-mailadres in dat bij ons bekend is. U ontvangt direct een link om in te loggen, zonder wachtwoord.</p>
    ${melding?`<div class="hint">${I.klok}<span>${esc(melding)}</span></div>`:""}
    <form id="lf" novalidate><label class="veld"><span>E-mailadres</span><input type="email" id="le" autocomplete="email" inputmode="email" placeholder="naam@voorbeeld.nl" required></label>
    <button class="knop groot" id="lb">${I.mail}Stuur mij een inloglink</button><p class="fout" id="lfout" role="alert"></p></form>
    <p class="klein">Nog geen klant? Bereken uw prijs op onze website. Vragen? Bel of app ons gerust.</p></main>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const v=$("#le").value.trim(),b=$("#lb");$("#lfout").textContent="";
    if(!/^\S+@\S+\.\S+$/.test(v)){$("#lfout").textContent="Vul een geldig e-mailadres in.";$("#le").focus();return}
    b.disabled=true;b.innerHTML=`<span class="spin" style="width:18px;height:18px;border-width:2px"></span>Versturen…`;
    try{await api("login",{body:{email:v},open:true});
      $("#app").innerHTML=`<main class="welkom">${welkomKop()}<div class="klaar-ic" style="margin:0 0 20px;background:var(--brand-s);color:var(--brand)">${I.mail}</div>
        <h1>Kijk in uw mailbox</h1><p>Als <b>${esc(v)}</b> bij ons bekend is, staat er nu een mail met een inlogknop voor u klaar. De knop werkt een uur.</p>
        <p class="klein">Niets ontvangen? Kijk ook bij ongewenste mail, of gebruik het e-mailadres waarop u onze facturen ontvangt.</p>
        <button class="knop licht" id="opn">Ander e-mailadres proberen</button></main>`;
      $("#opn").onclick=()=>toonLogin()}
    catch(er){b.disabled=false;b.innerHTML=I.mail+"Stuur mij een inloglink";$("#lfout").textContent=er.message}};
  setTimeout(()=>{const i=$("#le");if(i)i.focus()},50)}

function aanbevelen(){const A=D.aanbevelen,naam=D.klant.voornaam;
  const st={aangemeld:["wacht","Aangemeld"],akkoord:["wacht","Wacht op akkoord"],eerste:["open","Eerste bezoek volgt"],klant:["open","Eerste bezoek volgt"],beloond:["ok","Korting vrijgegeven"],gestopt:["grijs","Niet doorgegaan"]};

  return `<div class="hello"><h1>Aanbevelen</h1><p>Wie u aanbeveelt, krijgt een welkomstkorting. En u wordt bedankt.</p></div>

      <div class="bedrag" style="position:relative"><b>${eur0(B.refBeloning)}</b><span>korting op uw volgende factuur, per nieuwe klant</span></div>
      <h2 style="position:relative">Kent u iemand die ook schone ramen wil?</h2>
      <p style="position:relative">${B.refWelkom>0?`Zij krijgen ${eur0(B.refWelkom)} korting op hun eerste factuur. `:""}Uw korting geven we vrij zodra zij akkoord hebben gegeven en wij er voor het eerst zijn geweest.</p>
      <ol class="stappen"><li>Deel uw persoonlijke link via WhatsApp of mail</li><li>Zij berekenen hun prijs en melden zich aan</li><li>Uw korting staat on hold tot zij akkoord hebben gegeven en wij de eerste afspraak hebben uitgevoerd</li><li>Daarna gaat ${eur0(B.refBeloning)} van uw volgende factuur af</li></ol>
      <div class="code"><b>${esc(A.code)}</b><button class="knop zacht" data-kopie>${I.kopie}Kopieer link</button></div>
      <div class="deel"><a class="knop wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(deelTekst())}">${I.wa}WhatsApp</a><a class="knop zacht" href="mailto:?subject=${encodeURIComponent("Tip: "+B.naam)}&body=${encodeURIComponent(deelTekst())}">${I.mail}Mail</a><button class="knop zacht" data-deel>${I.deel}Delen</button></div>
    </section>
    ${A.tegoed>0||A.verdiend>0||hold>0?`<div class="stats" style="margin-top:14px"><div><b>${eur0(hold)}</b><small>on hold</small></div><div><b>${eur0(A.tegoed)}</b><small>klaar voor uw volgende factuur</small></div><div><b>${eur0(A.verdiend)}</b><small>al verrekend</small></div></div>`:""}
    ${hold>0?`<div class="hint" style="margin-top:12px">${I.klok}<span>Korting die on hold staat, geven we vrij zodra de nieuwe klant akkoord heeft gegeven en wij de eerste afspraak hebben uitgevoerd.</span></div>`:""}
    <section class="sec"><h2>Uw aanbevelingen <small>${A.lijst.length||""}</small></h2><div class="groep">${A.lijst.length?A.lijst.map(x=>`<div class="rij"><span class="ic" style="background:var(--sun-s);color:var(--sun-d)">${I.hart}</span><div class="tx"><b>${esc(x.naam||"Nieuwe klant")}</b><small>${x.datum?esc(kort(x.datum.slice(0,10))):""}</small></div><span class="pil ${st[x.status][0]}">${st[x.status][1]}</span></div>`).join(""):`<div class="leeg">Nog niemand aanbevolen. Uw buren zien vast al dat uw ramen blinken.</div>`}</div></section>`}
function deelTekst(){return `Ik laat mijn ramen wassen door ${B.naam} en ben er heel tevreden over.${B.refWelkom>0?` Met mijn link krijg je ${eur0(B.refWelkom)} korting op je eerste factuur:`:" Bereken je prijs via mijn link:"} ${D.aanbevelen.link}`}

function ik(){const k=D.klant,t=k.toegang||{};
  const tel=(B.mobiel||B.telefoon||"").replace(/[^\d+]/g,""),wa=tel.replace(/^\+/,"").replace(/^0/,"31");
  return `<div class="hello"><h1>Contact</h1><p>We helpen u graag. Bel, app of stuur een bericht.</p></div>
    <div class="groep">
      ${tel?`<a class="rij" href="tel:${esc(tel)}"><span class="ic">${I.tel}</span><div class="tx"><b>Bellen</b><small>${esc(B.telefoon||B.mobiel)}</small></div>${I.chev}</a>
      <a class="rij" target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}"><span class="ic" style="color:#1f9d55">${I.wa}</span><div class="tx"><b>WhatsApp</b><small>Meestal binnen een paar uur antwoord</small></div>${I.chev}</a>`:""}
      <button class="rij" data-act="bericht"><span class="ic">${I.bericht}</span><div class="tx"><b>Bericht sturen</b><small>Komt direct bij ons binnen</small></div>${I.chev}</button>
      ${B.email?`<a class="rij" href="mailto:${esc(B.email)}"><span class="ic">${I.mail}</span><div class="tx"><b>E-mail</b><small>${esc(B.email)}</small></div>${I.chev}</a>`:""}
    </div>
    <section class="sec"><h2>Bij u thuis</h2><div class="groep">
      <button class="rij" data-act="toegang"><span class="ic">${I.sleutel}</span><div class="tx"><b>Toegang en instructies</b><small>${(t.opties||[]).length||t.tekst?esc([...(t.opties||[]),t.tekst].filter(Boolean).join(" · ")).slice(0,90):"Bijvoorbeeld: achterom is open, hond aanwezig"}</small></div>${I.chev}</button>
      <button class="rij" data-act="vakantie"><span class="ic">${I.zon}</span><div class="tx"><b>Afwezigheid doorgeven</b><small>Op vakantie of verbouwing? Laat het ons weten</small></div>${I.chev}</button>
    </div></section>
    <section class="sec"><h2>Mijn gegevens</h2><div class="groep">
      <div class="rij"><span class="ic">${I.huis}</span><div class="tx"><b>${esc(k.naam)}</b><small>${esc(k.adres)}<br>${esc(k.pcPlaats)}</small></div></div>
      <button class="rij" data-act="gegevens"><span class="ic">${I.tel}</span><div class="tx"><b>Telefoon en e-mail</b><small>${esc([k.telefoon,k.email].filter(Boolean).join(" · ")||"Nog niet bekend")}</small></div>${I.chev}</button>
      ${k.klantnr?`<div class="rij"><span class="ic">${I.doc}</span><div class="tx"><b>Klantnummer</b><small>${esc(k.klantnr)}</small></div></div>`:""}
      ${B.voorwaarden?`<a class="rij" href="${esc(B.voorwaarden)}" target="_blank" rel="noopener"><span class="ic">${I.doc}</span><div class="tx"><b>Algemene voorwaarden</b><small>PDF</small></div>${I.chev}</a>`:""}
      <button class="rij" id="uit"><span class="ic">${I.uit}</span><div class="tx"><b>Uitloggen</b><small>Op dit apparaat</small></div></button>
    </div></section>`}

/* ---------- interactie ---------- */
function koppel(){
  $$("[data-act]").forEach(b=>b.onclick=()=>FORM[b.dataset.act]());
  $$("[data-fact]").forEach(b=>b.onclick=()=>openFactuur(b.dataset.fact));
  $$("[data-ster]").forEach(b=>{b.onmouseenter=()=>$$("[data-ster]").forEach(x=>x.classList.toggle("aan",+x.dataset.ster<=+b.dataset.ster));b.onclick=()=>beoordeel(+b.dataset.ster)});
  const g=$("#beoor .sterren");if(g)g.onmouseleave=()=>$$("[data-ster]").forEach(x=>x.classList.remove("aan"));
  const kc=$("[data-kopie]");if(kc)kc.onclick=async()=>{try{await navigator.clipboard.writeText(D.aanbevelen.link);toast("Link gekopieerd")}catch(e){prompt("Kopieer deze link",D.aanbevelen.link)}};
  const dl=$("[data-deel]");if(dl)dl.onclick=async()=>{if(navigator.share){try{await navigator.share({title:B.naam,text:deelTekst()})}catch(e){}}else{try{await navigator.clipboard.writeText(deelTekst());toast("Tekst met link gekopieerd")}catch(e){}}};
  const u=$("#uit");if(u)u.onclick=async()=>{try{await api("uit",{body:{}})}catch(e){}sessie.set("");toonLogin()};
}
function blad(html,na){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="blad" role="dialog" aria-modal="true"><div class="greep"></div>${html}</div>`;
  const sluit=()=>{o.remove();document.removeEventListener("keydown",k)};const k=e=>{if(e.key==="Escape")sluit()};
  o.addEventListener("click",e=>{if(e.target===o||e.target.closest("[data-sluit]"))sluit()});document.addEventListener("keydown",k);document.body.appendChild(o);
  setTimeout(()=>{const f=o.querySelector("input,textarea,select,button.knop");if(f&&!matchMedia("(hover:none)").matches)f.focus()},60);if(na)na(o,sluit);return sluit}
function bedankt(o,titel,tekst){o.querySelector(".blad").innerHTML=`<div class="greep"></div><div class="klaar-ic">${I.check}</div><h3 style="text-align:center">${esc(titel)}</h3><p class="sub" style="text-align:center">${esc(tekst)}</p><div class="acties"><button class="knop licht" data-sluit>Sluiten</button></div>`}
async function verstuur(o,body,titel,tekst){const b=o.querySelector("[data-go]"),f=o.querySelector(".fout");f.textContent="";b.disabled=true;
  try{await api("actie",{body});bedankt(o,titel,tekst);laad(true)}catch(e){b.disabled=false;f.textContent=e.message}}
const isoP=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const FORM={
  verzetten(){const v=D.volgende;blad(`<h3>Afspraak verzetten</h3><p class="sub">${v?"Gepland op "+esc(lang(v.datum))+". ":""}Laat ons weten wat beter uitkomt, dan zoeken wij een nieuw moment in de route.</p>
    <span class="veld"><span>Wat komt beter uit?</span></span><div class="keus">${["Eerder","Later","Andere dag in dezelfde week","Maakt niet uit, als ik maar thuis ben"].map((x,i)=>`<label><input type="radio" name="vk" value="${esc(x)}"${i===1?" checked":""}><span>${esc(x)}</span></label>`).join("")}</div>
    <label class="veld"><span>Toelichting (niet verplicht)</span><textarea id="vt" placeholder="Bijvoorbeeld: die week ben ik er niet, maandag en dinsdag kan altijd"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Verzoek versturen</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"verzetten",datum:v&&v.datum,voorkeur:(o.querySelector("[name=vk]:checked")||{}).value,tekst:o.querySelector("#vt").value},"Verzoek ontvangen","We kijken naar een nieuw moment en laten het u zo snel mogelijk weten."))},
  overslaan(){const v=D.volgende;blad(`<h3>Bezoek overslaan</h3><p class="sub">${v?"Het bezoek van "+esc(lang(v.datum))+" slaan we dan over. ":""}Het bezoek daarna gaat gewoon door.</p>
    <label class="veld"><span>Reden (niet verplicht)</span><textarea id="vt" placeholder="Bijvoorbeeld: verbouwing, steiger staat voor het huis"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Overslaan aanvragen</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"overslaan",datum:v&&v.datum,tekst:o.querySelector("#vt").value},"Verzoek ontvangen","We passen de planning aan en bevestigen het aan u."))},
  vakantie(){const t=isoP(new Date());blad(`<h3>Afwezig of op vakantie</h3><p class="sub">Dan plannen we u niet in die periode, of komen we gewoon als we buiten kunnen werken. Laat het ons weten.</p>
    <div class="duo"><label class="veld"><span>Van</span><input type="date" id="v1" min="${t}"></label><label class="veld"><span>Tot en met</span><input type="date" id="v2" min="${t}"></label></div>
    <div class="keus"><label><input type="radio" name="vw" value="Liever niet komen" checked><span>Liever niet komen</span></label><label><input type="radio" name="vw" value="Buiten mag gewoon"><span>Buiten mag gewoon</span></label></div>
    <label class="veld"><span>Opmerking (niet verplicht)</span><textarea id="vt"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Doorgeven</button></div>`,
    o=>{o.querySelector("#v1").onchange=e=>{const b=o.querySelector("#v2");b.min=e.target.value;if(!b.value||b.value<e.target.value)b.value=e.target.value};
      o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"vakantie",datum:o.querySelector("#v1").value,tot:o.querySelector("#v2").value,tekst:[(o.querySelector("[name=vw]:checked")||{}).value,o.querySelector("#vt").value].filter(Boolean).join(". ")},"Fijne tijd!","We houden er rekening mee in de planning.")})},
  toegang(){const t=D.klant.toegang||{},op=t.opties||[];const OPT=["Achterom is open","Poort zit op slot","Hond aanwezig","Bel aan bij aankomst","Niet aanbellen","Auto voor de deur","Ladder via de buren","Let op de plantenbakken"];
    blad(`<h3>Toegang en instructies</h3><p class="sub">Zo weet de glazenwasser precies wat hij kan verwachten. We nemen dit mee bij elk bezoek.</p>
    <div class="keus">${OPT.map(x=>`<label><input type="checkbox" value="${esc(x)}"${op.includes(x)?" checked":""}><span>${esc(x)}</span></label>`).join("")}</div>
    <label class="veld"><span>Verder nog iets?</span><textarea id="vt" placeholder="Bijvoorbeeld: sleutel van de poort ligt onder de bloempot links">${esc(t.tekst||"")}</textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Opslaan</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"toegang",opties:[...o.querySelectorAll(".keus input:checked")].map(x=>x.value),tekst:o.querySelector("#vt").value},"Opgeslagen","Uw glazenwasser ziet dit bij het volgende bezoek."))},
  bericht(){blad(`<h3>Bericht sturen</h3><p class="sub">Een vraag, compliment of iets dat beter kan. We lezen alles.</p>
    <label class="veld"><span>Uw bericht</span><textarea id="vt" style="min-height:140px"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Versturen</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"bericht",tekst:o.querySelector("#vt").value},"Bericht ontvangen","Dank u wel. We reageren zo snel mogelijk."))},
  gegevens(){const k=D.klant;blad(`<h3>Telefoon en e-mail</h3><p class="sub">Klopt er iets niet meer? Geef het nieuwe nummer of adres door, dan passen wij het aan.</p>
    <label class="veld"><span>Telefoonnummer</span><input type="tel" id="gt" autocomplete="tel" value="${esc(k.telefoon)}"></label>
    <label class="veld"><span>E-mailadres</span><input type="email" id="ge" autocomplete="email" value="${esc(k.email)}"></label>
    <label class="veld"><span>Ander adres of andere wijziging</span><textarea id="vt" placeholder="Bijvoorbeeld: we verhuizen per 1 december naar …"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Doorgeven</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"gegevens",telefoon:o.querySelector("#gt").value,email:o.querySelector("#ge").value,tekst:o.querySelector("#vt").value},"Doorgegeven","We passen uw gegevens aan."))},
  extra(){const X=["Kozijnen reinigen","Binnenzijde ramen","Zonnepanelen","Dakgoot schoonmaken","Serre of veranda","Eenmalige schoonmaak na verbouwing"];
    blad(`<h3>Iets extra laten doen</h3><p class="sub">Kies wat u wilt. We nemen het mee bij een volgend bezoek en sturen u vooraf de prijs.</p>
    <div class="keus">${X.map(x=>`<label><input type="checkbox" value="${esc(x)}"><span>${esc(x)}</span></label>`).join("")}</div>
    <label class="veld"><span>Toelichting (niet verplicht)</span><textarea id="vt"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Prijs aanvragen</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>{const d=[...o.querySelectorAll(".keus input:checked")].map(x=>x.value);if(!d.length&&!o.querySelector("#vt").value.trim()){o.querySelector(".fout").textContent="Kies minstens één dienst.";return}
      verstuur(o,{type:"extra",diensten:d,tekst:o.querySelector("#vt").value},"Aanvraag ontvangen","We sturen u de prijs en plannen het in overleg in.")})}
};
async function beoordeel(n){const b=D.teBeoordelen;if(!b)return;
  if(n>=4){try{await api("actie",{body:{type:"beoordeling",beurtId:b.id,sterren:n}})}catch(e){toast(e.message);return}
    blad(`<div class="klaar-ic" style="background:var(--sun-s);color:var(--sun)">${I.ster}</div><h3 style="text-align:center">Wat fijn om te horen!</h3><p class="sub" style="text-align:center">${B.reviewLink?"Zou u dat ook met anderen willen delen? Een korte Google-review helpt ons enorm.":"Dank u wel voor uw beoordeling."}</p>
      <div class="acties">${B.reviewLink?`<button class="knop licht" data-sluit>Nu niet</button><a class="knop" target="_blank" rel="noopener" href="${esc(B.reviewLink)}">Review schrijven</a>`:`<button class="knop" data-sluit>Sluiten</button>`}</div>`);laad(true);return}
  blad(`<h3>Dank voor uw eerlijkheid</h3><p class="sub">Wat kon er beter? Dan zorgen we dat het de volgende keer wel goed gaat. Waar nodig nemen we contact met u op.</p>
    <label class="veld"><span>Wat ging er mis?</span><textarea id="vt" placeholder="Bijvoorbeeld: strepen op het keukenraam"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="knop licht" data-sluit>Annuleren</button><button class="knop" data-go>Versturen</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"beoordeling",beurtId:b.id,sterren:n,tekst:o.querySelector("#vt").value},"Dank u wel","We nemen uw opmerking serieus en komen erop terug."))}
async function openFactuur(id){let f;const sluit=blad(`<div class="laden" style="min-height:200px"><div class="spin"></div></div>`);
  try{f=await api("factuur?id="+encodeURIComponent(id))}catch(e){sluit();toast(e.message);return}sluit();
  const b=f.bedrijf,open=f.status==="open"||f.status==="verlopen";
  blad(`<h3>Factuur ${esc(f.nummer)}</h3><p class="sub">${f.status==="betaald"?"Betaald"+(f.betaaldOp?" op "+esc(kort(f.betaaldOp)):"")+". Dank u wel.":f.status==="verlopen"?"De betaaltermijn is verstreken op "+esc(kort(f.verval))+".":"Graag betalen voor "+esc(kort(f.verval))+"."}</p>
    <div class="fact-doc"><div class="fh"><div><b>${esc(b.naam)}</b><br><small style="color:var(--ink2)">${esc(b.adres)}${b.pcPlaats?"<br>"+esc(b.pcPlaats):""}</small></div><div style="text-align:right"><small style="color:var(--ink2)">Datum</small><br><b>${esc(kort(f.datum))}</b></div></div>
      <table>${f.regels.map(r=>`<tr><td>${esc(r.omschrijving)}${r.aantal!==1?` <span style="color:var(--ink2)">× ${String(r.aantal).replace(".",",")}</span>`:""}</td><td class="r${r.prijs<0?" neg":""}">${eur(r.aantal*r.prijs)}</td></tr>`).join("")}
      <tr class="sub"><td>Subtotaal excl. btw</td><td class="r">${eur(f.ex)}</td></tr><tr class="sub"><td>Btw ${f.btwPct}%</td><td class="r">${eur(f.btw)}</td></tr><tr class="tot"><td>Totaal</td><td class="r">${eur(f.inc)}</td></tr></table>
      ${f.notitie?`<p style="color:var(--ink2);margin:10px 0 0;white-space:pre-line">${esc(f.notitie)}</p>`:""}
      <p style="color:var(--ink3);font-size:12.5px;margin:12px 0 0">${[b.kvk&&"KvK "+b.kvk,b.btwnr&&"Btw "+b.btwnr,b.iban&&"IBAN "+b.iban].filter(Boolean).map(esc).join(" · ")}</p></div>
    ${open&&b.iban?`<div class="hint">${I.euro}<span>Liever overmaken? ${eur(f.inc)} naar <b>${esc(b.iban)}</b> t.n.v. ${esc(b.naam)} onder vermelding van ${esc(f.nummer)}.</span></div>`:""}
    <p class="fout" role="alert"></p>
    <div class="acties"><button class="knop licht" onclick="print()">${I.print}Bewaren</button>${open?`<button class="knop" data-betaal>${I.euro}Nu betalen</button>`:`<button class="knop" data-sluit>Sluiten</button>`}</div>`,
    o=>{const b2=o.querySelector("[data-betaal]");if(b2)b2.onclick=async()=>{b2.disabled=true;try{const r=f.betaallink?{link:f.betaallink}:await api("betaal",{body:{id}});if(r.link)location.href=r.link}catch(e){b2.disabled=false;o.querySelector(".fout").textContent=e.message}}})}

/* ---------- start ---------- */
(async()=>{const q=new URLSearchParams(location.search),seg=location.pathname.split("/").filter(Boolean);
  if(seg[0]==="aanbevolen"&&seg[1])return toonAanbevolen(decodeURIComponent(seg[1]).toUpperCase());
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;
  if(q.get("l")){$("#app").innerHTML=`<div class="laden"><div class="spin"></div><span>Even geduld, we openen uw omgeving…</span></div>`;
    try{const r=await api("sessie",{body:{l:q.get("l")},open:true});sessie.set(r.s);history.replaceState(null,"",location.pathname)}catch(e){history.replaceState(null,"",location.pathname);return toonLogin(e.message)}}
  if(q.get("betaald")){tab="facturen";history.replaceState(null,"",location.pathname);setTimeout(()=>toast("Dank u wel! Uw betaling wordt verwerkt."),600)}
  if(!sessie.get())return toonLogin();
  laad()})();
</script></body></html>
