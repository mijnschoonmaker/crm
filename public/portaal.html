<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#f5f8f8">
<title>Mijn klantomgeving</title>
<link rel="icon" href="/logo.png" type="image/png"><link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f7; --bg-tint-a:rgb(19 122 138 / .07); --bg-tint-b:rgb(240 170 110 / .07);
  --surface:#ffffff; --surface-2:#eef3f4; --surface-3:#e4ecee; --ink:#0f1f26; --muted:#5d6f76; --line:#dde5e8;
  --brand:#137a8a; --brand-2:#1d5a74; --brand-ink:#ffffff; --brand-soft:#ddf0f2;
  --accent:#e3b23c; --late:#c0392b; --late-bg:#fce8e5; --soon:#a8650a; --soon-bg:#fdf1dc; --ok:#23845a; --ok-bg:#e0f3e9;
  --shadow:0 1px 2px rgb(15 31 38 / .05),0 6px 20px rgb(15 31 38 / .06);
  --f-ui:"Manrope",system-ui,-apple-system,sans-serif;
  --f-title:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1417; --bg-tint-a:rgb(63 178 191 / .07); --bg-tint-b:rgb(240 170 110 / .04);
  --surface:#122126; --surface-2:#182b31; --surface-3:#203840; --ink:#e3ecee; --muted:#93a8ad; --line:#24393f;
  --brand:#3fb2bf; --brand-2:#2a87a3; --brand-ink:#04181b; --brand-soft:#123a40;
  --accent:#ebbd4c; --late:#ff8b7b; --late-bg:#3a1b17; --soon:#f1c25f; --soon-bg:#33290e; --ok:#7fd39b; --ok-bg:#15301f;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background:radial-gradient(1200px 600px at 85% -10%,var(--bg-tint-b),transparent 60%),radial-gradient(900px 500px at 20% 0%,var(--bg-tint-a),transparent 60%),var(--bg);background-attachment:fixed}
svg{width:20px;height:20px;flex:none}
a{color:var(--brand)}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* knoppen zoals het CRM */
button,.btn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:active,.btn:active{transform:scale(.97)}
button:hover,.btn:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
button svg,.btn svg{width:17px;height:17px}
.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2))!important;border-color:transparent!important;color:var(--brand-ink)!important;box-shadow:0 6px 16px rgb(19 122 138 / .25)!important}
.ghost{background:transparent!important;border-color:transparent!important;box-shadow:none!important;color:var(--muted)}
.wa{background:#1f9d55!important;border-color:transparent!important;color:#fff!important}
button:disabled{opacity:.55;cursor:default;transform:none}
.full{width:100%}.big{padding:14px 18px;font-size:15.5px;border-radius:14px}
.iconbtn{width:40px;height:40px;padding:0;border-radius:12px}

/* schil */
.app{display:block}
aside.side{display:none}
.topbar{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.topbar .sp{flex:1}
.logo{font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;color:var(--ink);min-width:0}
.logo .mk{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.logo .mk img{width:100%;height:100%;object-fit:contain}
.logo .mk.gr{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:none}
.logo .wm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;border:0;padding:0}
main{padding:20px 16px calc(110px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:5px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;box-shadow:none}
nav.tabs button i{display:grid;place-items:center;width:44px;height:30px;border-radius:15px}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="true"]{color:var(--ink)}
nav.tabs button[aria-current="true"] i{background:var(--brand-soft);color:var(--brand)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--late);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-style:normal}
@media (min-width:980px){
  .app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
  aside.side{display:flex;flex-direction:column;background:color-mix(in srgb,var(--surface) 70%,transparent);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
  aside .logo{padding:26px 22px 22px;border-bottom:1px solid var(--line)}
  aside .nlbl{margin:22px 24px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  aside nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
  aside nav button{justify-content:flex-start;gap:14px;background:transparent;border:0;color:var(--ink);font-weight:600;font-size:15px;padding:11px 14px;border-radius:14px;text-align:left;position:relative}
  aside nav button svg{width:21px;height:21px;color:var(--muted)}
  aside nav button:hover{background:var(--surface-2)}
  aside nav button[aria-current="true"]{color:var(--brand-ink);background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 16px rgb(19 122 138 / .28)}
  aside nav button[aria-current="true"] svg{color:var(--brand-ink)}
  aside nav button .badge{position:static;margin-left:auto}
  aside .sp{flex:1}
  aside .help{margin:14px 14px 0;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
  aside .help b{display:block;font-size:14px}aside .help small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 10px}
  aside .help .row{display:flex;gap:6px}aside .help .row .btn{flex:1;padding:8px;font-size:13px}
  aside .usercard{margin:14px;padding:12px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;gap:10px;min-width:0}
  aside .usercard>div{flex:1;min-width:0}
  aside .usercard b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .usercard small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .usercard button{padding:0;width:34px;height:34px;border-radius:10px;background:transparent;border:0;color:var(--muted)}
  .topbar,nav.tabs{display:none}
  main{padding:40px 40px 80px}
}

/* typografie */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px;margin:0}
.eyebrow svg{width:16px;height:16px;color:var(--brand)}
.eyebrow .pill{text-transform:none;letter-spacing:0;font-size:12px;margin-left:auto}
.hero .eyebrow{flex-wrap:wrap}
h1{font-family:var(--f-title);font-weight:600;letter-spacing:-.022em;line-height:1.07;margin:4px 0 6px;font-size:clamp(32px,4.6vw,48px);text-wrap:balance}
.subt{color:var(--muted);margin:0}
.vd-date{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:16px;font-weight:500}
.vd-date svg{width:20px;height:20px;color:var(--accent)}
.wk{background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:99px}
.pagehead{margin-bottom:20px}

/* indeling */
.pg{display:grid;gap:18px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:1240px){.pg.met-paneel{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.pg.met-paneel>.paneel{position:sticky;top:40px}}
.grid2{display:grid;gap:18px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}

/* kaarten (kp) zoals de klantkaart in het CRM */
.kp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kp-h{display:flex;align-items:center;gap:12px}.kp-h>div{min-width:0}.kp-h b{font-size:16px;display:block}.kp-h small{display:block;color:var(--muted);font-size:13px;font-weight:500}.kp-h .sp{flex:1}
.objic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;flex:none}
.objic svg{width:20px;height:20px}
.objic.goud{background:linear-gradient(135deg,#d9a441,#b07a22)}
.objic.groen{background:linear-gradient(135deg,#2f9a68,#1d7a50)}
.objic.rood{background:linear-gradient(135deg,#d65745,#a3352f)}
.objic.zacht{background:var(--brand-soft);color:var(--brand)}
.lijst{display:flex;flex-direction:column;margin:0 -16px -16px}
.lr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-radius:0;border-left:0;border-right:0;border-bottom:0;text-align:left;font-weight:500;color:inherit;text-decoration:none;cursor:default}
button.lr,a.lr{cursor:pointer;transform:none!important}
button.lr:hover,a.lr:hover{background:var(--surface-2);border-color:var(--line)}
.lr:last-child{border-radius:0 0 var(--r) var(--r)}
.lr .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand);flex:none}
.lr .ti svg{width:18px;height:18px}
.lr .tx{flex:1;min-width:0}.lr .tx b{display:block;font-weight:700;font-size:15px}.lr .tx small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.lr .rt{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.lr .chev{width:17px;height:17px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)}.pill.soon{background:var(--soon-bg);color:var(--soon)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.neutral{background:var(--surface-2);color:var(--muted)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.leeg{padding:22px 4px 8px;text-align:center;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0}
.stat b{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{color:var(--muted);font-size:13px}
.stat.goud b{color:#a8650a}
@media (max-width:520px){.stats{gap:8px}.stat{padding:12px}.stat b{font-size:20px}}

/* volgende bezoek */
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.hero-in{display:flex;gap:20px;align-items:center;padding:24px 22px 18px}
.kal{width:96px;flex:none;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 10px 24px -14px rgb(15 31 38 / .4);overflow:hidden;text-align:center}
.kal i{display:block;font-style:normal;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 0 5px}
.kal b{display:block;font-size:44px;line-height:1;font-weight:800;letter-spacing:-.04em;padding:10px 0 2px;font-variant-numeric:tabular-nums}
.kal small{display:block;color:var(--muted);font-size:12px;font-weight:700;padding-bottom:10px;text-transform:capitalize}
.hero-tx{flex:1;min-width:0}
.hero-tx h2{font-family:var(--f-title);font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.15;margin:6px 0 4px;text-transform:none}
.hero-tx h2::first-letter{text-transform:uppercase}
.hero-tx .tijd{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:700}
.hero-tx .tijd svg{width:17px;height:17px;color:var(--brand)}
.hero-tx p{color:var(--muted);margin:6px 0 0}
.hero-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 22px 20px}
.hero-acts button{min-width:0}
.hero-ft{border-top:1px solid var(--line);padding:12px 22px;color:var(--muted);font-size:14px;background:var(--surface-2)}
.hero-ft b{color:var(--ink)}
.puls{width:11px;height:11px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 0 rgb(35 132 90 / .5)}
@media (prefers-reduced-motion:no-preference){.puls{animation:puls 1.8s infinite}}
@keyframes puls{70%{box-shadow:0 0 0 11px rgb(35 132 90 / 0)}100%{box-shadow:0 0 0 0 rgb(35 132 90 / 0)}}
@media (max-width:520px){.hero-in{padding:22px 16px 16px;gap:14px}.kal{width:78px}.kal b{font-size:36px}.hero-tx h2{font-size:21px}.hero-acts{padding:0 16px 16px}.hero-acts button{padding:10px 6px;font-size:13px;gap:6px}.hero-ft{padding:12px 16px}}

/* meldingen */
.melding{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.melding .tx{flex:1;min-width:0}.melding .tx b{display:block;font-size:15px}.melding .tx small{color:var(--muted);font-size:13.5px}
.melding.rood{border-color:color-mix(in srgb,var(--late) 30%,var(--line))}
.melding.goud{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
button.melding{width:100%;text-align:left;font-weight:500;color:inherit}
.sterren{display:flex;gap:6px;margin-top:2px}
.sterren button{width:46px;height:46px;padding:0;border-radius:12px;color:var(--line);background:var(--surface-2);border-color:transparent}
.sterren button svg{width:24px;height:24px}
.sterren button.aan{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.mini-st{display:inline-flex;gap:1px;color:var(--accent);vertical-align:-1px}.mini-st svg{width:12px;height:12px}

/* aanbevelen */
.ref-bedrag{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ref-bedrag b{font-family:var(--f-title);font-size:56px;line-height:1;font-weight:700;letter-spacing:-.035em;color:#a8650a}
.ref-bedrag span{color:var(--muted);font-weight:700;max-width:32ch;line-height:1.35}
.stappen{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:10px;counter-reset:s}
.stappen li{display:flex;gap:12px;align-items:flex-start;counter-increment:s;font-weight:500}
.stappen li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12.5px;display:grid;place-items:center;flex:none}
.code{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:6px 6px 6px 16px}
.code b{flex:1;font-size:19px;letter-spacing:.1em;font-weight:800}
.deel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* bladen en dialogen */
.ov{position:fixed;inset:0;z-index:50;background:rgb(17 24 28 / .35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media (prefers-reduced-motion:no-preference){.ov{animation:fade .18s ease-out}.blad{animation:op .26s cubic-bezier(.2,.9,.25,1)}}
@keyframes fade{from{opacity:0}}@keyframes op{from{transform:translateY(30px);opacity:.4}}
.blad{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 30px 70px rgb(0 0 0 / .25)}
.blad .greep{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@media(min-width:640px){.ov{align-items:center}.blad{border-radius:22px;padding:22px}.blad .greep{display:none}}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dh>div{flex:1;min-width:0}.dh h3{margin:0;font-size:19px;letter-spacing:-.01em}.dh small{display:block;color:var(--muted);font-size:13.5px}
.veld{display:block;margin:0 0 14px;font-weight:700;font-size:13.5px}
.veld>span{display:block;margin-bottom:6px}
.veld input,.veld textarea,.veld select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;font-weight:500;outline:none;margin-top:6px}
.veld input:focus,.veld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.veld textarea{min-height:96px;resize:vertical}
.codeveld{display:flex;gap:8px;align-items:center;margin-top:6px}.codeveld input{margin-top:0;flex:1;width:auto;min-width:0;font-size:18px;letter-spacing:.12em;font-weight:700}
.hulp{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:5px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keus{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.keus label{cursor:pointer;position:relative}
.keus input{position:absolute;opacity:0;pointer-events:none}
.keus span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px;background:var(--surface);transition:all .12s}
.keus input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.keus input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.acties{display:flex;gap:10px;margin-top:6px}.acties>*{flex:1}
.fout{color:var(--late);font-weight:700;font-size:14px;min-height:18px;margin:2px 0 6px}
.klaar-ic{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:8px auto 14px}
.klaar-ic svg{width:28px;height:28px}
.sub{color:var(--muted);margin:0 0 14px}
.blad h3{font-size:21px;letter-spacing:-.015em;margin:2px 0 4px;font-family:var(--f-title);font-weight:600}
.infobox{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);color:var(--brand);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:12px}
.infobox svg{width:18px;height:18px;margin-top:1px}

/* factuur */
.fact-doc{border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px;font-size:14.5px;background:var(--surface)}
.fact-doc .fh{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.fact-doc table{width:100%;border-collapse:collapse}
.fact-doc td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}

const MND=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const p=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const vandaag=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dagNaam=d=>d.toLocaleDateString("nl-NL",{weekday:"long"});
const lang=s=>{const d=p(s);return dagNaam(d)+" "+d.getDate()+" "+MND[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")};
const kort=s=>{const d=p(s);return d.getDate()+" "+MND[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")};
const dagenTot=s=>Math.round((p(s)-vandaag())/864e5);
const overTxt=n=>n===0?"Vandaag":n===1?"Morgen":n<7?"Over "+n+" dagen":n<14?"Volgende week":"Over "+Math.round(n/7)+" weken";
const groet=()=>{const h=new Date().getHours();return h<6?"Goedenacht":h<12?"Goedemorgen":h<18?"Goedemiddag":"Goedenavond"};
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?+m[1]*60+ +m[2]:null};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function tijdTxt(t,w){const m=toMin(t);if(m==null)return"In de loop van de dag";
  if(w==="exact")return"Rond "+hm(m);
  if(w==="vak")return m<720?"In de ochtend":m<1020?"In de middag":"In de avond";
  const s=Math.floor(m/30)*30;return"Tussen "+hm(s)+" en "+hm(s+120)}
const weekNr=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};

/* ---------- api ---------- */
const SK="ms.portaal.s";
const sessie={get(){try{return localStorage.getItem(SK)||""}catch(e){return window.__s||""}},set(v){window.__s=v;try{v?localStorage.setItem(SK,v):localStorage.removeItem(SK)}catch(e){}}};
async function api(pad,opt={}){
  const r=await fetch("/api/portaal/"+pad,{method:opt.body?"POST":"GET",headers:{...(opt.body?{"content-type":"application/json"}:{}),...(sessie.get()?{authorization:"Bearer "+sessie.get()}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!opt.open){sessie.set("");toonLogin();throw new Error("uit")}
  if(!r.ok)throw new Error(j.fout||"Er ging iets mis. Probeer het zo opnieuw.");
  return j}
function toast(t){const o=document.createElement("div");o.className="toast";o.setAttribute("role","status");o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),3200)}

async function toonLogin(melding){
  document.title="Inloggen · klantomgeving";const LG=await merkLogo();
  $("#app").innerHTML=`<main class="welkom"><div class="wk-kaart wk-c">${wkLogo(LG)}
    <span class="wk-pil">Klantportaal</span>
    <h1>Welkom terug</h1>
    <p class="wk-intro">U ontvangt een inloglink per <span class="nw">e-mail</span>, zonder wachtwoord.</p>
    ${melding?`<div class="infobox">${I.klok}<span>${esc(melding)}</span></div>`:""}
    <form id="lf" class="wk-form" novalidate><label class="wk-veld"><span class="sr">E-mailadres</span>${I.mail}<input type="email" id="le" autocomplete="email" inputmode="email" placeholder="Uw e-mailadres" required></label>
    <button class="primary full big" id="lb">Stuur mij een inloglink</button><p class="fout" id="lfout" role="alert"></p></form>
    <ul class="wk-pts" aria-label="Wat u hier kunt">${[[I.kal,"Afspraken"],[I.fact,"Facturen"],[I.ticket,"Tickets"]].map(([ic,t])=>`<li><span>${ic}</span>${t}</li>`).join("")}</ul></div></main>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const v=$("#le").value.trim(),b=$("#lb");$("#lfout").textContent="";
    if(!/^\S+@\S+\.\S+$/.test(v)){$("#lfout").textContent="Vul een geldig e-mailadres in.";$("#le").focus();return}
    b.disabled=true;b.innerHTML=`<span class="spin" style="width:17px;height:17px;border-width:2px;border-color:rgb(255 255 255 / .35);border-top-color:#fff"></span>Versturen…`;
    try{await api("login",{body:{email:v},open:true});
      $("#app").innerHTML=`<main class="welkom"><div class="wk-kaart wk-c">${wkLogo(LG)}<span class="wk-env">${I.mail}</span>
        <h1>Kijk in uw mailbox</h1><p class="wk-intro" style="max-width:340px">Als <b style="color:var(--ink)">${esc(v)}</b> bij ons bekend is, staat er een mail met een inlogknop voor u klaar. De knop werkt een uur.</p>
        <div class="infobox">${I.klok}<span>Niets ontvangen? Kijk ook bij ongewenste mail, of gebruik het adres waarop u onze facturen krijgt.</span></div>
        <button class="full" id="opn">Ander e-mailadres proberen</button></div></main>`;
      $("#opn").onclick=()=>toonLogin()}
    catch(er){b.disabled=false;b.innerHTML="Stuur mij een inloglink";$("#lfout").textContent=er.message}};
  setTimeout(()=>{const i=$("#le");if(i)i.focus()},50)}

async function toonAanbevolen(code){
  let d;try{d=await api("ref?c="+encodeURIComponent(code),{open:true})}catch(e){d=null}
  const site=(d&&d.bedrijf.website)||"https://mijnschoonmaker.com",url=(/^https?:/.test(site)?site:"https://"+site).replace(/\/+$/,"")+(site.includes("?")?"&":"?")+"ref="+encodeURIComponent(code);
  try{localStorage.setItem("ms.ref",code)}catch(e){}
  document.title=d?d.voornaam+" raadt "+d.bedrijf.naam+" aan":"Aanbeveling";
  $("#app").innerHTML=`<main class="welkom"><div class="wk-kaart wk-c">${wkLogo((d&&d.bedrijf.logo)||await merkLogo())}
    <span class="wk-pil">Persoonlijke aanbeveling</span>
    <h1>${d?esc(d.voornaam)+" raadt ons aan":"U bent aanbevolen"}</h1>
    <p>Wij wassen uw ramen in een vast ritme, laten vooraf weten wanneer we komen en u ziet alles terug in uw eigen klantomgeving.</p>
    ${d&&d.welkom>0?`<div class="melding goud" style="margin-bottom:18px;box-shadow:none"><span class="objic goud">${I.cadeau}</span><div class="tx"><b>${eur0(d.welkom)} welkomstkorting</b><small>Op uw eerste factuur, omdat ${esc(d.voornaam)} u heeft aanbevolen.</small></div></div>`:""}
    <a class="btn primary full big" href="${esc(url)}">${I.euro}Bereken direct uw prijs</a>
    <p class="subt klein">Uw code <b style="letter-spacing:.06em;color:var(--ink)">${esc(code)}</b> gaat automatisch mee met uw aanvraag.</p></div></main>`}

/* ---------- de app ---------- */
let D=null,tab="home";
const TABS=[["home","Overzicht",I.huis],["bezoeken","Bezoeken",I.kal],["tickets","Tickets",I.ticket],["facturen","Facturen",I.fact],["aanbevelen","Aanbevelen",I.hart],["ik","Contact",I.ik]];
async function laad(stil){
  if(!stil)$("#app").innerHTML=`<div class="laden"><div class="spin"></div><span>Uw omgeving wordt geopend…</span></div>`;
  try{D=await api("data");B=D.bedrijf;teken()}catch(e){if(e.message!=="uit")$("#app").innerHTML=`<main class="welkom"><div class="wk-kaart"><h1>Dat lukte even niet</h1><p>${esc(e.message)}</p><button class="primary" onclick="laad()">Opnieuw proberen</button></div></main>`}}
const kp=(ic,titel,inhoud,o={})=>`<section class="kp ${o.cls||""}"><div class="kp-h"><span class="objic ${o.kl||""}">${ic}</span><div><b>${titel}</b>${o.sub?`<small>${o.sub}</small>`:""}</div><span class="sp"></span>${o.act||""}</div>${inhoud}</section>`;
const lr=(ic,titel,sub,rt="",o={})=>{const tag=o.href?"a":o.attr?"button":"div";return `<${tag} class="lr"${o.href?` href="${esc(o.href)}"${/^https?:/.test(o.href)?' target="_blank" rel="noopener"':""}`:""}${o.attr?" "+o.attr:""}><span class="ti"${o.tis?` style="${o.tis}"`:""}>${ic}</span><span class="tx"><b>${titel}</b>${sub?`<small>${sub}</small>`:""}</span>${rt?`<span class="rt">${rt}</span>`:""}${tag!=="div"?I.chev.replace("<svg",'<svg class="chev"'):""}</${tag}>`};
function teken(){
  const openF=D.facturen.filter(f=>f.status==="open"||f.status==="verlopen"),k=D.klant;
  document.title=B.naam+" · Mijn klantomgeving";
  const nav=(mob)=>TABS.filter(x=>!mob||x[0]!=="ik").map(([t,l,ic])=>`<button data-tab="${t}"${tab===t?' aria-current="true"':""}>${mob?`<i>${ic}</i>`:ic}<span>${l}</span>${t==="facturen"&&openF.length?`<em class="badge">${openF.length}</em>`:""}${t==="tickets"&&D.tickets&&D.tickets.ongelezen?`<em class="badge">${D.tickets.ongelezen}</em>`:""}</button>`).join("");
  const tel=(B.mobiel||B.telefoon||"").replace(/[^\d+]/g,""),wa=tel.replace(/^\+/,"").replace(/^0/,"31");
  $("#app").innerHTML=`<div class="app">
    <aside class="side">${logoHtml(merkNaam(),B.logo||"/logo.png")}
      <p class="nlbl">Mijn klantomgeving</p><nav aria-label="Menu">${nav(false)}</nav><span class="sp"></span>
      <div class="help"><b>Vragen?</b><small>Maak een ticket aan, dan helpen we u snel.</small><button class="primary full" data-act="ticket">${I.ticket}Ticket aanmaken</button>${tel?`<div class="row" style="margin-top:6px"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}">${I.wa}WhatsApp</a>${B.email?`<a class="btn" href="mailto:${esc(B.email)}">${I.mail}Mail</a>`:""}</div>`:""}</div>
      <div class="usercard"><span class="uav">${esc((k.voornaam||"?")[0].toUpperCase())}</span><div><b>${esc(k.naam)}</b><small>${k.klantnr?"Klant "+esc(k.klantnr):esc(k.adres)}</small></div><button data-uit title="Uitloggen" aria-label="Uitloggen">${I.uit}</button></div></aside>
    <div><header class="topbar">${logoHtml(merkNaam(),B.logo||"/logo.png")}<span class="sp"></span><button class="uav" data-tab="ik" aria-label="Mijn gegevens">${esc((k.voornaam||"?")[0].toUpperCase())}</button></header>
    <main id="main"${tab==="tickets"&&TK.open?' class="m-chat"':""}>${({home,bezoeken,tickets,facturen,aanbevelen,ik})[tab]()}<p class="voet">${esc(B.naam)}${B.email?" · "+esc(B.email):""}</p></main></div></div>
    <nav class="tabs" aria-label="Menu">${nav(true)}</nav>`;
  $$("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==="tickets"){TK.open="";TK.d=null;TK.sig=""}teken();scrollTo({top:0});try{history.replaceState(null,"","#"+tab)}catch(e){}});
  koppel();if(tab==="tickets")ticketsStart()}
const datumKop=()=>{const d=new Date();return `<span class="vd-date">${I.zonOp}${esc(d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"}))} <span class="wk">wk ${weekNr(d)}</span></span>`};
const kop=(titel,sub,eb)=>`<div class="pagehead">${eb||datumKop()}<h1>${titel}</h1>${sub?`<p class="subt">${sub}</p>`:""}</div>`;

function hero(){const v=D.volgende,k=D.klant;
  if(v&&v.bezig)return `<section class="hero"><div class="hero-in"><span class="objic groen" style="width:64px;height:64px;border-radius:18px">${I.ruit}</span><div class="hero-tx"><p class="eyebrow"><span class="puls"></span>Vandaag</p><h2>We zijn nu bij u aan het werk</h2><p>Na afloop ziet u het bezoek terug bij Bezoeken.</p></div></div></section>`;
  if(v){const d=p(v.datum),n=dagenTot(v.datum);
    return `<section class="hero"><div class="hero-in"><div class="kal" aria-hidden="true"><i>${MND[d.getMonth()].slice(0,3)}</i><b>${d.getDate()}</b><small>${esc(dagNaam(d).slice(0,2))}</small></div>
      <div class="hero-tx"><p class="eyebrow">${I.kal}Volgende bezoek <span class="pill brand">${overTxt(n)}</span></p><h2>${esc(lang(v.datum))}</h2><span class="tijd">${I.klok}${esc(tijdTxt(v.tijd,B.tijdWeergave))}</span></div></div>
      <div class="hero-acts"><button data-act="verzetten">${I.verzet}Verzetten</button><button data-act="overslaan">${I.pauze}Overslaan</button><button data-act="toegang">${I.sleutel}Instructies</button></div>
      ${v.reeks.length?`<div class="hero-ft">Daarna: ${v.reeks.slice(0,3).map(x=>`<b>${kort(x.datum)}</b>`).join(", ")}${v.reeks.length>3?" en verder":""}</div>`:""}</section>`}
  const w=D.verwacht?weekNr(p(D.verwacht)):0;
  return `<section class="hero"><div class="hero-in"><div class="kal" aria-hidden="true"><i>week</i><b>${w||"–"}</b><small>verwacht</small></div>
    <div class="hero-tx"><p class="eyebrow">${I.kal}Uw volgende bezoek</p>
    ${k.nieuw?`<h2>We plannen uw eerste bezoek</h2><p>We combineren afspraken per omgeving. U hoort van ons zodra de datum vaststaat.</p>`
     :!k.actief?`<h2>Er staan geen bezoeken gepland</h2><p>Wilt u weer gebruikmaken van onze diensten? Laat het ons weten.</p>`
     :`<h2>${w?"Rond week "+w:"Binnenkort"}</h2><p>We plannen u in zodra uw route rond is en laten u vooraf weten wanneer we komen.</p>`}</div></div>
    <div class="hero-acts"><button data-act="vakantie">${I.zon}Afwezig</button><button data-act="toegang">${I.sleutel}Instructies</button><button data-act="ticket">${I.bericht}Vraag</button></div></section>`}

function abonnementKp(){const k=D.klant;
  return kp(I.ruit,"Uw abonnement",`<div class="lijst">
    ${lr(I.ruit,esc(k.dienst)+(k.binnen?" binnen en buiten":""),"Elke "+(k.frequentie===1?"week":k.frequentie+" weken")+(k.sinds?" · klant sinds "+esc(MND[p(k.sinds).getMonth()]+" "+p(k.sinds).getFullYear()):""),eur0(k.prijs)+`<small style="color:var(--muted);font-weight:600;font-size:12px">per beurt</small>`)}
    ${lr(I.plus,"Iets extra laten doen","Kozijnen, binnenzijde, zonnepanelen","",{attr:'data-act="extra"'})}
    ${lr(I.zon,"Afwezig of op vakantie","Dan houden we er rekening mee","",{attr:'data-act="vakantie"'})}</div>`)}
function home(){const k=D.klant,openF=D.facturen.filter(f=>f.status==="open"||f.status==="verlopen"),som=openF.reduce((a,f)=>a+f.bedrag,0),A=D.aanbevelen;
  const lopend=D.verzoeken.filter(v=>v.status==="nieuw");
  const links=`${D.tickets&&D.tickets.ongelezen?`<button class="melding" data-tab="tickets" style="border-color:color-mix(in srgb,var(--brand) 35%,var(--line))"><span class="objic">${I.ticket}</span><div class="tx"><b>${D.tickets.ongelezen===1?"Nieuw antwoord op uw ticket":D.tickets.ongelezen+" nieuwe antwoorden"}</b><small>Bekijk wat wij hebben geantwoord</small></div><span class="btn primary">Bekijken</span></button>`:""}${hero()}
    ${openF.length?`<div class="melding rood"><span class="objic rood">${I.fact}</span><div class="tx"><b>${openF.length===1?"Er staat een factuur open":openF.length+" facturen staan open"}</b><small>${eur(som)}${openF.some(f=>f.status==="verlopen")?" · betaaltermijn verstreken":""}</small></div><button class="primary" data-fact="${esc(openF[0].id)}">Bekijken</button></div>`:""}
    ${A.tegoed>0?`<div class="melding goud"><span class="objic goud">${I.cadeau}</span><div class="tx"><b>${eur0(A.tegoed)} tegoed</b><small>Gaat automatisch van uw volgende factuur af. Bedankt voor uw aanbeveling.</small></div></div>`:""}
    ${D.teBeoordelen?kp(I.ster,"Hoe was ons bezoek?",`<div class="sterren" id="beoor" role="group" aria-label="Geef een beoordeling">${[1,2,3,4,5].map(n=>`<button data-ster="${n}" aria-label="${n} ${n===1?"ster":"sterren"}">${I.ster}</button>`).join("")}</div>`,{kl:"goud",sub:"Bezoek van "+esc(lang(D.teBeoordelen.datum))}):""}
    ${lopend.length?kp(I.bericht,"Wat u ons heeft laten weten",`<div class="lijst">${lopend.map(verzoekRij).join("")}</div>`,{sub:"We komen er zo snel mogelijk op terug"}):""}
    <div class="stats"><div class="stat"><small>Bezoeken</small><b>${D.aantalBezoeken}</b></div><div class="stat"><small>Ritme</small><b>${k.frequentie} wk</b></div><div class="stat${som>0?"":""}"><small>Open</small><b${som>0?' style="color:var(--late)"':""}>${eur0(som)}</b></div></div>`;
  const rechts=`${abonnementKp()}
    ${B.refAan?`<button class="melding goud" data-tab="aanbevelen"><span class="objic goud">${I.hart}</span><div class="tx"><b>Tevreden? Vertel het door</b><small>${eur0(B.refBeloning)} korting op uw volgende factuur voor elke nieuwe klant.</small></div>${I.chev}</button>`:""}`;
  return kop(groet()+", "+esc(k.voornaam),esc(k.adres)+(k.pcPlaats?", "+esc(k.pcPlaats.replace(/^\d{4}\s?[a-z]{2}\s*/i,"")):""))+
    `<div class="pg met-paneel"><div class="col">${links}</div><div class="col paneel">${rechts}</div></div>`}

const VZ={verzetten:"Afspraak verzetten",overslaan:"Bezoek overslaan",vakantie:"Afwezig",bericht:"Bericht",gegevens:"Gegevens wijzigen",extra:"Extra dienst",stoppen:"Opzeggen"};
function verzoekRij(v){return lr(v.type==="vakantie"?I.zon:v.type==="verzetten"?I.verzet:v.type==="overslaan"?I.pauze:I.bericht,esc(VZ[v.type]||"Verzoek")+(v.datum?" · "+esc(kort(v.datum)):"")+(v.tot?" t/m "+esc(kort(v.tot)):""),v.antwoord?esc(v.antwoord):v.status==="nieuw"?"Ontvangen op "+esc(kort(v.op.slice(0,10))):"Afgehandeld",`<span class="pill ${v.status==="nieuw"?"soon":"ok"}"><i></i>${v.status==="nieuw"?"In behandeling":"Geregeld"}</span>`)}

function bezoeken(){const v=D.volgende,b=D.bezoeken,k=D.klant;
  const st=n=>`<span class="mini-st" aria-label="${n} sterren">${I.ster.repeat(n)}</span>`;
  return kop("Bezoeken","Wanneer we komen en wanneer we geweest zijn.")+`<div class="pg"><div class="stats"><div class="stat"><small>Bezoeken</small><b>${D.aantalBezoeken}</b></div><div class="stat"><small>Ritme</small><b>${k.frequentie} weken</b></div><div class="stat"><small>Klant sinds</small><b>${k.sinds?p(k.sinds).getFullYear():"–"}</b></div></div>
    <div class="grid2">${kp(I.kal,"Gepland",v?`<div class="lijst">${[{datum:v.datum,tijd:v.tijd},...v.reeks].map((x,i)=>lr(I.kal,`<span style="text-transform:capitalize">${esc(lang(x.datum))}</span>`,esc(tijdTxt(x.tijd,B.tijdWeergave)),i===0?`<span class="pill brand">${esc(overTxt(dagenTot(x.datum)))}</span>`:"")).join("")}</div>`
      :`<p class="leeg">${D.verwacht?"We verwachten u rond week "+weekNr(p(D.verwacht))+" in te plannen. U krijgt vooraf bericht.":"Er staat nog niets gepland."}</p>`,{sub:v?plural(1+v.reeks.length,"afspraak","afspraken"):""})}
    ${kp(I.check,"Geweest",b.length?`<div class="lijst">${b.map(x=>lr(I.check,`<span style="text-transform:capitalize">${esc(lang(x.datum))}</span>`,esc(x.dienst)+(x.extra&&x.extra.length?" + "+esc(x.extra.join(", ").toLowerCase()):"")+(x.beoordeling?" · "+st(x.beoordeling.sterren):""),x.bedrag?eur0(x.bedrag):"",{tis:"background:var(--ok-bg);color:var(--ok)"})).join("")}</div>`:`<p class="leeg">Na ons eerste bezoek ziet u het hier terug.</p>`,{kl:"groen",sub:b.length?plural(b.length,"bezoek","bezoeken"):""})}</div></div>`}
const plural=(n,a,b)=>n+" "+(n===1?a:b);

function facturen(){const F=D.facturen,open=F.filter(f=>f.status!=="betaald"&&f.status!=="gesloten");
  const pl=f=>f.status==="betaald"?`<span class="pill ok"><i></i>Betaald</span>`:f.status==="verlopen"?`<span class="pill late"><i></i>Verlopen</span>`:f.status==="gesloten"?`<span class="pill neutral">Gesloten</span>`:`<span class="pill brand"><i></i>Open</span>`;
  const rij=f=>lr(I.fact,esc(f.nummer||"Factuur"),esc(kort(f.datum))+(f.status!=="betaald"&&f.verval?" · betalen voor "+esc(kort(f.verval)):""),eur(f.bedrag)+pl(f),{attr:`data-fact="${esc(f.id)}"`});
  const som=open.reduce((a,f)=>a+f.bedrag,0),betaald=F.filter(f=>f.status==="betaald").reduce((a,f)=>a+f.bedrag,0);
  return kop("Facturen",open.length?`Er ${open.length===1?"staat één factuur":"staan "+open.length+" facturen"} open.`:"Alles is betaald. Dank u wel.")+`<div class="pg">
    <div class="stats"><div class="stat"><small>Openstaand</small><b${som>0?' style="color:var(--late)"':""}>${eur0(som)}</b></div><div class="stat"><small>Betaald</small><b>${eur0(betaald)}</b></div><div class="stat goud"><small>Tegoed</small><b>${eur0(D.aanbevelen.tegoed)}</b></div></div>
    ${open.length?kp(I.euro,"Te betalen",`<div class="lijst">${open.map(rij).join("")}</div>`,{kl:"rood",sub:"Betaal online of maak het bedrag over"}):""}
    ${kp(I.fact,"Alle facturen",F.filter(f=>!open.includes(f)).length?`<div class="lijst">${F.filter(f=>!open.includes(f)).map(rij).join("")}</div>`:`<p class="leeg">Hier verschijnen uw facturen na een bezoek.</p>`,{sub:plural(F.length,"factuur","facturen")})}</div>`}

function aanbevelen(){const A=D.aanbevelen;
  const st={aangemeld:["soon","Aangemeld"],akkoord:["soon","Wacht op akkoord"],eerste:["brand","Eerste bezoek volgt"],klant:["brand","Eerste bezoek volgt"],beloond:["ok","Korting vrijgegeven"],gestopt:["neutral","Niet doorgegaan"]};
  const hold=(A.opHold||0)*B.refBeloning;
  return kop("Aanbevelen","Wie u aanbeveelt krijgt een welkomstkorting, en u wordt bedankt.")+`<div class="pg met-paneel"><div class="col">
    ${kp(I.cadeau,"Uw persoonlijke link",`<div class="ref-bedrag"><b>${eur0(B.refBeloning)}</b><span>korting op uw volgende factuur, voor elke nieuwe klant</span></div>
      ${B.refWelkom>0?`<p class="subt">Wie zich via uw link aanmeldt, krijgt ${eur0(B.refWelkom)} korting op de eerste factuur.</p>`:""}
      <div class="code"><b>${esc(A.code)}</b><button class="primary" data-kopie>${I.kopie}Kopieer link</button></div>
      <div class="deel"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(deelTekst())}">${I.wa}WhatsApp</a><a class="btn" href="mailto:?subject=${encodeURIComponent("Tip: "+B.naam)}&body=${encodeURIComponent(deelTekst())}">${I.mail}Mail</a><button data-deel>${I.deel}Delen</button></div>`,{kl:"goud",sub:"Deel hem met buren, vrienden of familie"})}
    <div class="stats"><div class="stat"><small>On hold</small><b>${eur0(hold)}</b></div><div class="stat goud"><small>Klaar voor factuur</small><b>${eur0(A.tegoed)}</b></div><div class="stat"><small>Al verrekend</small><b>${eur0(A.verdiend)}</b></div></div>
    ${kp(I.hart,"Uw aanbevelingen",A.lijst.length?`<div class="lijst">${A.lijst.map(x=>lr(I.hart,esc(x.naam||"Nieuwe klant"),x.datum?esc(kort(x.datum.slice(0,10))):"",`<span class="pill ${st[x.status][0]}"><i></i>${st[x.status][1]}</span>`,{tis:"background:var(--soon-bg);color:var(--soon)"})).join("")}</div>`:`<p class="leeg">Nog niemand aanbevolen. Uw buren zien vast al dat uw ramen blinken.</p>`,{kl:"goud",sub:A.lijst.length?plural(A.lijst.length,"aanbeveling","aanbevelingen"):""})}
    </div><div class="col paneel">${kp(I.check,"Zo werkt het",`<ol class="stappen"><li>Deel uw link via WhatsApp of mail</li><li>Zij berekenen hun prijs en melden zich aan</li><li>Uw korting staat on hold tot zij akkoord hebben gegeven en wij de eerste afspraak hebben uitgevoerd</li><li>Daarna gaat ${eur0(B.refBeloning)} automatisch van uw volgende factuur af</li></ol>`,{kl:"zacht"})}</div></div>`}
function deelTekst(){return `Ik laat mijn ramen wassen door ${B.naam} en ben er heel tevreden over.${B.refWelkom>0?` Met mijn link krijg je ${eur0(B.refWelkom)} korting op je eerste factuur:`:" Bereken je prijs via mijn link:"} ${D.aanbevelen.link}`}

function ik(){const k=D.klant,t=k.toegang||{};
  const tel=(B.mobiel||B.telefoon||"").replace(/[^\d+]/g,""),wa=tel.replace(/^\+/,"").replace(/^0/,"31");
  return kop("Contact","We helpen u graag. Maak een ticket aan, of stuur een WhatsApp of e-mail.")+`<div class="pg"><div class="grid2">
    ${kp(I.ticket,"Contact met ons",`<div class="lijst">${lr(I.ticket,"Ticket aanmaken",`Snelste weg · u volgt de status in het portaal`,`<span class="pill brand">Voorkeur</span>`,{attr:'data-act="ticket"',tis:"background:var(--brand);color:#fff"})}
      ${tel?lr(I.wa,"WhatsApp","Stuur ons een bericht","",{href:"https://wa.me/"+wa,tis:"background:#e3f5ea;color:#1f9d55"}):""}${B.email?lr(I.mail,"E-mail",esc(B.email),"",{href:"mailto:"+B.email}):""}</div>`,{sub:"Wij werken niet telefonisch, maar reageren snel op tickets"})}
    ${kp(I.sleutel,"Bij u thuis",`<div class="lijst">${lr(I.sleutel,"Toegang en instructies",(t.opties||[]).length||t.tekst||t.code?esc([t.code?"Poortcode ingesteld":"",...(t.opties||[]),t.tekst].filter(Boolean).join(" · ").slice(0,90)):"Poortcode, achterom open, hond aanwezig","",{attr:'data-act="toegang"'})}
      ${lr(I.zon,"Afwezigheid doorgeven","Op vakantie of verbouwing?","",{attr:'data-act="vakantie"'})}${lr(I.plus,"Iets extra laten doen","Kozijnen, binnenzijde, zonnepanelen","",{attr:'data-act="extra"'})}</div>`,{kl:"goud"})}
    ${kp(I.ik,"Mijn gegevens",`<div class="lijst">${lr(I.huis,esc(k.naam),esc(k.adres)+"<br>"+esc(k.pcPlaats),"",{attr:'data-act="gegevens"'})}
      ${lr(I.tel,"Telefoon en e-mail",esc([k.telefoon||k.mobiel,k.email].filter(Boolean).join(" · ")||"Nog niet bekend"),"",{attr:'data-act="gegevens"'})}
      ${k.klantnr?lr(I.doc,"Klantnummer",esc(k.klantnr)):""}${B.voorwaarden?lr(I.doc,"Algemene voorwaarden","PDF","",{href:B.voorwaarden}):""}

const tPil=s=>`<span class="pill ${(TST[s]||TST.open)[0]}"><i></i>${(TST[s]||TST.open)[1]}</span>`;

     :kp(I.ticket,"Nog geen tickets",`<p class="leeg">Heeft u een vraag of is er iets niet goed gegaan? Maak hierboven een ticket aan.</p>`,{kl:"zacht"})}</div>`}
async function ticketsLaad(){try{const r=await api("tickets"),sig=JSON.stringify(r.tickets);if(sig===TK.lsig)return;TK.lsig=sig;TK.lijst=r.tickets;if(tab==="tickets"&&!TK.open)teken()}catch(e){if(TK.lijst===null){TK.lijst=[];if(tab==="tickets"&&!TK.open)teken()}}}
function ticketDetail(){const d=TK.d;
  return `<section class="chat tk" aria-label="Ticket">
    <header class="ch-h"><button class="iconbtn" data-tkterug aria-label="Terug naar tickets">${I.terug}</button><div style="min-width:0;flex:1"><b>${d?esc(d.ticket.onderwerp):"Ticket"}</b><small>${d?esc(d.ticket.nummer)+" · "+esc((TCAT[d.ticket.categorie]||TCAT.overig)[0]):"Laden…"}</small></div>${d?tPil(d.ticket.status):""}</header>
    <div class="ch-lijst" id="chl" aria-live="polite"><div class="laden" style="min-height:200px"><div class="spin"></div></div></div>
    ${d&&d.ticket.status==="opgelost"?`<div class="tk-dicht">${I.check}<span>Dit ticket is opgelost. Stuurt u een bericht, dan openen wij het opnieuw.</span></div>`:""}
    <div class="ch-prev" id="chp" hidden></div>
    <form class="ch-in" id="chf"><label class="btn iconbtn ch-foto" title="Foto toevoegen" aria-label="Foto toevoegen">${I.camera}<input type="file" accept="image/*" id="chfi" hidden></label>
      <textarea id="cht" rows="1" placeholder="Typ uw reactie…" aria-label="Reactie"></textarea><button class="primary iconbtn" id="chb" aria-label="Versturen">${I.stuur}</button></form></section>`}
const dagLbl=s=>{const d=new Date(s);d.setHours(0,0,0,0);const n=Math.round((vandaag()-d)/864e5);return n===0?"Vandaag":n===1?"Gisteren":d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})};
const tijdLbl=s=>new Date(s).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
function tkTeken(forceer){const l=$("#chl");if(!l||!TK.d)return;
  const bij=forceer||l.scrollHeight-l.scrollTop-l.clientHeight<120,B_=TK.d.berichten,laatsteKlant=[...B_].reverse().find(m=>m.van==="klant");let dag="",html="";
  for(const m of B_){const dl=dagLbl(m.op);if(dl!==dag){dag=dl;html+=`<div class="ch-dag"><span>${esc(dl)}</span></div>`}
    if(m.systeem){html+=`<div class="tk-sys">${esc(m.tekst)}</div>`;continue}
    const st=m===laatsteKlant?(m._bezig?"Versturen…":m._fout?"Niet verstuurd":TK.d.gezienTeam&&TK.d.gezienTeam>=m.op?"Gelezen":"Verzonden"):"";
    html+=`<div class="bel ${m.van==="klant"?"ik":"team"}${m._bezig?" bezig":""}${m._fout?" fout":""}">${m.foto?`<a class="bf" href="${m.foto.startsWith("data:")?"#":"/_blob/"+esc(m.foto)}" target="_blank" rel="noopener"><img src="${m.foto.startsWith("data:")?m.foto:"/_blob/"+esc(m.foto)}" alt="Foto"></a>`:""}${m.tekst?`<div class="bb">${esc(m.tekst).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>")}</div>`:""}<small>${m.van==="team"?esc(m.naam||merkNaam())+" · ":""}${tijdLbl(m.op)}${st?" · "+st:""}</small></div>`}
  if(B_.length&&B_[B_.length-1].van==="klant"&&TK.d.ticket.status!=="opgelost")html+=`<div class="tk-sys">We hebben uw bericht ontvangen en reageren zo snel mogelijk.</div>`;
  l.innerHTML=html;if(bij)l.scrollTop=l.scrollHeight}
async function tkLaad(){if(!TK.open)return;try{const r=await api("ticket?id="+encodeURIComponent(TK.open));const sig=r.berichten.map(m=>m.id).join(",")+"|"+r.gezienTeam+"|"+r.ticket.status;
  const lokaal=TK.d?TK.d.berichten.filter(m=>m._bezig||m._fout):[];const statusAnders=!TK.d||TK.d.ticket.status!==r.ticket.status;
  if(sig!==TK.sig||lokaal.length){TK.sig=sig;TK.d={...r,berichten:[...r.berichten,...lokaal]};if(statusAnders)teken();else tkTeken()}}catch(e){if(/niet gevonden/i.test(e.message)){TK.open="";teken()}}}
function ticketsStart(){
  if(!TK.open){ticketsLaad();return}

  const groei=()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"};t.oninput=groei;
  t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(hover:none)").matches){e.preventDefault();f.requestSubmit()}};
  fi.onchange=async()=>{const file=fi.files[0];fi.value="";if(!file)return;try{TK.foto=await verklein(file);pv.hidden=false;pv.innerHTML=`<img src="${TK.foto}" alt=""><span>Foto toegevoegd</span><button type="button" class="iconbtn ghost" id="chpx" aria-label="Foto verwijderen">${I.x}</button>`;$("#chpx").onclick=()=>{TK.foto="";pv.hidden=true;pv.innerHTML=""};t.focus()}catch(e){toast("Deze foto kan niet worden geopend")}};
  f.onsubmit=async e=>{e.preventDefault();const tekst=t.value.trim(),foto=TK.foto;if(!tekst&&!foto)return;
    const m={id:"tmp"+Date.now(),van:"klant",tekst,foto,op:new Date().toISOString(),_bezig:true};TK.d.berichten.push(m);t.value="";groei();TK.foto="";pv.hidden=true;pv.innerHTML="";tkTeken(true);
    try{await api("ticket/antwoord",{body:{id:TK.open,tekst,foto}});TK.d.berichten=TK.d.berichten.filter(x=>x!==m);TK.sig="";await tkLaad();tkTeken(true)}
    catch(er){m._bezig=false;m._fout=true;tkTeken(true);toast(er.message)}};
  if(!matchMedia("(hover:none)").matches)setTimeout(()=>t.focus(),100)}
function openTicket(id){tab="tickets";TK.open=id;TK.d=null;TK.sig="";try{history.replaceState(null,"","#ticket-"+id)}catch(e){}teken();scrollTo({top:0})}
function verklein(file){return new Promise((ok,fout)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.82))};img.onerror=fout;img.src=u})}

    <p class="fout" role="alert"></p><div class="acties"><button data-sluit>Annuleren</button><button class="primary" data-go>Opslaan</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>{const g=id=>o.querySelector(id).value;verstuur(o,{type:"gegevens",naam:g("#gn"),adres:g("#ga"),postcode:g("#gp"),plaats:g("#gl"),telefoon:g("#gt"),mobiel:g("#gm"),email:g("#ge")},"Opgeslagen","Uw gegevens zijn bijgewerkt.")})},
  extra(){const X=["Kozijnen reinigen","Binnenzijde ramen","Zonnepanelen","Dakgoot schoonmaken","Serre of veranda","Eenmalige schoonmaak na verbouwing"];
    blad(`<h3>Iets extra laten doen</h3><p class="sub">Kies wat u wilt. We nemen het mee bij een volgend bezoek en sturen u vooraf de prijs.</p>
    <div class="keus">${X.map(x=>`<label><input type="checkbox" value="${esc(x)}"><span>${esc(x)}</span></label>`).join("")}</div>
    <label class="veld"><span>Toelichting (niet verplicht)</span><textarea id="vt"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="" data-sluit>Annuleren</button><button class="primary" data-go>Prijs aanvragen</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>{const d=[...o.querySelectorAll(".keus input:checked")].map(x=>x.value);if(!d.length&&!o.querySelector("#vt").value.trim()){o.querySelector(".fout").textContent="Kies minstens één dienst.";return}
      verstuur(o,{type:"extra",diensten:d,tekst:o.querySelector("#vt").value},"Aanvraag ontvangen","We sturen u de prijs en plannen het in overleg in.")})}
};
async function beoordeel(n){const b=D.teBeoordelen;if(!b)return;
  if(n>=4){try{await api("actie",{body:{type:"beoordeling",beurtId:b.id,sterren:n}})}catch(e){toast(e.message);return}
    blad(`<div class="klaar-ic" style="background:var(--sun-s);color:var(--sun)">${I.ster}</div><h3 style="text-align:center">Wat fijn om te horen!</h3><p class="sub" style="text-align:center">${B.reviewLink?"Zou u dat ook met anderen willen delen? Een korte Google-review helpt ons enorm.":"Dank u wel voor uw beoordeling."}</p>
      <div class="acties">${B.reviewLink?`<button class="" data-sluit>Nu niet</button><a class="primary" target="_blank" rel="noopener" href="${esc(B.reviewLink)}">Review schrijven</a>`:`<button class="primary" data-sluit>Sluiten</button>`}</div>`);laad(true);return}
  blad(`<h3>Dank voor uw eerlijkheid</h3><p class="sub">Wat kon er beter? Dan zorgen we dat het de volgende keer wel goed gaat. Waar nodig nemen we contact met u op.</p>
    <label class="veld"><span>Wat ging er mis?</span><textarea id="vt" placeholder="Bijvoorbeeld: strepen op het keukenraam"></textarea></label>
    <p class="fout" role="alert"></p><div class="acties"><button class="" data-sluit>Annuleren</button><button class="primary" data-go>Versturen</button></div>`,
    o=>o.querySelector("[data-go]").onclick=()=>verstuur(o,{type:"beoordeling",beurtId:b.id,sterren:n,tekst:o.querySelector("#vt").value},"Dank u wel","We nemen uw opmerking serieus en komen erop terug."))}
async function openFactuur(id){let f;const sluit=blad(`<div class="laden" style="min-height:200px"><div class="spin"></div></div>`);
  try{f=await api("factuur?id="+encodeURIComponent(id))}catch(e){sluit();toast(e.message);return}sluit();
  const b=f.bedrijf,open=f.status==="open"||f.status==="verlopen";
  blad(`<h3>Factuur ${esc(f.nummer)}</h3><p class="sub">${f.status==="betaald"?"Betaald"+(f.betaaldOp?" op "+esc(kort(f.betaaldOp)):"")+". Dank u wel.":f.status==="verlopen"?"De betaaltermijn is verstreken op "+esc(kort(f.verval))+".":"Graag betalen voor "+esc(kort(f.verval))+"."}</p>
    <div class="fact-doc"><div class="fh"><div><b>${esc(b.naam)}</b><br><small style="color:var(--ink2)">${esc(b.adres)}${b.pcPlaats?"<br>"+esc(b.pcPlaats):""}</small></div><div style="text-align:right"><small style="color:var(--ink2)">Datum</small><br><b>${esc(kort(f.datum))}</b></div></div>
      <table>${f.regels.map(r=>`<tr><td>${esc(r.omschrijving)}${r.aantal!==1?` <span style="color:var(--ink2)">× ${String(r.aantal).replace(".",",")}</span>`:""}</td><td class="r${r.prijs<0?" neg":""}">${eur(r.aantal*r.prijs)}</td></tr>`).join("")}
      <tr class="sub"><td>Subtotaal excl. btw</td><td class="r">${eur(f.ex)}</td></tr><tr class="sub"><td>Btw ${f.btwPct}%</td><td class="r">${eur(f.btw)}</td></tr><tr class="tot"><td>Totaal</td><td class="r">${eur(f.inc)}</td></tr></table>
      ${f.notitie?`<p style="color:var(--ink2);margin:10px 0 0;white-space:pre-line">${esc(f.notitie)}</p>`:""}
      <p style="color:var(--ink3);font-size:12.5px;margin:12px 0 0">${[b.kvk&&"KvK "+b.kvk,b.btwnr&&"Btw "+b.btwnr,b.iban&&"IBAN "+b.iban].filter(Boolean).map(esc).join(" · ")}</p></div>
    ${open&&b.iban?`<div class="infobox">${I.euro}<span>Liever overmaken? ${eur(f.inc)} naar <b>${esc(b.iban)}</b> t.n.v. ${esc(b.naam)} onder vermelding van ${esc(f.nummer)}.</span></div>`:""}
    <p class="fout" role="alert"></p>
    <div class="acties"><button class="" onclick="print()">${I.print}Bewaren</button>${open?`<button class="primary" data-betaal>${I.euro}Nu betalen</button>`:`<button class="primary" data-sluit>Sluiten</button>`}</div>`,
    o=>{const b2=o.querySelector("[data-betaal]");if(b2)b2.onclick=async()=>{b2.disabled=true;try{const r=f.betaallink?{link:f.betaallink}:await api("betaal",{body:{id}});if(r.link)location.href=r.link}catch(e){b2.disabled=false;o.querySelector(".fout").textContent=e.message}}})}

/* ---------- start ---------- */
(async()=>{const q=new URLSearchParams(location.search),seg=location.pathname.split("/").filter(Boolean);
  if(seg[0]==="aanbevolen"&&seg[1])return toonAanbevolen(decodeURIComponent(seg[1]).toUpperCase());
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;if(h.startsWith("ticket-")){tab="tickets";TK.open=h.slice(7)}
  if(q.get("l")){$("#app").innerHTML=`<div class="laden"><div class="spin"></div><span>Even geduld, we openen uw omgeving…</span></div>`;
    try{const r=await api("sessie",{body:{l:q.get("l")},open:true});sessie.set(r.s);history.replaceState(null,"",location.pathname)}catch(e){history.replaceState(null,"",location.pathname);return toonLogin(e.message)}}
  if(q.get("betaald")){tab="facturen";history.replaceState(null,"",location.pathname);setTimeout(()=>toast("Dank u wel! Uw betaling wordt verwerkt."),600)}
  if(!sessie.get())return toonLogin();
  laad()})();
</script></body></html>
