<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#f5f8f8">
<title>Mijn klantomgeving</title>
<link rel="icon" href="/ms-logo-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/ms-logo-512.png" type="image/png" sizes="512x512"><link rel="shortcut icon" href="/favicon.ico?v=4"><link rel="apple-touch-icon" href="/ms-logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --bg-tint-a:rgb(37 44 60 / .07); --bg-tint-b:rgb(240 170 110 / .07);
  --surface:#ffffff; --surface-2:#eef3f4; --surface-3:#e4ecee; --ink:#0f1f26; --muted:#5d6f76; --line:#dde5e8;
  --brand:#252c3c; --brand-2:#2c3447; --brand-ink:#ffffff; --brand-soft:#eceef2;
  --accent:#e3b23c; --late:#c0392b; --late-bg:#fce8e5; --soon:#252c3c; --soon-bg:#f1f2f5; --ok:#23845a; --ok-bg:#e0f3e9;
  --shadow:0 1px 2px rgb(15 31 38 / .05),0 6px 20px rgb(15 31 38 / .06);
  --f-ui:"Manrope",system-ui,-apple-system,sans-serif;
  --f-title:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1417; --bg-tint-a:rgb(63 178 191 / .07); --bg-tint-b:rgb(240 170 110 / .04);
  --surface:#122126; --surface-2:#182b31; --surface-3:#203840; --ink:#e3ecee; --muted:#93a8ad; --line:#24393f;
  --brand:#3fb2bf; --brand-2:#2a87a3; --brand-ink:#04181b; --brand-soft:#123a40;
  --accent:#ebbd4c; --late:#ff8b7b; --late-bg:#3a1b17; --soon:#f1c25f; --soon-bg:#33290e; --ok:#7fd39b; --ok-bg:#15301f;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background:radial-gradient(1200px 600px at 85% -10%,var(--bg-tint-b),transparent 60%),radial-gradient(900px 500px at 20% 0%,var(--bg-tint-a),transparent 60%),var(--bg);background-attachment:fixed}
svg{width:20px;height:20px;flex:none}
a{color:var(--brand)}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* knoppen zoals het CRM */
button,.btn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:active,.btn:active{transform:scale(.97)}
button:hover,.btn:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
button svg,.btn svg{width:17px;height:17px}
.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2))!important;border-color:transparent!important;color:var(--brand-ink)!important;box-shadow:0 6px 16px rgb(37 44 60 / .25)!important}
.ghost{background:transparent!important;border-color:transparent!important;box-shadow:none!important;color:var(--muted)}
.wa{background:#1f9d55!important;border-color:transparent!important;color:#fff!important}
button:disabled{opacity:.55;cursor:default;transform:none}
.full{width:100%}.big{padding:14px 18px;font-size:15.5px;border-radius:14px}
.iconbtn{width:40px;height:40px;padding:0;border-radius:12px}

/* schil */
.app{display:block}
aside.side{display:none}
.topbar{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.topbar .sp{flex:1}
.menu-knop{width:44px;height:44px;display:grid;place-items:center;border:0;padding:0;border-radius:12px;background:transparent;color:var(--ink);flex:none;cursor:pointer}.menu-knop:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.logo{font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;color:var(--ink);min-width:0}
.logo .mk{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.logo .mk img{width:100%;height:100%;object-fit:contain}
.logo .mk.gr{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:none}
.logo .wm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;border:0;padding:0}
main{padding:20px 16px calc(110px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:5px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;box-shadow:none}
nav.tabs button i{display:grid;place-items:center;width:44px;height:30px;border-radius:15px}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="true"]{color:var(--ink)}
nav.tabs button[aria-current="true"] i{background:var(--brand-soft);color:var(--brand)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--late);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-style:normal}
@media (min-width:980px){
  .app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
  aside.side{display:flex;flex-direction:column;background:color-mix(in srgb,var(--surface) 70%,transparent);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
  aside .logo{padding:26px 22px 22px;border-bottom:1px solid var(--line)}
  aside .nlbl{margin:22px 24px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  aside nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
  aside nav button{justify-content:flex-start;gap:14px;background:transparent;border:0;color:var(--ink);font-weight:600;font-size:15px;padding:11px 14px;border-radius:14px;text-align:left;position:relative}
  aside nav button svg{width:21px;height:21px;color:var(--muted)}
  aside nav button:hover{background:var(--surface-2)}
  aside nav button[aria-current="true"]{color:var(--brand-ink);background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 16px rgb(37 44 60 / .28)}
  aside nav button[aria-current="true"] svg{color:var(--brand-ink)}
  aside nav button .badge{position:static;margin-left:auto}
  aside .sp{flex:1}
  aside .help{margin:14px 14px 0;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
  aside .help b{display:block;font-size:14px}aside .help small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 10px}
  aside .help .row{display:flex;gap:6px}aside .help .row .btn{flex:1;padding:8px;font-size:13px}
  aside .usercard{margin:14px;padding:12px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;gap:10px;min-width:0}
  aside .usercard>div{flex:1;min-width:0}
  aside .usercard b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .usercard small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .usercard button{padding:0;width:34px;height:34px;border-radius:10px;background:transparent;border:0;color:var(--muted)}
  .topbar,nav.tabs{display:none}
  main{padding:40px 40px 80px}
}

/* typografie */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px;margin:0}
.eyebrow svg{width:16px;height:16px;color:var(--brand)}
.eyebrow .pill{text-transform:none;letter-spacing:0;font-size:12px;margin-left:auto}
.hero .eyebrow{flex-wrap:wrap}
h1{font-family:var(--f-title);font-weight:600;letter-spacing:-.022em;line-height:1.07;margin:4px 0 6px;font-size:clamp(32px,4.6vw,48px);text-wrap:balance}
.subt{color:var(--muted);margin:0}
.vd-date{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:16px;font-weight:500}
.vd-date svg{width:20px;height:20px;color:var(--accent)}
.wk{background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:99px}
.pagehead{margin-bottom:20px}

/* indeling */
.pg{display:grid;gap:18px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:1240px){.pg.met-paneel{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.pg.met-paneel>.paneel{position:sticky;top:40px}}
.grid2{display:grid;gap:18px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}

/* kaarten (kp) zoals de klantkaart in het CRM */
.kp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kp-h{display:flex;align-items:center;gap:12px}.kp-h>div{min-width:0}.kp-h b{font-size:16px;display:block}.kp-h small{display:block;color:var(--muted);font-size:13px;font-weight:500}.kp-h .sp{flex:1}
.objic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;flex:none}
.objic svg{width:20px;height:20px}
.objic.goud{background:linear-gradient(135deg,#3a4560,#252c3c)}
.objic.groen{background:linear-gradient(135deg,#2f9a68,#1d7a50)}
.objic.rood{background:linear-gradient(135deg,#d65745,#a3352f)}
.objic.zacht{background:var(--brand-soft);color:var(--brand)}
.lijst{display:flex;flex-direction:column;margin:0 -16px -16px}
.lr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-radius:0;border-left:0;border-right:0;border-bottom:0;text-align:left;font-weight:500;color:inherit;text-decoration:none;cursor:default}
button.lr,a.lr{cursor:pointer;transform:none!important}
button.lr:hover,a.lr:hover{background:var(--surface-2);border-color:var(--line)}
.lr:last-child{border-radius:0 0 var(--r) var(--r)}
.lr .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand);flex:none}
.lr .ti svg{width:18px;height:18px}
.lr .tx{flex:1;min-width:0}.lr .tx b{display:block;font-weight:700;font-size:15px}.lr .tx small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.lr .rt{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.lr .chev{width:17px;height:17px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)}.pill.soon{background:var(--soon-bg);color:var(--soon)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.neutral{background:var(--surface-2);color:var(--muted)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.leeg{padding:22px 4px 8px;text-align:center;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0}
.stat b{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{color:var(--muted);font-size:13px}
.stat.goud b{color:#252c3c}
@media (max-width:520px){.stats{gap:8px}.stat{padding:12px}.stat b{font-size:20px}}

/* volgende bezoek */
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.hero-in{display:flex;gap:20px;align-items:center;padding:24px 22px 18px}
.kal{width:96px;flex:none;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 10px 24px -14px rgb(15 31 38 / .4);overflow:hidden;text-align:center}
.kal i{display:block;font-style:normal;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 0 5px}
.kal b{display:block;font-size:44px;line-height:1;font-weight:800;letter-spacing:-.04em;padding:10px 0 2px;font-variant-numeric:tabular-nums}
.kal small{display:block;color:var(--muted);font-size:12px;font-weight:700;padding-bottom:10px;text-transform:capitalize}
.hero-tx{flex:1;min-width:0}
.hero-tx h2{font-family:var(--f-title);font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.15;margin:6px 0 4px;text-transform:none}
.hero-tx h2::first-letter{text-transform:uppercase}
.hero-tx .tijd{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:700}
.hero-tx .tijd svg{width:17px;height:17px;color:var(--brand)}
.hero-tx p{color:var(--muted);margin:6px 0 0}
.hero-acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;padding:0 22px 20px}
.hero-acts button{min-width:0}
.hero-ft{border-top:1px solid var(--line);padding:12px 22px;color:var(--muted);font-size:14px;background:var(--surface-2)}
.hero-ft b{color:var(--ink)}
.puls{width:11px;height:11px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 0 rgb(35 132 90 / .5)}
@media (prefers-reduced-motion:no-preference){.puls{animation:puls 1.8s infinite}}
@keyframes puls{70%{box-shadow:0 0 0 11px rgb(35 132 90 / 0)}100%{box-shadow:0 0 0 0 rgb(35 132 90 / 0)}}
@media (max-width:520px){.hero-in{padding:22px 16px 16px;gap:14px}.kal{width:78px}.kal b{font-size:36px}.hero-tx h2{font-size:21px}.hero-acts{padding:0 16px 16px}.hero-acts button{padding:10px 6px;font-size:13px;gap:6px}.hero-ft{padding:12px 16px}}

/* meldingen */
.melding{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.melding .tx{flex:1;min-width:0}.melding .tx b{display:block;font-size:15px}.melding .tx small{color:var(--muted);font-size:13.5px}
.melding.rood{border-color:color-mix(in srgb,var(--late) 30%,var(--line))}
.melding.goud{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
button.melding{width:100%;text-align:left;font-weight:500;color:inherit}
.sterren{display:flex;gap:6px;margin-top:2px}
.sterren button{width:46px;height:46px;padding:0;border-radius:12px;color:var(--line);background:var(--surface-2);border-color:transparent}
.sterren button svg{width:24px;height:24px}
.sterren button.aan{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.mini-st{display:inline-flex;gap:1px;color:var(--accent);vertical-align:-1px}.mini-st svg{width:12px;height:12px}

/* aanbevelen */
.ref-bedrag{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ref-bedrag b{font-family:var(--f-title);font-size:56px;line-height:1;font-weight:700;letter-spacing:-.035em;color:#252c3c}
.ref-bedrag span{color:var(--muted);font-weight:700;max-width:32ch;line-height:1.35}
.stappen{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:10px;counter-reset:s}
.stappen li{display:flex;gap:12px;align-items:flex-start;counter-increment:s;font-weight:500}
.stappen li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12.5px;display:grid;place-items:center;flex:none}
.code{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:6px 6px 6px 16px}
.code b{flex:1;font-size:19px;letter-spacing:.1em;font-weight:800}
.deel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* bladen en dialogen */
.ov{position:fixed;inset:0;z-index:50;background:rgb(17 24 28 / .35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media (prefers-reduced-motion:no-preference){.ov{animation:fade .18s ease-out}.blad{animation:op .3s cubic-bezier(.22,1,.36,1)}}
@keyframes fade{from{opacity:0}}@keyframes op{from{transform:translateY(40px);opacity:0}}
.blad{will-change:transform}.pdf-slot .laden{min-height:100%}.pdf-v .laden{height:100%}
.blad{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 30px 70px rgb(0 0 0 / .25)}
.blad .greep{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@media(min-width:640px){.ov{align-items:center}.blad{border-radius:22px;padding:22px}.blad .greep{display:none}}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dh>div{flex:1;min-width:0}.dh h3{margin:0;font-size:19px;letter-spacing:-.01em}.dh small{display:block;color:var(--muted);font-size:13.5px}
.veld{display:block;margin:0 0 14px;font-weight:700;font-size:13.5px}
.veld>span{display:block;margin-bottom:6px}
.veld input,.veld textarea,.veld select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;font-weight:500;outline:none;margin-top:6px}
.veld input:focus,.veld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.veld textarea{min-height:96px;resize:vertical}
.codeveld{display:flex;gap:8px;align-items:center;margin-top:6px}.codeveld input{margin-top:0;flex:1;width:auto;min-width:0;font-size:18px;letter-spacing:.12em;font-weight:700}
.hulp{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:5px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keus{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.keus label{cursor:pointer;position:relative}
.keus input{position:absolute;opacity:0;pointer-events:none}
.keus span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px;background:var(--surface);transition:all .12s}
.keus input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.keus input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.acties{display:flex;gap:10px;margin-top:6px}.acties>*{flex:1}
.fout{color:var(--late);font-weight:700;font-size:14px;min-height:18px;margin:2px 0 6px}
.klaar-ic{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:8px auto 14px}
.klaar-ic svg{width:28px;height:28px}
.sub{color:var(--muted);margin:0 0 14px}
.blad h3{font-size:21px;letter-spacing:-.015em;margin:2px 0 4px;font-family:var(--f-title);font-weight:600}

/* betaalgedrag */
:root{--bm-ok:var(--ok);--bm-brand:var(--brand);--bm-soon:#252c3c;--bm-late:var(--late);--bm-neutral:var(--line)}

.bp-mt{position:absolute;left:0;right:0;bottom:2px;text-align:center;line-height:1}.bp-mt b{font-size:32px;font-weight:800;letter-spacing:-.04em;display:block}.bp-mt small{color:var(--muted);font-size:11.5px;font-weight:600}

.bp-ok{--bm-k:var(--ok)}.bp-brand{--bm-k:var(--brand)}.bp-soon{--bm-k:#c47414}.bp-late{--bm-k:var(--late)}.bp-neutral{--bm-k:var(--ink)}

.bp-dots{display:flex;gap:5px}.bp-dots i{width:22px;height:6px;border-radius:3px;background:var(--surface-3,#e7ecee)}.bp-dots i.on{background:var(--bm-k)}
.bp-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bp-k>div{padding:12px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}.bp-k>div+div{border-left:1px solid var(--line)}
.bp-k small{color:var(--muted);font-size:12.5px}.bp-k b{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}

.bg-b.soon{background:#252c3c}.bg-b.late{background:var(--late)}.bg-b.open{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--brand) 55%,transparent) 0 4px,color-mix(in srgb,var(--brand) 25%,transparent) 4px 8px)}

/* bedankt na betalen */

.bk-c{position:relative;z-index:1;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.17);border:1.5px solid rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 30px -10px rgba(0,0,0,.35);animation:bkPop .6s cubic-bezier(.3,1.6,.5,1) .1s both}

/* ---------- Aanbevelen ---------- */
.rf{display:flex;flex-direction:column;gap:16px}
.rf-hero{position:relative;overflow:hidden;border-radius:26px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;color:#fff;background:linear-gradient(150deg,#323b50 0%,#252c3c 45%,#1a2030 100%);box-shadow:0 24px 50px -30px rgba(8,40,48,.6)}
.rf-hero::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-180px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);pointer-events:none}
.rf-ht{position:relative;min-width:0}
.rf-eb{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.rf-eb svg{width:16px;height:16px}
.rf-hero h2{margin:10px 0 8px;font-size:clamp(26px,3.4vw,36px);font-weight:600;letter-spacing:-.03em;line-height:1.1;color:#fff}
.rf-hero p{margin:0 0 18px;color:rgba(255,255,255,.82);font-size:15px;line-height:1.55;max-width:520px}
.rf-link{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:8px 8px 8px 16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rf-link>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rf-link small{font-size:11.5px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.02em}
.rf-link b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-kop{flex:none;display:inline-flex;align-items:center;gap:7px;background:#fff!important;color:#1a2030!important;border:0!important;border-radius:12px!important;padding:10px 16px!important;font-weight:700;box-shadow:0 6px 16px -8px rgba(0,0,0,.35)}
.rf-kop svg{width:16px;height:16px}
.rf-deel{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.rf-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 0;min-width:110px;padding:11px 14px;border-radius:13px;font-weight:600;font-size:14.5px;text-decoration:none;color:#fff!important;background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.22)!important;box-shadow:none!important;cursor:pointer}
.rf-btn svg{width:18px;height:18px}
.rf-btn.wa{background:#25a35a!important;border-color:transparent!important}
.rf-btn.sm{flex:none;padding:10px 16px}
.rf-vis{position:relative;height:200px}
.rf-kaart{position:absolute;width:190px;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.96);color:#14232a;box-shadow:0 20px 40px -18px rgba(0,0,0,.45)}
.rf-kaart small{font-size:12px;font-weight:600;color:#6b7b83}.rf-kaart b{font-size:34px;font-weight:600;letter-spacing:-.03em;color:#252c3c}.rf-kaart span{font-size:12.5px;color:#6b7b83}
.rf-kaart.k1{right:0;top:0;transform:rotate(4deg)}
.rf-kaart.k2{left:0;bottom:0;transform:rotate(-5deg);background:rgba(255,255,255,.85)}.rf-kaart.k2 b{color:#1f9a63}
.rf-tg{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:8px}
.rf-tg>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.rf-tg>div.hl{border-color:color-mix(in srgb,#22a46c 35%,var(--line));background:color-mix(in srgb,#22a46c 6%,var(--surface))}
.rf-tg small{font-size:12.5px;color:var(--muted);font-weight:600}
.rf-tg b{font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rf-tg .hl b{color:#178a5e}
.rf-tg span{font-size:12px;color:var(--muted)}
.rf-tg>i{color:color-mix(in srgb,var(--muted) 60%,transparent);display:grid}.rf-tg>i svg{width:18px;height:18px}
.rf-stappen ol{list-style:none;margin:0;padding:18px 18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;counter-reset:s}
.rf-stappen ol::before{content:"";position:absolute;left:12.5%;right:12.5%;top:36px;height:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 35%,transparent),color-mix(in srgb,#22a46c 45%,transparent))}
.rf-stappen li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.rf-sn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid color-mix(in srgb,var(--brand) 40%,var(--line));color:var(--brand);font-weight:700;font-size:15px;margin-bottom:6px}
.rf-stappen li:last-child .rf-sn{background:#22a46c;border-color:#22a46c;color:#fff}
.rf-stappen li b{font-size:14.5px;font-weight:600}
.rf-stappen li small{font-size:12.5px;color:var(--muted);line-height:1.4;max-width:190px}
.rf-r{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.rf-r:first-child{border-top:0}
.rf-av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;flex:none}
.rf-rt{flex:1;min-width:0;display:flex;flex-direction:column}.rf-rt b{font-size:14.5px;font-weight:600}.rf-rt small{font-size:12.5px;color:var(--muted)}
.rf-vg{display:flex;gap:4px}.rf-vg i{width:18px;height:4px;border-radius:2px;background:var(--surface-2)}.rf-vg i.on{background:#22a46c}
.rf-leeg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 20px 30px}
.rf-huizen{display:flex;gap:6px;margin-bottom:6px}.rf-huizen svg{width:30px;height:30px;padding:8px;box-sizing:content-box;border-radius:14px;background:var(--surface-2);color:color-mix(in srgb,var(--muted) 70%,transparent)}
.rf-huizen svg:nth-child(2){background:var(--brand-soft);color:var(--brand);transform:translateY(-6px)}
.rf-leeg b{font-size:16px;font-weight:600}.rf-leeg p{margin:0 0 10px;color:var(--muted);font-size:14px}
@media (max-width:760px){
  .rf-hero{grid-template-columns:1fr;padding:22px 18px}.rf-vis{display:none}
  .rf-tg{grid-template-columns:1fr}.rf-tg>i{display:none}
  .rf-stappen ol{grid-template-columns:1fr;gap:14px;padding:16px}.rf-stappen ol::before{left:35px;right:auto;top:30px;bottom:30px;width:2px;height:auto}
  .rf-stappen li{flex-direction:row;text-align:left;align-items:flex-start;gap:12px;display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto}
  .rf-sn{grid-row:1/span 2;margin:0}.rf-stappen li small{max-width:none}
  .rf-vg{display:none}
}
.rf-vis{height:250px}.rf-kaart{width:180px;padding:16px}.rf-kaart.k1{top:4px;right:0;z-index:1}.rf-kaart.k2{bottom:4px;left:0;z-index:2;background:#fff}
@media (max-width:760px){.rf-tg{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.rf-tg>div{padding:10px;border-radius:14px}.rf-tg b{font-size:18px}.rf-tg small{font-size:11px;line-height:1.25;min-height:28px}.rf-tg span{display:none}.rf-stappen ol::before{bottom:46px}}

/* ---------- live meekijken ---------- */
.lv{position:relative;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 44px -30px rgba(8,40,48,.55)}
.lv-map{height:260px;background:#eceef1;position:relative;z-index:0}
.lv-laad{position:absolute;inset:0;background:linear-gradient(110deg,#eceef1 30%,#f4f5f7 50%,#eceef1 70%);background-size:200% 100%;animation:lvShim 1.4s linear infinite}
@keyframes lvShim{to{background-position:-200% 0}}
.lv-fout{margin:0;padding:110px 0;text-align:center;color:var(--muted)}
.lv-ic{background:none;border:0}
.lv-auto{position:relative;display:block;width:48px;height:48px}
.lv-rot{position:absolute;inset:4px;display:block;transition:transform .8s ease;filter:drop-shadow(0 6px 10px rgba(8,40,48,.35))}
.lv-rot svg{width:100%;height:100%;display:block}
.lv-puls{position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,var(--brand) 30%,transparent);animation:lvRing 2s ease-out infinite}
@keyframes lvRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.lv-huis{display:grid;place-items:center;width:40px;height:40px;border-radius:14px 14px 14px 4px;transform:rotate(-45deg);background:#fff;box-shadow:0 8px 18px -6px rgba(8,40,48,.4),inset 0 0 0 2px var(--brand)}
.lv-huis svg{width:20px;height:20px;transform:rotate(45deg);color:var(--brand)}
.lv-info{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--line)}
.lv-car{width:46px;height:46px;flex:none;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center}.lv-car svg{width:40px;height:40px}
.lv-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lv-st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#178a5e}
.lv-st i{width:8px;height:8px;border-radius:50%;background:#22a46c;animation:lvDot 1.8s ease-out infinite}
@keyframes lvDot{0%{box-shadow:0 0 0 0 rgba(34,164,108,.55)}80%,100%{box-shadow:0 0 0 8px rgba(34,164,108,0)}}
.lv-tx b{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.lv-tx span{font-size:13.5px;color:var(--muted)}
.lv-eta{flex:none;text-align:right;display:flex;flex-direction:column;gap:1px;padding-left:14px;border-left:1px solid var(--line)}
.lv-eta small{font-size:11.5px;color:var(--muted);font-weight:600}
.lv-eta b{font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--brand);font-variant-numeric:tabular-nums}
.lv-wacht{position:relative;height:120px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 7%,var(--surface)),var(--surface))}
.lv-wacht>svg:first-child{width:34px;height:34px;color:var(--brand)}
.lv-wacht>span{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--brand) 35%,transparent);animation:lvStip 1.4s ease-in-out infinite}
.lv-wacht>span:nth-of-type(2){animation-delay:.2s}.lv-wacht>span:nth-of-type(3){animation-delay:.4s}
@keyframes lvStip{50%{background:var(--brand);transform:scale(1.3)}}
.lv-wacht>svg:last-child{width:46px;height:46px;transform:rotate(-90deg);filter:drop-shadow(0 6px 10px rgba(8,40,48,.25))}
.lv .leaflet-control-attribution{font-size:9.5px}
@media (max-width:600px){.lv-map{height:220px}.lv-eta b{font-size:20px}.lv-tx b{font-size:15px}}

.lv-auto{width:64px!important;height:64px!important}
.lv-rot{inset:0!important;display:grid!important;place-items:center;filter:none!important}
.lv-rot svg{width:30px!important;height:54px!important;filter:drop-shadow(0 5px 5px rgba(8,40,48,.38)) drop-shadow(0 0 1px rgba(8,40,48,.4))}
.lv-puls{inset:10px!important;background:color-mix(in srgb,var(--brand) 22%,transparent)!important}
.lv-car{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--brand-soft))!important;width:58px!important;height:46px!important}
.lv-car svg{width:48px!important;height:30px!important}
.lv-wacht>svg:last-child{width:56px!important;height:35px!important;transform:none!important}

.lv-bron{position:absolute;right:8px;bottom:8px;z-index:500;display:flex;align-items:center;gap:6px;padding:0!important;border:0!important;background:rgba(255,255,255,.85)!important;border-radius:999px!important;box-shadow:0 1px 3px rgba(0,0,0,.15)!important;color:#5b6b72!important;font:600 10px/1 Manrope,system-ui,sans-serif;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lv-bron span{width:18px;height:18px;display:grid;place-items:center;font-style:italic;font-family:Georgia,serif;font-size:11px}
.lv-bron em{font-style:normal;max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .25s,padding .25s}
.lv-bron.open em{max-width:200px;padding-right:9px}

.lv-map .leaflet-tile-pane{filter:saturate(.7) brightness(1.04) contrast(.95)}

/* ---------- Bezoeken ---------- */
.bz-hero{position:relative;display:flex;align-items:center;gap:28px;padding:28px 30px;border-radius:26px;overflow:hidden;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#3a4560 0%,transparent 55%),linear-gradient(135deg,#1c2231,#252c3c 55%,#2c3447);box-shadow:0 24px 50px -28px rgb(15 70 85 / .7)}
.bz-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 120%,rgb(255 255 255 / .14),transparent 40%),repeating-linear-gradient(115deg,rgb(255 255 255 / .035) 0 2px,transparent 2px 26px);pointer-events:none}
.bz-hero>*{position:relative}
.bz-hm{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.bz-k{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgb(255 255 255 / .75);display:flex;align-items:center;gap:8px}
.bz-hero h2{margin:0;font-size:clamp(26px,3.4vw,36px);font-weight:700;letter-spacing:-.03em;line-height:1.1;color:#fff}
.bz-s{margin:0;font-size:15px;color:rgb(255 255 255 / .82);max-width:520px}
.bz-line{margin-top:10px;max-width:520px}
.bz-tr{position:relative;height:8px;border-radius:8px;background:rgb(255 255 255 / .18)}
.bz-tr i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#9ff0d2,#fff)}
.bz-tr em{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 5px rgb(255 255 255 / .25)}
.bz-ll{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:rgb(255 255 255 / .7)}
.bz-ll span{display:flex;flex-direction:column;gap:1px}.bz-ll span:last-child{text-align:right}.bz-ll b{color:#fff;font-size:14px;font-weight:700}
.bz-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bz-acts button{background:rgb(255 255 255 / .14);color:#fff;border:1px solid rgb(255 255 255 / .22);backdrop-filter:blur(6px);border-radius:12px;padding:9px 14px;font-weight:650;display:inline-flex;align-items:center;gap:7px}
.bz-acts button:hover{background:rgb(255 255 255 / .24)}.bz-acts svg{width:16px;height:16px}
.bz-ring{position:relative;width:150px;height:150px;flex:none}
.bz-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bz-ring .t{fill:none;stroke:rgb(255 255 255 / .16);stroke-width:8}
.bz-ring .v{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.bz-ring>span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.bz-ring b{font-size:44px;font-weight:700;letter-spacing:-.04em}.bz-ring small{font-size:13px;color:rgb(255 255 255 / .75);margin-top:4px;font-weight:600}
.bz-ring.bz-ic{display:grid;place-items:center;border-radius:50%;background:rgb(255 255 255 / .12);border:1px solid rgb(255 255 255 / .2)}.bz-ring.bz-ic svg{width:54px;height:54px;transform:none}
.bz-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bz-tile{position:relative;display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.bz-tile::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 12%,transparent),transparent 70%)}
.bz-ti{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:8px}.bz-ti svg{width:17px;height:17px}
.bz-tile small{font-size:12.5px;color:var(--muted);font-weight:600}
.bz-tile b{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.bz-tile em{font-style:normal;font-size:12.5px;color:var(--muted)}
.bz-tile .mini-st{margin-top:2px}
.bz-tl{padding:20px 22px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.bz-tlh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bz-tlh b{font-size:17px;font-weight:700;letter-spacing:-.01em}.bz-tlh small{color:var(--muted);font-size:13px}
.bz-ol{list-style:none;margin:0;padding:0 0 0 30px;position:relative;display:flex;flex-direction:column;gap:10px}
.bz-ol::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 35%,transparent),var(--line) 40%)}
.bz-it{position:relative}
.bz-dot{position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px dashed color-mix(in srgb,var(--brand) 55%,var(--line));z-index:1}
.bz-it.gepland .bz-dot{border-style:solid;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.bz-it.af .bz-dot{border:0;background:var(--ok);color:#fff}.bz-dot svg{width:13px;height:13px}
.bz-card{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);transition:transform .15s,box-shadow .15s}
.bz-card:hover{transform:translateY(-1px);box-shadow:0 10px 22px -16px rgb(15 31 38 / .35)}
.bz-it.gepland .bz-card{border-color:color-mix(in srgb,var(--brand) 30%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 6%,var(--surface)),var(--surface))}
.bz-it.verwacht .bz-card{border-style:dashed}
.bz-dt{width:52px;height:56px;flex:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);line-height:1}
.bz-dt b{font-size:21px;font-weight:700;letter-spacing:-.03em}.bz-dt small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.bz-it.gepland .bz-dt{background:var(--brand);color:#fff}.bz-it.gepland .bz-dt small{color:rgb(255 255 255 / .8)}
.bz-it.af .bz-dt{background:var(--ok-bg);color:var(--ok)}.bz-it.af .bz-dt small{color:var(--ok);opacity:.8}
.bz-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.bz-tx b{font-size:15px;font-weight:700}.bz-tx small{color:var(--muted);font-size:13px}
.bz-rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}.bz-rt b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.bz-jr{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:6px 0 -2px -30px;padding-left:30px}
.bz-nu{position:relative;margin:4px 0 4px -30px;padding-left:30px;height:18px}
.bz-nu::before{content:"";position:absolute;left:4px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateY(-50%);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.bz-nu span{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 70%,var(--ink));position:relative;top:1px}
.bz-tip{margin:12px 0 0;color:var(--muted);font-size:13px}
@media (max-width:640px){.bz-hero{display:block;padding:22px 20px;border-radius:22px}.bz-ring{position:absolute!important;right:16px;top:16px;width:78px;height:78px}.bz-ring b{font-size:24px}.bz-ring small{font-size:11px;margin-top:2px}.bz-ring.bz-ic svg{width:32px;height:32px}.bz-hero h2,.bz-k{padding-right:88px}.bz-hero h2{font-size:24px}.bz-s{font-size:14px}.bz-acts button{padding:8px 12px;font-size:14px}.bz-tiles{grid-template-columns:1fr 1fr;gap:10px}.bz-tile{padding:14px}.bz-tile b{font-size:20px}.bz-tl{padding:16px}.bz-card{gap:10px;padding:10px}.bz-dt{width:46px;height:50px}.bz-rt .pill{display:none}}

/* ---------- portaal: stijl van Bezoeken overal ---------- */
.kp{border-radius:22px!important;box-shadow:0 1px 2px rgb(15 31 38 / .04),0 14px 30px -24px rgb(15 50 60 / .35)!important}
.kp>.kp-h{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 5%,var(--surface)),var(--surface))!important;border-bottom:1px solid var(--line)!important;padding:16px 18px!important}
.kp>.kp-h .objic{background:linear-gradient(135deg,var(--brand),var(--brand-2))!important;color:#fff!important;border-radius:12px!important}
.kp>.kp-h .objic.groen{background:linear-gradient(135deg,#2bb673,#1f8f5c)!important}
.kp>.kp-h .objic.goud{background:linear-gradient(135deg,#3a4560,#252c3c)!important}

/* ====================================================================
   Huisstijl van het CRM: gekleurde kop + witte body, hairlines, teal cijfers
   ==================================================================== */
:root{--kop:linear-gradient(135deg,#1c2231,#252c3c 55%,#2c3447);--kop-goud:linear-gradient(135deg,#9a5a12,#d08a2e 60%,#b7781f);--kop-rood:linear-gradient(135deg,#8f2a22,#d65745 60%,#b0423a);--kop-groen:linear-gradient(135deg,#17734b,#22a46c 60%,#16805a);--kop-grijs:linear-gradient(135deg,#5b7480,#6f8893);
  --lijnen:radial-gradient(circle at 18% 140%,rgb(255 255 255 / .14),transparent 45%),repeating-linear-gradient(115deg,rgb(255 255 255 / .035) 0 2px,transparent 2px 26px);
  --kaart-schaduw:0 1px 2px rgb(15 31 38 / .05),0 16px 32px -22px rgb(15 50 60 / .45)}
/* kaartkop */
.kp{border:0!important;box-shadow:var(--kaart-schaduw)!important}
.kp>.kp-h{position:relative;overflow:hidden;color:#fff;background:var(--kop)!important;border-bottom:0!important;padding:14px 18px 16px!important}
.kp>.kp-h::before{content:"";display:block!important;position:absolute;inset:0;background:var(--lijnen);pointer-events:none;-webkit-mask:none;mask:none}
.kp>.kp-h>*{position:relative}
.kp>.kp-h b{color:#fff;font-size:17px!important;letter-spacing:-.02em}
.kp>.kp-h small{color:rgb(255 255 255 / .78)!important;font-size:12.5px}
.kp>.kp-h .objic{width:42px!important;height:42px!important;border-radius:13px!important;background:rgb(255 255 255 / .16)!important;border:1px solid rgb(255 255 255 / .25);color:#fff!important;box-shadow:none!important}
.kp>.kp-h .objic svg{width:21px;height:21px}
.kp:has(>.kp-h>.objic.goud)>.kp-h{background:var(--kop-goud)!important}
.kp:has(>.kp-h>.objic.rood)>.kp-h{background:var(--kop-rood)!important}
.kp:has(>.kp-h>.objic.groen)>.kp-h{background:var(--kop-groen)!important}
.kp:has(>.kp-h>.objic.zacht)>.kp-h{background:var(--kop-grijs)!important}
.kp>.kp-h .primary,.kp>.kp-h button:not(.ghost),.kp>.kp-h .btn{background:rgb(255 255 255 / .16)!important;border:1px solid rgb(255 255 255 / .25)!important;color:#fff!important;box-shadow:none!important;border-radius:999px!important;padding:7px 13px!important;font-size:13px}
.kp>.kp-h .ghost{color:#fff!important}
.kp>.kp-h .pill{background:rgb(255 255 255 / .16);color:#fff}
.kp .lijst>.lr:first-child{border-top:0}
.lr .tx b{font-weight:700}
.lr .rt b,.lr .rt>span:first-child{color:var(--ink)}
/* cijferrijen: witte kaart met hairlines, teal cijfers */
.stats,.rf-tg,.bz-tiles{background:var(--surface)!important;border:1px solid var(--line);border-radius:20px!important;padding:0!important;gap:0!important;box-shadow:var(--kaart-schaduw)!important;overflow:hidden}
.stats::before,.rf-tg::before,.bz-tiles::before{display:none!important}
.stats .stat,.rf-tg>div,.bz-tile{background:none!important;border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;box-shadow:none!important;padding:12px 16px 13px!important;color:var(--ink);min-height:0!important;gap:2px!important}
.stats .stat:first-child,.rf-tg>div:first-of-type,.bz-tile:first-child{border-left:0!important}
.stats .stat small,.rf-tg small,.rf-tg span,.bz-tile small,.bz-tile em{color:var(--muted)!important;font-size:12px!important;font-weight:600}
.stats .stat b,.rf-tg b,.bz-tile b{color:var(--brand)!important;font-size:21px!important;font-weight:700!important;letter-spacing:-.025em;line-height:1.15!important;margin-top:1px!important}
.stats .stat b[style*="--late"]{color:var(--late)!important}
.stat.goud b{color:#252c3c!important}
.rf-tg{grid-template-columns:1fr auto 1fr auto 1fr!important}
.rf-tg>i{display:grid!important;color:var(--line)!important;padding:0 2px;background:var(--surface)}
.rf-tg>div.hl{background:color-mix(in srgb,#22a46c 6%,var(--surface))!important}.rf-tg>div.hl b{color:#178a5e!important}
@media (max-width:760px){.rf-tg{grid-template-columns:repeat(3,minmax(0,1fr))!important}.rf-tg>i{display:none!important}.rf-tg small{min-height:0!important}}
/* bezoeken-tegels */
.bz-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.bz-tile{position:relative;padding:14px 16px 14px!important}
.bz-ti{width:32px;height:32px;border-radius:10px;background:var(--brand-soft)!important;color:var(--brand)!important;margin-bottom:8px}
.bz-tile b{font-size:20px!important}
.bz-dr{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.bz-dr i{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--surface-3);animation:rsOp .4s both;animation-delay:calc(var(--i)*50ms)}.bz-dr i.on{background:linear-gradient(180deg,#5cc6d6,var(--brand))}.bz-dr small{font-size:11px;color:var(--muted);align-self:center}
.bz-rt8{display:flex;gap:3px;margin-top:8px}.bz-rt8 i{flex:1;height:6px;border-radius:3px;background:var(--surface-3)}.bz-rt8 i.on{background:var(--brand)}
.bz-rt8t{font-size:11px!important;margin-top:4px}
.bz-tile .mini-st svg{color:var(--accent)}
@media (max-width:640px){.bz-tiles{grid-template-columns:1fr 1fr}.bz-tile:nth-child(odd){border-left:0!important}.bz-tile:nth-child(n+3){border-top:1px solid var(--line)!important}}
/* tijdlijn: route-lijn met stops zoals in het CRM */
.bz-tl{padding:0!important;overflow:hidden}
.bz-tlh{position:relative;overflow:hidden;margin:0!important;padding:14px 18px 16px;color:#fff;background:var(--kop)}
.bz-tlh::before{content:"";position:absolute;inset:0;background:var(--lijnen);pointer-events:none}.bz-tlh>*{position:relative}
.bz-tlh b{color:#fff;font-size:17px!important}.bz-tlh small{color:rgb(255 255 255 / .78)!important}
.bz-ol{padding:16px 16px 16px 60px!important;gap:10px!important}
.bz-ol::before{left:32px!important;width:3px!important;top:28px!important;bottom:28px!important;border-radius:2px;background:var(--line)!important}
.bz-ol::after{display:none}
.bz-dot{left:-44px!important;width:34px!important;height:34px!important;border:2.5px solid var(--brand)!important;background:var(--surface)!important;color:var(--brand);box-shadow:0 0 0 3px var(--surface)!important;z-index:2;font-weight:800;font-size:13px}
.bz-it.af .bz-dot{background:#23845a!important;border-color:#23845a!important;color:#fff}.bz-it.af .bz-dot svg{width:16px;height:16px;stroke:#fff}
.bz-it.gepland .bz-dot{background:var(--kop)!important;border-color:transparent!important;box-shadow:0 0 0 3px var(--surface),0 0 0 6px color-mix(in srgb,var(--brand) 22%,transparent)!important;animation:rnumPuls 2.4s ease-in-out infinite}
.bz-it.gepland .bz-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.bz-it.verwacht .bz-dot{border-style:dashed!important}
@keyframes rnumPuls{0%,100%{box-shadow:0 0 0 3px var(--surface),0 0 0 6px color-mix(in srgb,var(--brand) 22%,transparent)}50%{box-shadow:0 0 0 3px var(--surface),0 0 0 9px color-mix(in srgb,var(--brand) 8%,transparent)}}
.bz-card{border-radius:14px;padding:10px 12px;box-shadow:0 1px 2px rgb(15 31 38 / .04)}
.bz-it.gepland .bz-card{background:var(--surface);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.bz-it.verwacht .bz-card{border:1px dashed color-mix(in srgb,var(--brand) 35%,var(--line))!important;background:var(--surface)}
.bz-dt{width:50px;height:52px;border-radius:12px}
.bz-it.gepland .bz-dt,.bz-it.verwacht .bz-dt{background:var(--kop);color:#fff}.bz-it.gepland .bz-dt small,.bz-it.verwacht .bz-dt small{color:rgb(255 255 255 / .8)}
.bz-it.af .bz-dt{background:var(--brand-soft);color:var(--brand)}.bz-it.af .bz-dt small{color:var(--brand);opacity:.8}
.bz-rt b{color:var(--ink)}
.bz-stempel{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:0;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;transform:none;opacity:1;mix-blend-mode:normal}
.bz-stempel svg{width:12px;height:12px}.bz-stempel i{font-style:normal}
.bz-nu{height:auto!important;margin:0 0 0 -60px!important;padding-left:60px!important;display:flex;align-items:center;gap:10px;position:relative}
.bz-nu::before{display:block!important;left:25px!important;width:17px!important;height:17px!important;background:var(--accent)!important;box-shadow:0 0 0 3px var(--surface),0 0 0 5px color-mix(in srgb,var(--accent) 30%,transparent)!important;z-index:2}
.bz-nu span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#252c3c!important;padding:5px 10px;border-radius:99px;background:var(--soon-bg)}
.bz-nubus{display:none}
.bz-jr{margin-left:-60px!important;padding-left:60px!important}
.bz-tip,.bz-tl>.leeg{margin:0 18px 16px!important}
@media (max-width:640px){.bz-ol{padding:14px 12px 14px 54px!important}.bz-ol::before{left:28px!important}.bz-dot{left:-42px!important;width:30px!important;height:30px!important}.bz-nu{margin-left:-54px!important;padding-left:54px!important}.bz-nu::before{left:22px!important;width:15px!important;height:15px!important}.bz-jr{margin-left:-54px!important;padding-left:54px!important}.bz-card{padding:9px 10px}.bz-dt{width:44px;height:48px}.bz-rt .bz-stempel{display:inline-flex}}

.bp{box-shadow:var(--kaart-schaduw)!important}

:root:root{--bg:#f5f5f4;--bg-tint-a:transparent;--bg-tint-b:transparent;--surface:#fff;--surface-2:#f3f4f6;--surface-3:#eceef1;--ink:#14181f;--muted:#6b7280;--line:#e3e5e8;
  --brand:#252c3c;--brand-2:#1b2130;--brand-ink:#fff;--brand-soft:#eceef2;--accent:#c9a46a;
  --f-ui:"Avenir Next","Avenir","Nunito Sans","Helvetica Neue",Arial,sans-serif;--f-title:"Avenir Next","Avenir","Nunito Sans","Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgb(20 24 34 / .04);--kaart-schaduw:0 1px 2px rgb(20 24 34 / .04);
  --gb-vlak:radial-gradient(120% 140% at 100% 0%,#4a5670 0%,transparent 55%),linear-gradient(135deg,#1a1f2c 0%,#2a3245 55%,#1d2332 100%);
  --gb-lijn:repeating-linear-gradient(115deg,rgb(255 255 255 / .018) 0 1px,transparent 1px 26px);
  --kop:var(--gb-vlak);--lijnen:var(--gb-lijn);--r:16px}

function tijdTxt(t,w){const m=toMin(t);if(m==null)return"In de loop van de dag";

function home(){const k=D.klant,openF=D.facturen.filter(f=>f.status==="open"||f.status==="verlopen"),som=openF.reduce((a,f)=>a+f.bedrag,0),A=D.aanbevelen;

const VZ={verzetten:"Afspraak verzetten",overslaan:"Bezoek overslaan",vakantie:"Afwezig",bericht:"Bericht",gegevens:"Gegevens wijzigen",extra:"Extra dienst",stoppen:"Opzeggen"};
function verzoekRij(v){return lr(v.type==="vakantie"?I.zon:v.type==="verzetten"?I.verzet:v.type==="overslaan"?I.pauze:I.bericht,esc(VZ[v.type]||"Verzoek")+(v.datum?" · "+esc(kort(v.datum)):"")+(v.tot?" t/m "+esc(kort(v.tot)):""),v.antwoord?esc(v.antwoord):v.status==="nieuw"?"Ontvangen op "+esc(kort(v.op.slice(0,10))):"Afgehandeld",`<span class="pill ${v.status==="nieuw"?"soon":"ok"}"><i></i>${v.status==="nieuw"?"In behandeling":"Geregeld"}</span>`)}

const hoofd=t=>String(t).charAt(0).toUpperCase()+String(t).slice(1);

      ${k.actief&&!(v&&v.bezig)?(()=>{const pc=volg?Math.max(pct,20):20;return `<div class="bz-line"><div class="bz-tr"><i style="width:${pc}%"></i><em class="bz-van" style="left:${pc}%">${AUTO}</em><span class="bz-huis">${I.huis}</span></div><div class="bz-ll"><span>${laatst?(isVve()?"Laatst schoongemaakt":"Laatst gewassen"):"Aangemeld"}<b>${laatst?esc(kort(laatst)):k.sinds?esc(kort(k.sinds)):"nu"}</b></span><span>${v?"Volgende":"Verwacht"}<b>${v?esc(kort(volg)):wk?"week "+wk:"wordt gepland"}</b></span></div></div>`})():""}
      <div class="bz-acts">${v&&!v.bezig?`<button data-act="overslaan">${I.pauze}Overslaan</button>`:""}<button data-act="toegang">${I.sleutel}Instructies</button><button data-act="ticket">${I.bericht}${isVve()?"Melding doen":"Vraag stellen"}</button></div></div>${ring}</section>`;
  return hero}
function bezoeken(){const v=D.volgende,b=D.bezoeken||[],k=D.klant,fq=Number(k.frequentie)||8,nu=vandaag(),hero=bzHero();

  const nB=D.aantalBezoeken||b.length,dagen=k.sinds?Math.max(1,Math.round((nu-p(k.sinds))/864e5)):0;
  const druppels=`<div class="bz-dr">${[...Array(Math.min(12,Math.max(nB,1)))].map((_,i)=>`<i class="${i<nB?"on":""}" style="--i:${i}"></i>`).join("")}${nB>12?`<small>+${nB-12}</small>`:""}</div>`;
  const laatst=b.length?b[0].datum:"",wk=laatst?Math.floor((nu-p(laatst))/864e5/7):0,ritme=`<div class="bz-rt8" title="${wk} van ${fq} weken sinds het laatste bezoek">${[...Array(Math.min(fq,12))].map((_,i)=>`<i class="${i<wk?"on":""}"></i>`).join("")}</div><em class="bz-rt8t">${laatst?`${wk} van ${fq} weken voorbij`:""}</em>`;
  const tiles=`<div class="bz-tiles">${tile(I.ruit||I.check,k.vve?"Schoonmaakbeurten":"Schone ramen",nB?plural(nB,"keer","keer"):"Nog geen",b.length?"sinds "+(d=>d.getDate()+" "+MK[d.getMonth()]+(d.getFullYear()!==nu.getFullYear()?" "+d.getFullYear():""))(p(b[b.length-1].datum)):"eerste bezoek volgt",druppels)}${tile(I.verzet||I.kal,"Ritme",k.vve?hoofd(k.ritme||""):fq===1?"Elke week":"Elke "+fq+" weken",esc(k.dienst||"Glasbewassing"),k.vve?"":ritme)}${tile(I.hart,"Klant sinds",k.sinds?esc(MND[p(k.sinds).getMonth()]+" "+p(k.sinds).getFullYear()):"–",dagen?plural(dagen,"dag","dagen")+" samen":"")}${gem?tile(I.ster,"Uw beoordeling",gem.toLocaleString("nl-NL",{maximumFractionDigits:1})+" / 5",st(Math.round(gem))):""}</div>`;

      <div class="bz-rt">${past?(x.bedrag&&!isVve()?`<b>${eur0(x.bedrag)}</b>`:"")+`<span class="bz-stempel">${I.check}<i>${isVve()?"Gedaan":"Gewassen"}</i></span>`:`<span class="pill ${x.soort==="verwacht"?"":"brand"}"><i></i>${x.soort==="verwacht"?"Verwacht":"Gepland"}</span>`}</div></div>${past&&isVve()?vveBeurtDetail(x):""}</li>`};

const duurTxt=(sec,kort)=>{if(sec==null)return"";sec=Math.max(0,Math.round(sec));const d=Math.floor(sec/86400),u=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),x=sec%60;

const tPil=s=>`<span class="pill ${(TST[s]||TST.open)[0]}"><i></i>${(TST[s]||TST.open)[1]}</span>`;
function tickets(){
  if(TK.open)return ticketDetail();
  const L=TK.lijst;
  const rij=t=>lr((TCAT[t.categorie]||TCAT.overig)[1],esc(t.onderwerp),`${t.ongelezen?`<b style="color:var(--brand);font-size:13px;display:inline">Nieuw antwoord · </b>`:""}${esc(t.nummer)} · ${esc(kort(String(t.laatst).slice(0,10)))}`,tPil(t.status),{attr:`data-tk="${esc(t.id)}"`,tis:t.ongelezen?"background:var(--brand);color:#fff":""});

  return (isVve()?kop("Meldingen",`<span class="tk-uitleg">Kapotte lamp, schade of een vraag over het gebouw? Maak hieronder een melding, met foto. U volgt de voortgang en alles blijft terug te lezen voor het hele bestuur.</span>`):kop("Tickets",`<span class="tk-uitleg">Voor vragen, opmerkingen en verzoeken maakt u hieronder een ticket aan. Zo is alles terug te lezen en volgt u de voortgang. Heeft u een aanvulling? Zet die in het bestaande ticket in plaats van een nieuw ticket te openen; dat houdt het overzichtelijk.</span>`))+`<div class="pg">
    <button class="melding tk-nieuw" data-act="ticket"><span class="objic">${I.plus}</span><div class="tx"><b>Nieuw ticket</b><small>Stel uw vraag, ook met een foto. U krijgt bericht zodra wij reageren.</small></div><span class="btn primary">Aanmaken</span></button>
    ${L===null?`<div class="laden" style="min-height:160px"><div class="spin"></div></div>`
     :L.length?`${open.length?kp(I.ticket,"Lopende tickets",`<div class="lijst">${open.map(rij).join("")}</div>`,{sub:plural(open.length,"ticket","tickets")}):""}${klaar.length?kp(I.check,"Opgelost",`<div class="lijst">${klaar.map(rij).join("")}</div>`,{kl:"groen",sub:plural(klaar.length,"ticket","tickets")}):""}`
     :kp(I.ticket,"Nog geen tickets",`<p class="leeg">Heeft u een vraag of is er iets niet goed gegaan? Maak hierboven een ticket aan.</p>`,{kl:"zacht"})}</div>`}
async function ticketsLaad(){try{const r=await api("tickets"),sig=JSON.stringify(r.tickets);if(sig===TK.lsig)return;TK.lsig=sig;TK.lijst=r.tickets;if(D){const n=r.tickets.reduce((x,t)=>x+(Number(t.ongelezen)||0),0);D.tickets={...(D.tickets||{}),ongelezen:n};document.querySelectorAll('[data-tab="tickets"] .badge').forEach(b=>{if(n>0)b.textContent=n;else b.remove()})}if(tab==="tickets"&&!TK.open)teken()}catch(e){if(TK.lijst===null){TK.lijst=[];if(tab==="tickets"&&!TK.open)teken()}}}
function ticketDetail(){const d=TK.d;
  return `<section class="chat tk" aria-label="Ticket">
    <header class="ch-h"><button class="iconbtn" data-tkterug aria-label="Terug naar tickets">${I.terug}</button><div style="min-width:0;flex:1"><b>${d?esc(d.ticket.onderwerp):"Ticket"}</b><small>${d?esc(d.ticket.nummer)+" · "+esc((TCAT[d.ticket.categorie]||TCAT.overig)[0]):"Laden…"}</small></div>${d?tPil(d.ticket.status):""}</header>
    <div class="ch-lijst" id="chl" aria-live="polite"><div class="laden" style="min-height:200px"><div class="spin"></div></div></div>
    ${d&&d.ticket.status==="opgelost"?`<div class="tk-dicht">${I.check}<span>Dit ticket is opgelost. Stuurt u een bericht, dan openen wij het opnieuw.</span></div>`:""}
    <div class="ch-prev" id="chp" hidden></div>
    <form class="ch-in" id="chf"><label class="btn iconbtn ch-foto" title="Foto toevoegen" aria-label="Foto toevoegen">${I.camera}<input type="file" accept="image/*" id="chfi" hidden></label>
      <textarea id="cht" rows="1" placeholder="Typ uw reactie…" aria-label="Reactie"></textarea><button class="primary iconbtn" id="chb" aria-label="Versturen">${I.stuur}</button></form></section>`}
const dagLbl=s=>{const d=new Date(s);d.setHours(0,0,0,0);const n=Math.round((vandaag()-d)/864e5);return n===0?"Vandaag":n===1?"Gisteren":d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})};
const tijdLbl=s=>new Date(s).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
function tkTeken(forceer){const l=$("#chl");if(!l||!TK.d)return;
  const bij=forceer||l.scrollHeight-l.scrollTop-l.clientHeight<120,B_=TK.d.berichten,laatsteKlant=[...B_].reverse().find(m=>m.van==="klant");let dag="",html="";
  for(const m of B_){const dl=dagLbl(m.op);if(dl!==dag){dag=dl;html+=`<div class="ch-dag"><span>${esc(dl)}</span></div>`}
    if(m.systeem){html+=`<div class="tk-sys">${esc(m.tekst)}</div>`;continue}
    const st=m===laatsteKlant?(m._bezig?"Versturen…":m._fout?"Niet verstuurd":TK.d.gezienTeam&&TK.d.gezienTeam>=m.op?"Gelezen":"Verzonden"):"";
    html+=`<div class="bel ${m.van==="klant"?"ik":"team"}${m._bezig?" bezig":""}${m._fout?" fout":""}">${m.foto?`<a class="bf" href="${m.foto.startsWith("data:")?"#":"/_blob/"+esc(m.foto)}" target="_blank" rel="noopener"><img src="${m.foto.startsWith("data:")?m.foto:"/_blob/"+esc(m.foto)}" alt="Foto"></a>`:""}${m.tekst?`<div class="bb">${esc(m.tekst).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>")}</div>`:""}<small>${m.van==="team"?esc(m.naam||merkNaam())+" · ":""}${tijdLbl(m.op)}${st?" · "+st:""}</small></div>`}
  if(B_.length&&B_[B_.length-1].van==="klant"&&TK.d.ticket.status!=="opgelost")html+=`<div class="tk-sys">We hebben uw bericht ontvangen en reageren zo snel mogelijk.</div>`;
  l.innerHTML=html;if(bij)l.scrollTop=l.scrollHeight}
/* ticket bekeken: teller en "nieuw antwoord" meteen weg, zonder te herladen */
function tkGelezen(id){try{const t=(TK.lijst||[]).find(x=>x.id===id);const n=t?Number(t.ongelezen)||0:0;if(t)t.ongelezen=0;
  if(D&&D.tickets){D.tickets.ongelezen=Math.max(0,(Number(D.tickets.ongelezen)||0)-n);if(!t)D.tickets.ongelezen=Math.max(0,D.tickets.ongelezen)}
  const v=D&&D.tickets?D.tickets.ongelezen:0;document.querySelectorAll('[data-tab="tickets"] .badge').forEach(b=>{if(v>0)b.textContent=v;else b.remove()});
  if(!v)document.querySelectorAll('button.melding[data-tab="tickets"]').forEach(b=>b.remove())}catch(e){}}
async function tkLaad(){if(!TK.open)return;try{const r=await api("ticket?id="+encodeURIComponent(TK.open));tkGelezen(TK.open);const sig=r.berichten.map(m=>m.id).join(",")+"|"+r.gezienTeam+"|"+r.ticket.status;
  const lokaal=TK.d?TK.d.berichten.filter(m=>m._bezig||m._fout):[];const statusAnders=!TK.d||TK.d.ticket.status!==r.ticket.status;
  if(sig!==TK.sig||lokaal.length){TK.sig=sig;TK.d={...r,berichten:[...r.berichten,...lokaal]};if(statusAnders)teken();else tkTeken()}}catch(e){if(/niet gevonden/i.test(e.message)){TK.open="";teken()}}}
function ticketsStart(){
  if(!TK.open){ticketsLaad();return}
  if(TK.d)tkTeken(true);tkLaad().then(()=>tkTeken(true));
  clearInterval(TK.timer);TK.timer=setInterval(()=>{if(tab!=="tickets"||!TK.open){clearInterval(TK.timer);return}if(!document.hidden)tkLaad()},6000);
  const t=$("#cht"),f=$("#chf"),fi=$("#chfi"),pv=$("#chp");
  $("[data-tkterug]").onclick=()=>{TK.open="";TK.d=null;TK.sig="";try{history.replaceState(null,"","#tickets")}catch(e){}teken()};
  const groei=()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"};t.oninput=groei;
  t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(hover:none)").matches){e.preventDefault();f.requestSubmit()}};
  fi.onchange=async()=>{const file=fi.files[0];fi.value="";if(!file)return;try{TK.foto=await verklein(file);pv.hidden=false;pv.innerHTML=`<img src="${TK.foto}" alt=""><span>Foto toegevoegd</span><button type="button" class="iconbtn ghost" id="chpx" aria-label="Foto verwijderen">${I.x}</button>`;$("#chpx").onclick=()=>{TK.foto="";pv.hidden=true;pv.innerHTML=""};t.focus()}catch(e){toast("Deze foto kan niet worden geopend")}};
  f.onsubmit=async e=>{e.preventDefault();const tekst=t.value.trim(),foto=TK.foto;if(!tekst&&!foto)return;
    const m={id:"tmp"+Date.now(),van:"klant",tekst,foto,op:new Date().toISOString(),_bezig:true};TK.d.berichten.push(m);t.value="";groei();TK.foto="";pv.hidden=true;pv.innerHTML="";tkTeken(true);
    try{await api("ticket/antwoord",{body:{id:TK.open,tekst,foto}});TK.d.berichten=TK.d.berichten.filter(x=>x!==m);TK.sig="";await tkLaad();tkTeken(true)}
    catch(er){m._bezig=false;m._fout=true;tkTeken(true);toast(er.message)}};
  if(!matchMedia("(hover:none)").matches)setTimeout(()=>t.focus(),100)}
function openTicket(id){tab="tickets";TK.open=id;TK.d=null;TK.sig="";try{history.replaceState(null,"","#ticket-"+id)}catch(e){}teken();scrollTo({top:0})}
function verklein(file){return new Promise((ok,fout)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.82))};img.onerror=fout;img.src=u})}
const TCAT_VVE={technisch:["Technisch (lamp, deur, lift)",I.sleutel],vandalisme:["Vandalisme of schade",I.ster],vuil:["Vuil of grofvuil",I.bericht],kwaliteit:["Kwaliteit schoonmaak",I.ster],planning:["Planning",I.kal],factuur:["Factuur",I.fact],overig:["Overig",I.bericht]};

  <span class="veld" style="margin-bottom:6px">Waar gaat het over?</span><div class="keus">${Object.entries(CAT).filter(([k])=>!["technisch","vandalisme"].includes(k)&&(isVve()||k!=="vuil")).map(([k,[l,ic]],i)=>`<label><input type="radio" name="tc" value="${k}"${(cat||(isVve()?"vuil":"planning"))===k?" checked":""}><span>${ic}${esc(l)}</span></label>`).join("")}</div>
  <label class="veld">Onderwerp<input id="tko" maxlength="120" placeholder="Bijvoorbeeld: strepen op het keukenraam"></label>

  <div class="tk-fr"><label class="btn">${I.camera}Foto toevoegen<input type="file" accept="image/*" id="tkf" hidden></label><span id="tkfp"></span></div>
  <p class="fout" role="alert"></p><div class="acties"><button data-sluit>Annuleren</button><button class="primary" data-go>Ticket versturen</button></div>`,
  (o,sluit)=>{o.querySelector("#tkf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{foto=await verklein(f);o.querySelector("#tkfp").innerHTML=`<img src="${foto}" alt=""><button type="button" class="iconbtn ghost" aria-label="Foto verwijderen">${I.x}</button>`;o.querySelector("#tkfp button").onclick=()=>{foto="";o.querySelector("#tkfp").innerHTML=""}}catch(er){toast("Deze foto kan niet worden geopend")}};
    o.querySelector("[data-go]").onclick=async()=>{const b=o.querySelector("[data-go]"),fo=o.querySelector(".fout"),tekst=o.querySelector("#tkt").value.trim();fo.textContent="";
      if(!tekst&&!foto){fo.textContent="Beschrijf kort waar het om gaat.";o.querySelector("#tkt").focus();return}
      b.disabled=true;try{const r=await api("tickets",{body:{categorie:(o.querySelector("[name=tc]:checked")||{}).value,onderwerp:o.querySelector("#tko").value,tekst,foto}});sluit();toast("Ticket "+r.nummer+" aangemaakt");TK.lijst=null;openTicket(r.id)}catch(er){b.disabled=false;fo.textContent=er.message}}})}
/* nieuwe antwoorden ook zien als u ergens anders in het portaal bent */
setInterval(async()=>{if(!D||(tab==="tickets"&&TK.open)||document.hidden)return;try{const r=await api("tickets");const n=r.tickets.reduce((a,t)=>a+t.ongelezen,0);TK.lijst=r.tickets;if(n!==((D.tickets||{}).ongelezen||0)){D.tickets={open:r.tickets.filter(t=>t.status!=="opgelost").length,ongelezen:n};if(!$(".ov"))teken()}}catch(e){}},45000);

function blad(html,na){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="blad" role="dialog" aria-modal="true"><div class="greep"></div>${html}</div>`;
  const sluit=()=>{o.remove();document.removeEventListener("keydown",k)};const k=e=>{if(e.key==="Escape")sluit()};
  /* alleen sluiten als het klikken óók buiten het blad begon: tekst selecteren dat buiten het blad eindigt, sluit niet */
  let buiten=false;o.addEventListener("pointerdown",e=>{buiten=e.target===o});
  o.addEventListener("click",e=>{if((e.target===o&&buiten)||e.target.closest("[data-sluit]"))sluit();buiten=false});document.addEventListener("keydown",k);document.body.appendChild(o);
  setTimeout(()=>{const f=o.querySelector("input,textarea,select,button.knop");if(f&&!matchMedia("(hover:none)").matches)f.focus()},60);if(na)na(o,sluit);sluit.o=o;return sluit}

function confetti(host,{n=170,kleuren}={}){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const kl=kleuren||["#323b50","#2bb673","#7fd8c0","#0f5c6e","#9fd4ff","#3fd08b","#ffffff","#ff8a7a"];
  const c=document.createElement("canvas");c.className="fc-canvas";host.prepend(c);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const tint=(h,f)=>{const v=parseInt(h.slice(1),16);let r=v>>16,g=v>>8&255,b=v&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return`rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`};
  const P=[],R=Math.random,add=(ox,oy,ang,spr,vel,cnt)=>{for(let i=0;i<cnt;i++){const a=ang+(R()-.5)*spr,v=vel*(.5+R()*.7),col=kl[(R()*kl.length)|0];
    P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:7+R()*6,h:10+R()*10,rot:R()*6.28,vr:(R()-.5)*.25,fl:R()*6.28,vf:.06+R()*.14,wb:R()*6.28,vw:.04+R()*.07,rond:R()<.14,c1:tint(col,1),c2:tint(col,.72),d:.955+R()*.02})}};
  const v0=Math.max(32,Math.min(60,H*.06));
  add(-10,H*.95,-Math.PI*.36,.4,v0,n*.28);add(W+10,H*.95,-Math.PI*.64,.4,v0,n*.28);add(W/2,H*.46,-Math.PI/2,Math.PI*2,14,n*.12);
  /* en een zachte regen van boven, zodat het ook na de knal nog even dwarrelt */
  for(let i=0;i<n*.32;i++){const col=kl[(R()*kl.length)|0];P.push({x:R()*W,y:-20-R()*H*.6,vx:(R()-.5)*1.5,vy:1+R()*2,w:7+R()*6,h:10+R()*10,rot:R()*6.28,vr:(R()-.5)*.2,fl:R()*6.28,vf:.05+R()*.12,wb:R()*6.28,vw:.03+R()*.06,rond:R()<.14,c1:tint(col,1),c2:tint(col,.72),d:.97})}
  let t0=performance.now(),last=t0;
  const stap=nu=>{const dt=Math.min(2.5,(nu-last)/16.7);last=nu;const el=nu-t0;x.clearRect(0,0,W,H);let leeft=0;
    for(const p of P){p.vx*=Math.pow(p.d,dt);p.vy=p.vy*Math.pow(p.d,dt)+.42*dt;const term=1.7+Math.abs(Math.cos(p.fl))*1.5;if(p.vy>term)p.vy=term+(p.vy-term)*.85;
      p.wb+=p.vw*dt;p.x+=(p.vx+Math.sin(p.wb)*1.3)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.fl+=p.vf*dt;
      if(p.y>H+30)continue;leeft++;const sy=Math.cos(p.fl);
      x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.globalAlpha=el>6400?Math.max(0,1-(el-6400)/900):1;x.fillStyle=sy>0?p.c1:p.c2;
      if(p.rond){x.beginPath();x.ellipse(0,0,p.w*.45,p.w*.45*Math.abs(sy)+.4,0,0,6.283);x.fill()}else x.fillRect(-p.w/2,-p.h/2*Math.abs(sy),p.w,p.h*Math.abs(sy)+.5);
      x.restore()}
    if(leeft&&el<7400&&c.isConnected)requestAnimationFrame(stap);else c.remove()};
  requestAnimationFrame(stap)}
