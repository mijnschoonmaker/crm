" fill="#0b4552"/><ellipse cx="34.8" cy="18" rx="2.4" ry="1.6" fill="#0b4552"/><rect x="6" y="3" width="28" height="66" rx="9" fill="url(#lvb)"/><path d="M9 7.5Q20 2.8 31 7.5" stroke="#5fd2e3" stroke-width="1.2" fill="none" opacity=".8"/><rect x="9.5" y="4.2" width="4.5" height="2" rx="1" fill="#fffbe0"/><rect x="26" y="4.2" width="4.5" height="2" rx="1" fill="#fffbe0"/><path d="M9.2 15.5Q20 11.8 30.8 15.5L29.2 25H10.8z" fill="url(#lvg)" stroke="#0b4552" stroke-width=".9"/><path d="M12 16.6Q16 15 19 14.8L18 18.5Q15 18.7 12.6 19.6z" fill="#fff" opacity=".7"/><rect x="9.8" y="27" width="20.4" height="38" rx="4.2" fill="url(#lvr)"/><g stroke="#eef4f6" stroke-linecap="round"><path d="M15 29.5V62.5M25 29.5V62.5" stroke-width="1.7"/><path d="M15 33.5H25M15 38.5H25M15 43.5H25M15 48.5H25M15 53.5H25M15 58.5H25" stroke-width="1.2"/></g><rect x="11" y="66" width="18" height="1.6" rx=".8" fill="#ff6b5e" opacity=".9"/></svg>';
function lvTekst(L){const vn=L.naam||"Uw glazenwasser";
  if(L.voor===0)return{t:L.bezigBij?"U bent de volgende":vn+" is onderweg naar u",s:L.km!=null?(L.km<0.3?"Bijna bij u":"Nog "+String(L.km).replace(".",",")+" km"):"We zijn onderweg"};
  return{t:"Nog "+L.voor+" "+(L.voor===1?"adres":"adressen")+" voor u",s:L.pos?vn+" is in de buurt":"De bus verschijnt op de kaart als u bijna aan de beurt bent"}}
function liveBlok(){const L=D.live;if(!L||L.status!=="onderweg")return"";const T=lvTekst(L);
  return `<section class="lv" id="lvKaart">${L.pos?`<div class="lv-map" id="lvMap"><div class="lv-laad"></div></div>`:`<div class="lv-wacht">${I.huis}<span></span><span></span><span></span>${AUTO}</div>`}
    <div class="lv-info"><span class="lv-car">${AUTO}</span><div class="lv-tx"><small class="lv-st"><i></i>Live</small><b id="lvT">${esc(T.t)}</b><span id="lvS">${esc(T.s)}</span></div>
      <div class="lv-eta"><small>Verwacht</small><b id="lvE">± ${esc(L.eta)}</b></div></div></section>`}
function lvLeaflet(){if(window.L&&window.L.map)return Promise.resolve();if(LVK.laadt)return LVK.laadt;
  LVK.laadt=new Promise((res,rej)=>{const B="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/",c=document.createElement("link");c.rel="stylesheet";c.href=B+"leaflet.css";document.head.appendChild(c);
    const sc=document.createElement("script");sc.src=B+"leaflet.js";sc.onload=()=>{let i=0;const w=()=>window.L&&window.L.map?res():++i>120?rej():setTimeout(w,50);w()};sc.onerror=()=>{LVK.laadt=null;rej()};document.head.appendChild(sc)});return LVK.laadt}
async function lvInit(){clearInterval(LVK.timer);const L=D&&D.live;if(!L||L.status!=="onderweg")return;
  LVK.timer=setInterval(lvPeil,15000);
  const el=document.getElementById("lvMap");if(!el||!L.pos)return;
  try{await lvLeaflet()}catch(e){el.innerHTML=`<p class="lv-fout">Kaart kon niet laden</p>`;return}
  const Lf=window.L;el.innerHTML="";LVK.zelf=false;
  LVK.map=Lf.map(el,{zoomControl:false,attributionControl:false,preferCanvas:true,dragging:true,scrollWheelZoom:false,tap:true}).setView([L.pos.lat,L.pos.lng],14);
  Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(LVK.map);
  /* bronvermelding is verplicht voor de kaart, maar klein: een i-knopje dat openklapt */
  {const ab=document.createElement("button");ab.type="button";ab.className="lv-bron";ab.setAttribute("aria-label","Kaartgegevens");ab.innerHTML="<span>i</span><em>© OpenStreetMap-bijdragers</em>";ab.onclick=e=>{e.stopPropagation();ab.classList.toggle("open")};el.appendChild(ab)}
  LVK.map.on("dragstart zoomstart",e=>{if(e&&e.originalEvent)LVK.zelf=true});
  if(L.huis){LVK.huis=Lf.marker(L.huis,{icon:Lf.divIcon({className:"lv-ic",html:`<span class="lv-huis">${I.huis}</span>`,iconSize:[40,46],iconAnchor:[20,44]}),keyboard:false}).addTo(LVK.map);
    LVK.lijn=Lf.polyline([[L.pos.lat,L.pos.lng],L.huis],{color:"#137a8a",weight:3.5,opacity:.85,dashArray:"1 9",lineCap:"round"}).addTo(LVK.map)}
  LVK.car=Lf.marker([L.pos.lat,L.pos.lng],{icon:Lf.divIcon({className:"lv-ic",html:`<span class="lv-auto"><span class="lv-puls"></span><span class="lv-rot" style="transform:rotate(${L.pos.koers||0}deg)">${BUS}</span></span>`,iconSize:[64,64],iconAnchor:[32,32]}),keyboard:false,zIndexOffset:500}).addTo(LVK.map);
  LVK.naar={lat:L.pos.lat,lng:L.pos.lng};lvFit();setTimeout(()=>{if(LVK.map){LVK.map.invalidateSize();LVK.map.fire("moveend");lvFit()}},300)}
function lvFit(){if(!LVK.map||LVK.zelf)return;const L=D.live,pts=[[LVK.naar.lat,LVK.naar.lng]];if(L.huis)pts.push(L.huis);
  if(pts.length>1)LVK.map.fitBounds(pts,{padding:[50,50],maxZoom:16,animate:true});else LVK.map.panTo(pts[0],{animate:true})}
/* soepel rijden tussen twee meldingen in */
function lvRij(n){if(!LVK.car)return;const v=LVK.car.getLatLng(),van={lat:v.lat,lng:v.lng},t0=performance.now(),dur=2200;cancelAnimationFrame(LVK.anim);
  const st=t=>{const p=Math.min(1,(t-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,ll=[van.lat+(n.lat-van.lat)*e,van.lng+(n.lng-van.lng)*e];LVK.car.setLatLng(ll);if(LVK.lijn&&D.live.huis)LVK.lijn.setLatLngs([ll,D.live.huis]);if(p<1)LVK.anim=requestAnimationFrame(st)};LVK.anim=requestAnimationFrame(st)}
async function lvPeil(){if(document.hidden||tab!=="home")return;let r;try{r=await api("live")}catch(e){return}const L=r.live;
  const was=D.live;D.live=L;
  if(!L||L.status!=="onderweg"||!!L.pos!==!!(was&&was.pos)){teken();return}
  const T=lvTekst(L),q=id=>document.getElementById(id);if(q("lvT"))q("lvT").textContent=T.t;if(q("lvS"))q("lvS").textContent=T.s;if(q("lvE"))q("lvE").textContent="± "+L.eta;
  if(L.pos&&LVK.car){LVK.naar={lat:L.pos.lat,lng:L.pos.lng};lvRij(LVK.naar);const r_=LVK.car.getElement()&&LVK.car.getElement().querySelector(".lv-rot");if(r_&&L.pos.koers!=null)r_.style.transform=`rotate(${L.pos.koers}deg)`;setTimeout(lvFit,2300)}}
