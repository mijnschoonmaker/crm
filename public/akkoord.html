<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex"><title>Offerte ondertekenen</title>
<link rel="icon" href="/ms-logo-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/ms-logo-512.png" type="image/png" sizes="512x512"><link rel="shortcut icon" href="/favicon.ico?v=4"><link rel="apple-touch-icon" href="/ms-logo-180.png">
<style>
:root{--ink:#14181f;--muted:#6b7280;--line:#e3e5e8;--bg:#f5f5f4;--brand:#252c3c;--ok:#3f7a57;--f:"Avenir Next","Avenir","Nunito Sans","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 22px;margin-bottom:14px}
.hero{background:repeating-linear-gradient(115deg,rgb(255 255 255 / .018) 0 1px,transparent 1px 26px),radial-gradient(120% 140% at 100% 0%,#4a5670 0%,transparent 55%),linear-gradient(135deg,#1a1f2c 0%,#2a3245 55%,#1d2332 100%);color:#fff;border:0;box-shadow:0 24px 50px -30px rgb(20 24 34 / .75)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.top img{max-height:48px;max-width:150px;background:#fff;border-radius:50%;padding:2px}.top b{font-size:17px;font-weight:600}
.kick{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgb(255 255 255 / .7)}
.card:not(.hero) .kick{color:var(--muted)}
h1{font-size:28px;font-weight:400;letter-spacing:-.015em;margin:6px 0 4px}.sub{color:var(--muted);margin:0 0 18px;line-height:1.5}.hero .sub{color:rgb(255 255 255 / .72)}
.bedrag{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.bedrag span{background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .16);border-radius:12px;padding:10px 14px;font-size:13px;color:rgb(255 255 255 / .8)}.bedrag b{display:block;font-size:20px;font-weight:500;color:#fff;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14.5px}th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:0 0 10px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}td{padding:12px 0 4px;vertical-align:top}tr.g td{font-weight:600}tr.s td{padding:3px 0 3px 14px;color:var(--muted);font-size:13.5px}
tr.tot td{border-top:1px solid var(--line);padding-top:14px;font-weight:600;font-size:16px}
.k{font-size:14px;line-height:1.55;margin-bottom:18px;color:var(--muted)}.k b{display:block;color:var(--ink);font-weight:600}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;color:var(--ink)}input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgb(37 44 60 / .12)}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:18px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.padkop{display:flex;align-items:flex-end;justify-content:space-between}
.pad{position:relative;border:1.5px dashed #c3c8d1;border-radius:16px;background:#fbfbfa;height:230px;touch-action:none;transition:border-color .2s,background .2s}.pad.ok{border-style:solid;border-color:#252c3c;background:#fff}
.pad canvas{width:100%;height:100%;display:block;border-radius:16px;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9aa1ad;font-size:14px;pointer-events:none}.pad .hint svg{width:34px;height:34px;opacity:.6;animation:zw 2.4s ease-in-out infinite}
@keyframes zw{0%,100%{transform:translateX(-8px) rotate(-8deg)}50%{transform:translateX(8px) rotate(6deg)}}
.pad .line{position:absolute;left:26px;right:26px;bottom:46px;border-bottom:1px solid #d5d9e0;pointer-events:none}.pad .x{position:absolute;left:26px;bottom:52px;color:#b8bec8;font-size:16px;pointer-events:none}
.wis{all:unset;cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);padding:4px 0 7px}
.chk{display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.45;margin:18px 0 6px;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}.chk input{width:22px;height:22px;margin:0;accent-color:#252c3c;flex:none}
.chk a{color:var(--brand);font-weight:600}
.balk{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgb(245 245 244 / .92);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
.balk .in{max-width:680px;margin:0 auto}
.go{width:100%;font:inherit;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:17px;border:0;border-radius:14px;color:#fff;background:radial-gradient(130% 180% at 100% 0%,#4a5670 0%,transparent 60%),linear-gradient(135deg,#1b2130,#2a3245 60%,#1d2332);box-shadow:0 12px 26px -16px rgb(20 24 34 / .8);cursor:pointer}.go:disabled{opacity:.55;cursor:default}
.msg{margin-top:8px;font-size:13.5px;font-weight:600;color:#a4544a;min-height:18px;text-align:center}
.done{text-align:center;padding:44px 26px}.done .ic{width:72px;height:72px;border-radius:50%;background:#e8f2ec;color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:32px}.done .sig{max-width:240px;margin:18px auto 0;opacity:.85}
.foot{text-align:center;color:#9aa1ad;font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap" id="app"><div class="card"><p class="sub">Offerte laden…</p></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>"€ "+(Math.round((+n||0)*100)/100).toFixed(2).replace(".",",");
const tok=location.pathname.split("/").filter(Boolean).pop();
const klaar=(d,naam)=>{$("#app").innerHTML=`<div class="card done"><div class="ic">✓</div><span class="kick">Ondertekend</span><h1>Bedankt${naam?", "+esc(naam):""}!</h1><p class="sub" style="margin:8px 0 0">Uw akkoord is ontvangen. U ontvangt het definitieve bestellingsoverzicht per e-mail.<br>Wij nemen contact met u op om uw eerste bezoek in te plannen.</p></div><p class="foot">${esc(d.bedrijf.naam)}${d.bedrijf.telefoon?" · "+esc(d.bedrijf.telefoon):""}</p>`};
const VB=tok==="voorbeeld";/* voorbeeldpagina voor testmails: niets wordt opgeslagen */
(async()=>{let d;try{if(VB){const t=new Date(Date.now()+14*864e5).toISOString().slice(0,10);d={status:"open",nummer:"VOORBEELD",geldigTot:t,bedrijf:{naam:"Voorbeeld Glazenwasserij",logo:"/logo.png"},klant:{naam:"Fam. de Vries",contact:"Anna de Vries",adres:"Lindenlaan 12",pcPlaats:"9801 AB Zuidhorn"},groepen:[{omschrijving:"Glasbewassing buiten",incl:65,subs:[{naam:"Ramen",aantal:"14",freq:"elke 8 weken"}]},{omschrijving:"Dakkapel + kozijnen",incl:15,subs:[]}]}}else{const r=await fetch("/api/akkoord-info?t="+encodeURIComponent(tok));if(!r.ok)throw 0;d=await r.json()}}catch(e){$("#app").innerHTML='<div class="card"><h1>Offerte niet gevonden</h1><p class="sub">Deze link is niet (meer) geldig. Neem contact met ons op.</p></div>';return}
  if(d.status==="getekend"||d.getekend){klaar(d,"");return}
  let tot=0;const rows=(d.groepen||[]).map(g=>{tot+=+g.incl||0;return `<tr class="g"><td>${esc(g.omschrijving)}</td><td class="r">${eur(g.incl)}</td></tr>`+(g.subs||[]).map(s=>`<tr class="s"><td colspan="2">${esc(s.naam)}${s.aantal?" · "+esc(s.aantal):""}${s.freq?" · "+esc(s.freq):""}</td></tr>`).join("")}).join("");
  const k=d.klant||{};
  const pen='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3-1 5-4 7-7 1.6-2.4 3.4-5 5.5-6.6a2.1 2.1 0 1 1 2.8 3.1C16.6 12.6 14 14.4 11.6 16 8.6 18 6 20 3 21z"/><path d="M14 8l2 2"/></svg>';
  $("#app").innerHTML=`<div class="card hero"><div class="top">${d.bedrijf.logo?`<img src="${esc(d.bedrijf.logo)}" alt="${esc(d.bedrijf.naam)}">`:`<b>${esc(d.bedrijf.naam)}</b>`}<span class="kick">Offerte ${esc(d.nummer)}</span></div>
    <span class="kick">Uw offerte</span><h1>${esc(k.naam||"Uw offerte")}</h1><p class="sub" style="margin:0">${esc(k.adres||"")}${k.pcPlaats?", "+esc(k.pcPlaats):""}</p>
    <div class="bedrag"><span>Per keer incl. btw<b>${eur(tot)}</b></span>${d.geldigTot?`<span>Geldig tot<b>${esc(d.geldigTot.split("-").reverse().join("-"))}</b></span>`:""}</div></div>
  <div class="card"><span class="kick">Wat we voor u doen</span><table style="margin-top:12px"><tr><th>Omschrijving</th><th class="r">Per keer</th></tr>${rows}${(d.groepen||[]).length>1?`<tr class="tot"><td>Totaal per keer</td><td class="r">${eur(tot)}</td></tr>`:""}</table></div>
  <div class="card"><span class="kick">Akkoord geven</span><h1 style="font-size:22px">Teken met uw vinger</h1><p class="sub">Zet uw handtekening in het vak. Dat is alles: daarna plannen wij u in.</p>
    <div class="g2"><div><label for="nm">Uw naam</label><input type="text" id="nm" autocomplete="name" value="${esc(k.contact||k.naam||"")}"></div><div><label for="pl">Plaats</label><input type="text" id="pl" autocomplete="address-level2" value="${esc((k.pcPlaats||"").replace(/^\d{4}\s?[a-z]{2}\s*/i,""))}"></div></div>
    <div class="padkop"><label>Handtekening</label><button class="wis" id="wis" type="button">Opnieuw</button></div><div class="pad" id="pad"><canvas id="cv"></canvas><span class="x">✕</span><span class="line"></span><span class="hint" id="hint">${pen}Teken hier met uw vinger</span></div>
    <label class="chk"><input type="checkbox" id="ok"><span>Ik ga akkoord met deze offerte${d.voorwaarden?` en de <a href="${esc(d.voorwaarden)}" target="_blank" rel="noopener">algemene voorwaarden</a>`:" en de algemene voorwaarden"}.</span></label></div>
  <p class="foot">${esc(d.bedrijf.naam)}${d.bedrijf.telefoon?" · "+esc(d.bedrijf.telefoon):""}${d.bedrijf.email?" · "+esc(d.bedrijf.email):""}</p>
  <div class="balk"><div class="in"><button class="go" id="go" type="button">Akkoord en ondertekenen</button><div class="msg" id="msg"></div></div></div>`;
  const cv=$("#cv"),ctx=cv.getContext("2d");let leeg=true,teken=false,lx=0,ly=0;
  const maat=()=>{const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;cv.width=r.width*dp;cv.height=r.height*dp;ctx.setTransform(dp,0,0,dp,0,0);ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";leeg=true;$("#hint").style.display=""};maat();addEventListener("resize",()=>{if(leeg)maat()});
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{teken=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e);ctx.beginPath();ctx.arc(lx,ly,1.1,0,7);ctx.fillStyle="#111";ctx.fill();leeg=false;$("#hint").style.display="none";$("#pad").classList.add("ok")});
  cv.addEventListener("pointermove",e=>{if(!teken)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,()=>teken=false));
  $("#wis").onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);maat();$("#pad").classList.remove("ok")};
  $("#go").onclick=async()=>{const b=$("#go"),m=$("#msg"),naam=$("#nm").value.trim(),plaats=$("#pl").value.trim();m.textContent="";
    if(b.disabled)return;if(naam.length<2)return m.textContent="Vul uw naam in.";if(leeg)return m.textContent="Zet uw handtekening in het vak.";if(!$("#ok").checked)return m.textContent="Vink aan dat u akkoord gaat.";
    b.disabled=true;b.textContent="Bezig met versturen…";
    /* bijsnijden en verkleinen */
    const o=document.createElement("canvas"),s=Math.min(1,600/cv.width);o.width=cv.width*s;o.height=cv.height*s;o.getContext("2d").drawImage(cv,0,0,o.width,o.height);
    if(VB){setTimeout(()=>klaar(d,naam.split(/\s+/)[0]),600);return}
    try{const r=await fetch("/api/akkoord",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({t:tok,naam,plaats,png:o.toDataURL("image/png")})});const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.fout||"Er ging iets mis.");klaar(d,naam.split(/\s+/)[0])}
    catch(e){m.textContent=e.message||"Er ging iets mis. Probeer het opnieuw.";b.disabled=false;b.textContent="Akkoord en ondertekenen"}};
})();
</script></body></html>
