<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex"><title>Offerte ondertekenen</title>
<link rel="icon" href="/ms-logo-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/ms-logo-512.png" type="image/png" sizes="512x512"><link rel="shortcut icon" href="/favicon.ico?v=4"><link rel="apple-touch-icon" href="/ms-logo-180.png">
<style>
:root{--ink:#14181f;--muted:#6b7280;--line:#e3e5e8;--bg:#f5f5f4;--brand:#252c3c;--ok:#3f7a57;--f:"Avenir Next","Avenir","Nunito Sans","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 22px;margin-bottom:14px}
.hero{background:repeating-linear-gradient(115deg,rgb(255 255 255 / .018) 0 1px,transparent 1px 26px),radial-gradient(120% 140% at 100% 0%,#4a5670 0%,transparent 55%),linear-gradient(135deg,#1a1f2c 0%,#2a3245 55%,#1d2332 100%);color:#fff;border:0;box-shadow:0 24px 50px -30px rgb(20 24 34 / .75)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.top img{max-height:48px;max-width:150px;background:#fff;border-radius:50%;padding:2px}.top b{font-size:17px;font-weight:600}
.kick{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgb(255 255 255 / .7)}
.card:not(.hero) .kick{color:var(--muted)}
h1{font-size:28px;font-weight:400;letter-spacing:-.015em;margin:6px 0 4px}.sub{color:var(--muted);margin:0 0 18px;line-height:1.5}.hero .sub{color:rgb(255 255 255 / .72)}
.bedrag{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.bedrag span{background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .16);border-radius:12px;padding:10px 14px;font-size:13px;color:rgb(255 255 255 / .8)}.bedrag b{display:block;font-size:20px;font-weight:500;color:#fff;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14.5px}th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:0 0 10px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}td{padding:12px 0 4px;vertical-align:top}tr.g td{font-weight:600}tr.s td{padding:3px 0 3px 14px;color:var(--muted);font-size:13.5px}
tr.tot td{border-top:1px solid var(--line);padding-top:14px;font-weight:600;font-size:16px}
.k{font-size:14px;line-height:1.55;margin-bottom:18px;color:var(--muted)}.k b{display:block;color:var(--ink);font-weight:600}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;color:var(--ink)}input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgb(37 44 60 / .12)}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:18px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.padkop{display:flex;align-items:flex-end;justify-content:space-between}
.pad{position:relative;border:1.5px dashed #c3c8d1;border-radius:16px;background:#fbfbfa;height:230px;touch-action:none;transition:border-color .2s,background .2s}.pad.ok{border-style:solid;border-color:#252c3c;background:#fff}
.pad canvas{width:100%;height:100%;display:block;border-radius:16px;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9aa1ad;font-size:14px;pointer-events:none}.pad .hint svg{width:34px;height:34px;opacity:.6;animation:zw 2.4s ease-in-out infinite}
@keyframes zw{0%,100%{transform:translateX(-8px) rotate(-8deg)}50%{transform:translateX(8px) rotate(6deg)}}
.pad .line{position:absolute;left:26px;right:26px;bottom:46px;border-bottom:1px solid #d5d9e0;pointer-events:none}.pad .x{position:absolute;left:26px;bottom:52px;color:#b8bec8;font-size:16px;pointer-events:none}
.wis{all:unset;cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);padding:4px 0 7px}
.chk{display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.45;margin:18px 0 6px;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}.chk input{width:22px;height:22px;margin:0;accent-color:#252c3c;flex:none}
.chk a{color:var(--brand);font-weight:600}
.balk{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgb(245 245 244 / .92);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
.balk .in{max-width:680px;margin:0 auto}
.go{width:100%;font:inherit;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:17px;border:0;border-radius:14px;color:#fff;background:radial-gradient(130% 180% at 100% 0%,#4a5670 0%,transparent 60%),linear-gradient(135deg,#1b2130,#2a3245 60%,#1d2332);box-shadow:0 12px 26px -16px rgb(20 24 34 / .8);cursor:pointer}.go:disabled{opacity:.55;cursor:default}
.msg{margin-top:8px;font-size:13.5px;font-weight:600;color:#a4544a;min-height:18px;text-align:center}
.done{text-align:center;padding:44px 26px}.done .ic{width:72px;height:72px;border-radius:50%;background:#e8f2ec;color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:32px}.done .sig{max-width:240px;margin:18px auto 0;opacity:.85}
.dn-kop{display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dn{padding:16px 0;border-bottom:1px solid var(--line)}
.dn-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.dn-t{display:flex;flex-direction:column;gap:6px;min-width:0}.dn-t b{font-size:16px;font-weight:500;letter-spacing:-.005em;line-height:1.3}
.fq{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:#3e4a64;background:#f0f1f4;border-radius:999px;padding:4px 10px}
.fq::before{content:"";width:6px;height:6px;border-radius:50%;background:#c9a46a}
.dn-p{font-size:16px;font-weight:500;white-space:nowrap}
.dn-s{list-style:none;margin:10px 0 0;padding:0 0 0 12px;border-left:2px solid #eceef1;display:flex;flex-direction:column;gap:5px}
.dn-s li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted)}.dn-s em{font-style:normal;white-space:nowrap}
.dn-tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px}.dn-tot span{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.dn-tot b{font-size:22px;font-weight:500}
.card:not(.hero) h1{font-weight:400}
.sub{font-size:15px}
input[type=text]{font-weight:500}
.ak-kop{margin-bottom:18px}.ak-kop h2{font-size:22px;font-weight:400;letter-spacing:-.01em;margin:6px 0 4px}.ak-kop p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.ak-velden{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;background:#fff}
.ak-r{display:flex!important;align-items:center;gap:12px;margin:0!important;padding:0 14px;letter-spacing:0!important;text-transform:none!important}
.ak-r+.ak-r{border-top:1px solid var(--line)}
.ak-r span{flex:none;width:64px;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ak-r input[type=text]{border:0!important;box-shadow:none!important;padding:15px 0;background:transparent;font-size:16px}
.ak-velden:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgb(37 44 60 / .1)}
.chk{font-size:min(13.5px,2.9vw)!important;padding:13px 10px!important;gap:9px!important}.chk span{white-space:nowrap}
@media(max-width:340px){.chk span{white-space:normal}}
.ak-velden{border:0!important;border-radius:0!important;box-shadow:none!important;margin:0 0 22px!important}
.ak-r{padding:0!important;border-bottom:1px solid var(--line)}.ak-r+.ak-r{border-top:0!important}
.ak-r span{width:auto!important;flex:1!important;font-size:16px!important;font-weight:500!important;letter-spacing:-.005em!important;text-transform:none!important;color:var(--ink)!important}
.ak-r input[type=text]{flex:1.4;text-align:right;padding:18px 0!important;font-size:16px!important;font-weight:400!important;color:var(--muted)}
.ak-r input[type=text]:focus{color:var(--ink)}
.ak-velden:focus-within{box-shadow:none!important}
.ak-r:focus-within{border-bottom-color:var(--brand)}
.padkop{padding-bottom:10px}
.tko{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;margin-bottom:14px;box-shadow:0 22px 44px -30px rgb(20 24 34 / .55);overflow:hidden}
.tko-band{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#fff;padding:9px;background:linear-gradient(90deg,#1b2130,#3e4a64,#1b2130)}
.tko-kop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 20px 22px;color:#fff;background:repeating-linear-gradient(115deg,rgb(255 255 255 / .018) 0 1px,transparent 1px 26px),radial-gradient(120% 140% at 100% 0%,#4a5670 0%,transparent 55%),linear-gradient(135deg,#1a1f2c 0%,#2a3245 55%,#1d2332 100%)}
.tko-kop small{display:block;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgb(255 255 255 / .65)}
.tko-kop b{display:block;font-size:26px;font-weight:500;letter-spacing:-.01em;margin:3px 0 2px;white-space:nowrap}
.tko-kop em{display:block;font-style:normal;font-size:12.5px;color:rgb(255 255 255 / .65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tko-kop .r{text-align:right}
.tko-mid img{width:52px;height:52px;border-radius:50%;background:#fff;padding:2px;display:block;box-shadow:0 0 0 4px rgb(255 255 255 / .08)}
.tko-perf{position:relative;height:0;border-top:2px dashed #e3e5e8;margin:0 18px}
.tko-perf::before,.tko-perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tko-perf::before{left:-31px}.tko-perf::after{right:-31px}
.tko-body{padding:18px 20px 20px}
.tko-adr{display:flex;align-items:center;gap:14px}
.tko-adr .av{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--ink);background:#fff}
.tko-adr b{display:block;font-size:19px;font-weight:500;letter-spacing:-.01em}.tko-adr small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.tko-feit{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:12px 14px;border-radius:12px;background:#f3f4f6;font-size:14px}.tko-feit span{color:var(--muted)}.tko-feit b{font-weight:600}
@media(max-width:380px){.tko-kop b{font-size:22px}.tko-mid img{width:44px;height:44px}}
.tko-kop{grid-template-columns:1fr auto!important;padding:20px 22px 24px!important}
.tko-merk{display:flex;align-items:center;gap:14px;min-width:0}.tko-merk img{width:56px;height:56px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 4px rgb(255 255 255 / .08);flex:none}
.tko-merk span{font-size:15px;font-weight:500;color:rgb(255 255 255 / .85);line-height:1.3}
.tko-feiten{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tko-feiten>div{padding:12px 14px;border-radius:12px;background:#f3f4f6;display:flex;flex-direction:column;gap:3px;min-width:0}
.tko-feiten span{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.tko-feiten b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tko-kop.tko-c{display:flex!important;justify-content:center;align-items:center;padding:22px!important}
.tko-c img{width:64px;height:64px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 5px rgb(255 255 255 / .08)}
.tko-c b{font-size:20px;font-weight:500}
.tko-feiten{grid-template-columns:repeat(3,minmax(0,1fr))!important}
@media(max-width:480px){.tko-feiten{grid-template-columns:1.2fr 1.2fr .8fr!important;gap:8px!important}.tko-feiten>div{padding:10px 9px!important}.tko-feiten b{font-size:13.5px!important;text-overflow:clip!important}.tko-feiten span{font-size:9px!important;letter-spacing:.1em!important}}
.tko.gat .tko-perf::before,.tko.gat .tko-perf::after{display:none}
html,body{background:#f5f5f4!important}
.dn-p{text-align:right}.dn-p small{display:block;font-size:10.5px;font-weight:500;color:#9aa1ad;margin-top:3px;letter-spacing:.04em}
.tko-scheur{margin-top:2px}
.tko-stub .kick{color:var(--muted)}
.tko-stub{padding-top:20px!important}.tko-stub .dn:last-child{border-bottom:0;padding-bottom:4px}
.door{display:flex;flex-direction:column;align-items:center;gap:7px;margin:24px 0 10px;opacity:.6}.door small{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.door img{height:11px;background:transparent;width:auto;display:block;filter:brightness(0)}
.balk .in{max-width:648px!important}
.foot{text-align:center;color:#9aa1ad;font-size:12.5px;margin-top:10px}
</style></head><body><div class="wrap" id="app"><div class="card"><p class="sub">Offerte laden…</p></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>"€ "+(Math.round((+n||0)*100)/100).toFixed(2).replace(".",",");
const tok=location.pathname.split("/").filter(Boolean).pop();
const klaar=(d,naam)=>{$("#app").innerHTML=`<div class="card done"><div class="ic">✓</div><span class="kick">Ondertekend</span><h1>Bedankt${naam?", "+esc(naam):""}!</h1><p class="sub" style="margin:8px 0 0">Uw akkoord is ontvangen. U ontvangt het definitieve bestellingsoverzicht per e-mail.<br>Wij nemen contact met u op om uw eerste bezoek in te plannen.</p></div><p class="foot">${esc(d.bedrijf.naam)}${d.bedrijf.telefoon?" · "+esc(d.bedrijf.telefoon):""}</p>`};
const VB=tok==="voorbeeld";/* voorbeeldpagina voor testmails: niets wordt opgeslagen */
(async()=>{let d;try{if(VB){const t=new Date(Date.now()+14*864e5).toISOString().slice(0,10);d={status:"open",nummer:"VOORBEELD",geldigTot:t,bedrijf:{naam:"Voorbeeld Glazenwasserij",logo:"/logo.png"},klant:{naam:"Fam. de Vries",contact:"Anna de Vries",adres:"Lindenlaan 12",pcPlaats:"9801 AB Zuidhorn"},groepen:[{omschrijving:"Glasbewassing buiten",incl:65,freq:"elke 8 weken",subs:[{naam:"Ramen begane grond",aantal:"9 st"},{naam:"Ramen 1e verdieping",aantal:"5 st"}]},{omschrijving:"Reiniging dakkapel",incl:15,freq:"1x per jaar",subs:[]}]}}else{const r=await fetch("/api/akkoord-info?t="+encodeURIComponent(tok));if(!r.ok)throw 0;d=await r.json()}}catch(e){$("#app").innerHTML='<div class="card"><h1>Offerte niet gevonden</h1><p class="sub">Deze link is niet (meer) geldig. Neem contact met ons op.</p></div>';return}
  if(d.status==="getekend"||d.getekend){klaar(d,"");return}
  const hfd=t=>{t=String(t||"");return t?t.charAt(0).toUpperCase()+t.slice(1):""};
  let tot=0;const rows=(d.groepen||[]).map(g=>{tot+=+g.incl||0;const subs=(g.subs||[]).filter(s=>s.naam);
    return `<div class="dn"><div class="dn-h"><div class="dn-t"><b>${esc(g.omschrijving)}</b>${g.freq?`<span class="fq">${esc(hfd(g.freq))}</span>`:""}</div><span class="dn-p">${eur(g.incl)}<small>incl. btw</small></span></div>
      ${subs.length?`<ul class="dn-s">${subs.map(s=>`<li><span>${esc(s.naam)}</span><em>${[s.aantal,s.freq].filter(Boolean).map(esc).join(" · ")}</em></li>`).join("")}</ul>`:""}</div>`}).join("");
  const k=d.klant||{};
  /* verschillende frequenties: geen totaal per keer, want niet alles gebeurt elke keer */
  const gemengd=new Set((d.groepen||[]).map(g=>String(g.freq||"").toLowerCase().trim())).size>1;
  const pen='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3-1 5-4 7-7 1.6-2.4 3.4-5 5.5-6.6a2.1 2.1 0 1 1 2.8 3.1C16.6 12.6 14 14.4 11.6 16 8.6 18 6 20 3 21z"/><path d="M14 8l2 2"/></svg>';
  const gt=d.geldigTot?d.geldigTot.split("-").reverse().join("-"):"",ini=String(k.naam||"").replace(/^(fam\.?|familie|dhr\.?|mevr\.?)\s+/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
  $("#app").innerHTML=`<div class="tko"><div class="tko-band">Uw offerte</div>
    <div class="tko-kop tko-c">${d.bedrijf.logo?`<img src="${esc(d.bedrijf.logo)}" alt="${esc(d.bedrijf.naam||"")}">`:`<b>${esc(d.bedrijf.naam||"")}</b>`}</div>
    
    <div class="tko-body"><div class="tko-adr"><span class="av">${esc(ini||"•")}</span><span><b>${esc(k.naam||"")}</b><small>${esc(k.adres||"")}${k.pcPlaats?", "+esc(k.pcPlaats):""}</small></span></div>
      <div class="tko-feiten"><div><span>Offerte</span><b>${esc(String(d.nummer||"").replace(/^OFF-/,""))}</b></div>${gt?`<div><span>Geldig tot</span><b>${esc(gt)}</b></div>`:""}${gemengd?`<div><span>Diensten</span><b>${(d.groepen||[]).length}</b></div>`:`<div><span>Per keer incl. btw</span><b>${eur(tot)}</b></div>`}</div></div><div class="tko-perf tko-scheur" aria-hidden="true"></div><div class="tko-body tko-stub"><div class="dn-kop"><span class="kick">Wat we voor u doen</span><span class="kick">Per keer</span></div>${rows}${(d.groepen||[]).length>1&&!gemengd?`<div class="dn-tot"><span>Totaal per keer incl. btw</span><b>${eur(tot)}</b></div>`:""}</div></div>
  <div class="card"><div class="dn-kop"><span class="kick">Akkoord geven</span><span class="kick">Uw gegevens</span></div>
    <div class="ak-velden"><label class="ak-r" for="nm"><span>Naam</span><input type="text" id="nm" autocomplete="name" value="${esc(k.contact||k.naam||"")}"></label><label class="ak-r" for="pl"><span>Plaats</span><input type="text" id="pl" autocomplete="address-level2" value="${esc((k.pcPlaats||"").replace(/^\d{4}\s?[a-z]{2}\s*/i,""))}"></label></div>
    <div class="padkop"><label>Handtekening</label><button class="wis" id="wis" type="button">Opnieuw</button></div><div class="pad" id="pad"><canvas id="cv"></canvas><span class="x">✕</span><span class="line"></span><span class="hint" id="hint">${pen}Teken hier met uw vinger</span></div>
    <label class="chk"><input type="checkbox" id="ok"><span>Ik ga akkoord met de offerte en de ${d.voorwaarden?`<a href="${esc(d.voorwaarden)}" target="_blank" rel="noopener">voorwaarden</a>`:"voorwaarden"}.</span></label></div>
  <div class="door"><small>Deze service wordt mogelijk gemaakt door</small><img src="/mansard-logo.png" alt="Mansard"></div>
  <div class="balk"><div class="in"><button class="go" id="go" type="button">Akkoord en ondertekenen</button><div class="msg" id="msg"></div></div></div>`;
  const cv=$("#cv"),ctx=cv.getContext("2d");let leeg=true,teken=false,lx=0,ly=0;
  const maat=()=>{const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;cv.width=r.width*dp;cv.height=r.height*dp;ctx.setTransform(dp,0,0,dp,0,0);ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";leeg=true;$("#hint").style.display=""};maat();addEventListener("resize",()=>{if(leeg)maat()});
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{teken=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e);ctx.beginPath();ctx.arc(lx,ly,1.1,0,7);ctx.fillStyle="#111";ctx.fill();leeg=false;$("#hint").style.display="none";$("#pad").classList.add("ok")});
  cv.addEventListener("pointermove",e=>{if(!teken)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,()=>teken=false));

/* echte ronde gaten bij de perforatie (masker), zodat de achtergrond er precies doorheen komt */
function gaten(){const c=document.querySelector(".tko"),ps=c?[...c.querySelectorAll(".tko-perf")]:[];if(!ps.length)return;const w=c.offsetWidth,h=c.offsetHeight,r=13;
  const ci=(x,y)=>`M${x-r},${y}a${r},${r} 0 1,0 ${2*r},0a${r},${r} 0 1,0 ${-2*r},0Z`,cr=c.getBoundingClientRect(),d=ps.map(p=>{const y=p.getBoundingClientRect().top-cr.top+1;return ci(0,y)+ci(w,y)}).join(""),svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><path fill="#000" fill-rule="evenodd" d="M0,0H${w}V${h}H0Z${d}"/></svg>`,u=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  c.style.webkitMaskImage=c.style.maskImage=u;c.style.webkitMaskSize=c.style.maskSize="100% 100%";c.classList.add("gat")}
addEventListener("resize",()=>setTimeout(gaten,50));setTimeout(gaten,60);setTimeout(gaten,600);new MutationObserver(()=>setTimeout(gaten,30)).observe(document.getElementById("app"),{childList:true});
