<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Schoonmaak van uw gebouw</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#137a8a;--brand-2:#1d5a74;--ink:#0f1f26;--muted:#5d6f76;--line:#dde5e8;--bg:#f3f6f7;--surface:#fff;--ok:#23845a}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.kop{position:relative;overflow:hidden;color:#fff;border-radius:22px;padding:18px 20px 20px;background:linear-gradient(135deg,#0f5f6e,#137a8a 55%,#1d5a74)}
.kop::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 18px);pointer-events:none}
.kop>*{position:relative}.kop .lg{display:flex;align-items:center;gap:10px;margin-bottom:14px}.kop .lg img{height:34px;border-radius:8px;background:#fff;padding:3px}.kop .lg b{font-size:15px}
.kop small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}.kop h1{margin:2px 0 0;font-size:24px;letter-spacing:-.02em;line-height:1.15}.kop p{margin:4px 0 0;opacity:.85;font-size:14px}
.st{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 12px 6px 10px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-weight:700;font-size:13px}.st i{width:9px;height:9px;border-radius:50%;background:#fff}.st.live i{background:#5ef0b0;animation:p 2s infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(94,240,176,.6)}100%{box-shadow:0 0 0 10px rgba(94,240,176,0)}}
.kaart{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:12px;box-shadow:0 1px 2px rgba(15,31,38,.04)}
.kaart h2{margin:0 0 2px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.kaart .groot{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}.kaart .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.taken{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.taken span{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:#e6f3ec;color:#1b6b48}.taken span.niet{background:#eef2f3;color:var(--muted);text-decoration:line-through}.taken svg{width:13px;height:13px}
.fotos{display:flex;gap:8px;margin-top:12px}.fotos img{width:calc(50% - 4px);aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.not{margin:10px 0 0;font-size:14px;color:var(--ink);background:#fff7e6;border-radius:12px;padding:10px 12px}
.rij{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.rij:first-of-type{border-top:0}.rij b{font-weight:700}.rij small{color:var(--muted);display:block;font-size:12px}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.contact a{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.voet{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.leeg{color:var(--muted);text-align:center;padding:40px 10px}
/* print: A5 bordje met QR */
.poster{display:none}
@media print{body{background:#fff}.wrap,.voet{display:none}.poster{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100vh;padding:24px;gap:14px}.poster .lg img{height:48px}.poster h1{margin:0;font-size:26px;letter-spacing:-.02em}.poster p{margin:0;color:#333;font-size:15px;max-width:380px}.poster .qr{width:220px;height:220px}.poster .qr svg{width:100%;height:100%}.poster .url{font-size:12px;color:#666;word-break:break-all}.poster .naam{font-weight:800;font-size:18px;margin-top:4px}}
body.print .poster{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:24px;gap:14px;background:#fff}body.print .wrap{display:none}body.print .poster .qr{width:220px;height:220px}body.print .poster .qr svg{width:100%;height:100%}body.print .poster h1{margin:0;font-size:26px}body.print .poster p{margin:0;color:#333;max-width:380px}body.print .poster .lg img{height:48px}body.print .poster .url{font-size:12px;color:#666;word-break:break-all}body.print .poster .naam{font-weight:800;font-size:18px}

.live-k{background:#fff;border-radius:22px;padding:16px 18px 18px;margin:0 0 14px;box-shadow:0 1px 2px rgb(15 31 38 / .05),0 18px 40px -26px rgb(15 50 60 / .5);border:1px solid color-mix(in srgb,#137a8a 22%,#dde5e8)}
.lk-top{display:flex;justify-content:space-between;align-items:center}.lk-st{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#178a5e}
.lk-st i{width:9px;height:9px;border-radius:50%;background:#22a46c;animation:lkp 1.8s ease-out infinite}@keyframes lkp{0%{box-shadow:0 0 0 0 rgb(34 164 108 / .5)}80%,100%{box-shadow:0 0 0 9px rgb(34 164 108 / 0)}}
.lk-dag{font-size:12px;font-weight:700;color:#5d6f76}
.lk-weg{position:relative;height:58px;margin:14px 6px 6px}.lk-lijn{position:absolute;left:0;right:22px;top:38px;height:6px;border-radius:3px;background:#e3ecef}
.lk-af{position:absolute;left:0;top:38px;height:6px;border-radius:3px;background:linear-gradient(90deg,#9fdbe4,#137a8a);transition:width 1.2s ease}
.lk-bus{position:absolute;top:8px;width:52px;margin-left:-26px;transition:left 1.2s ease;filter:drop-shadow(0 5px 6px rgb(8 40 48 / .3));animation:lkb 1.4s ease-in-out infinite alternate}.lk-bus svg{width:100%;display:block}
@keyframes lkb{to{transform:translateY(-2px)}}
.lk-huis{position:absolute;right:0;top:22px;width:36px;height:36px;border-radius:12px;background:#137a8a;color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgb(15 95 110 / .8)}.lk-huis svg{width:19px;height:19px}
.lk-info{display:flex;align-items:center;gap:12px;margin-top:4px}.lk-info>div:first-child{flex:1;min-width:0}.lk-info b{display:block;font-size:17px;letter-spacing:-.01em}.lk-info small{font-size:13.5px;color:#5d6f76}
.lk-eta{text-align:right;padding-left:12px;border-left:1px solid #e3ecef}.lk-eta small{display:block;font-size:11.5px;font-weight:600}.lk-eta b{font-size:22px;color:#137a8a;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.lk-bus,.lk-st i{animation:none}}
</style></head><body>
<div class="wrap" id="app"><p class="leeg">Even geduld…</p></div>
<div class="poster" id="poster"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const MND=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"],DG=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const p=s=>new Date(s+"T12:00:00"),lang=s=>{const d=p(s);return DG[d.getDay()]+" "+d.getDate()+" "+MND[d.getMonth()]},hoofd=t=>t.charAt(0).toUpperCase()+t.slice(1);
const t=(location.pathname.match(/\/bord\/([a-f0-9]{24,64})/)||[])[1]||new URLSearchParams(location.search).get("t")||"";
const print=new URLSearchParams(location.search).get("print")==="1";
const dagen=s=>Math.round((p(s)-new Date(new Date().toDateString()))/864e5);
const AUTO='<svg aria-hidden="true" viewBox="0 0 64 40"><defs><linearGradient id="zb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26adc2"/><stop offset="1" stop-color="#11778c"/></linearGradient><linearGradient id="zg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eafcff"/><stop offset="1" stop-color="#86c9d5"/></linearGradient></defs><g stroke="#9fb3ba" stroke-width="1.4" stroke-linecap="round"><path d="M8 7.5H40"/><path d="M11 7.5V4.8M17 7.5V4.8M23 7.5V4.8M29 7.5V4.8M35 7.5V4.8"/><path d="M8 4.8H40"/></g><path d="M5 12a3.5 3.5 0 0 1 3.5-3.5H40c2 0 3.6.8 4.8 2.3l7.4 9.2 5.6 1.8c1.6.5 2.7 2 2.7 3.7V30a2 2 0 0 1-2 2H5z" fill="url(#zb)"/><path d="M42.5 12.5h1.6c.8 0 1.5.4 2 1l5.2 6.8H42.5z" fill="url(#zg)" stroke="#0b4552" stroke-width=".8"/><rect x="30" y="12.5" width="9.5" height="7.6" rx="1.4" fill="url(#zg)" stroke="#0b4552" stroke-width=".8"/><path d="M5 23.5h55" stroke="#0e6476" stroke-width=".8" opacity=".6"/><path d="M7 20.5h22" stroke="#7fe0ee" stroke-width="1.6" stroke-linecap="round" opacity=".8"/><rect x="57" y="23.5" width="3.2" height="2.2" rx="1" fill="#fffbe0"/><circle cx="16" cy="32" r="5.6" fill="#1d2a30"/><circle cx="16" cy="32" r="2.4" fill="#c8d3d7"/><circle cx="49" cy="32" r="5.6" fill="#1d2a30"/><circle cx="49" cy="32" r="2.4" fill="#c8d3d7"/></svg>',BUS='<svg aria-hidden="true" viewBox="0 0 40 72"><defs><linearGradient id="lvb" x1="0" x2="1"><stop offset="0" stop-color="#0d5a6b"/><stop offset=".22" stop-color="#1b93a8"/><stop offset=".5" stop-color="#22a6bc"/><stop offset=".78" stop-color="#1b93a8"/><stop offset="1" stop-color="#0d5a6b"/></linearGradient><linearGradient id="lvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fbff"/><stop offset="1" stop-color="#7cc3d0"/></linearGradient><linearGradient id="lvr" x1="0" x2="1"><stop offset="0" stop-color="#1688a0"/><stop offset=".5" stop-color="#2bb3c8"/><stop offset="1" stop-color="#1688a0"/></linearGradient></defs><ellipse cx="5.2" cy="18" rx="2.4" ry="1.6" fill="#0b4552"/><ellipse cx="34.8" cy="18" rx="2.4" ry="1.6" fill="#0b4552"/><rect x="6" y="3" width="28" height="66" rx="9" fill="url(#lvb)"/><path d="M9 7.5Q20 2.8 31 7.5" stroke="#5fd2e3" stroke-width="1.2" fill="none" opacity=".8"/><rect x="9.5" y="4.2" width="4.5" height="2" rx="1" fill="#fffbe0"/><rect x="26" y="4.2" width="4.5" height="2" rx="1" fill="#fffbe0"/><path d="M9.2 15.5Q20 11.8 30.8 15.5L29.2 25H10.8z" fill="url(#lvg)" stroke="#0b4552" stroke-width=".9"/><path d="M12 16.6Q16 15 19 14.8L18 18.5Q15 18.7 12.6 19.6z" fill="#fff" opacity=".7"/><rect x="9.8" y="27" width="20.4" height="38" rx="4.2" fill="url(#lvr)"/><g stroke="#eef4f6" stroke-linecap="round"><path d="M15 29.5V62.5M25 29.5V62.5" stroke-width="1.7"/><path d="M15 33.5H25M15 38.5H25M15 43.5H25M15 48.5H25M15 53.5H25M15 58.5H25" stroke-width="1.2"/></g><rect x="11" y="66" width="18" height="1.6" rx=".8" fill="#ff6b5e" opacity=".9"/></svg>';
/* live: op de dag zelf het busje op weg naar het gebouw, hoeveel adressen nog en hoe laat (geen exacte plek: dit bord is openbaar) */
function liveHtml(L){if(!L||!["onderweg","bezig"].includes(L.status))return"";
  const vn=L.naam||"Onze schoonmaker",bezig=L.status==="bezig",v=L.voor==null?3:L.voor,pct=bezig?100:Math.max(8,Math.min(82,82-v*18));
  const t=bezig?"Nu in het gebouw aan het werk":v===0?(L.bezigBij?"Dit gebouw is als volgende aan de beurt":vn+" is onderweg hierheen"):"Nog "+v+" "+(v===1?"adres":"adressen")+" vóór dit gebouw";
  const s=bezig?vn+" is bezig met de schoonmaak":L.eta?"Verwacht rond "+L.eta+" · "+vn+" is onderweg":"We zijn onderweg";
  return `<section class="live-k" id="live"><div class="lk-top"><span class="lk-st"><i></i>Live</span><span class="lk-dag">Vandaag</span></div>
    <div class="lk-weg"><i class="lk-lijn"></i><i class="lk-af" style="width:${pct}%"></i><span class="lk-bus" style="left:${pct}%">${AUTO}</span><span class="lk-huis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></span></div>
    <div class="lk-info"><div><b>${esc(t)}</b><small>${esc(s)}</small></div>${!bezig&&L.eta?`<div class="lk-eta"><small>Verwacht</small><b>± ${esc(L.eta)}</b></div>`:""}</div></section>`}
(async()=>{const app=document.getElementById("app");
  if(!t){app.innerHTML='<p class="leeg">Deze link is niet compleet.</p>';return}
  let d;try{const r=await fetch("/api/portaal/bord?t="+t);if(!r.ok)throw 0;d=await r.json()}catch(e){app.innerHTML='<p class="leeg">Dit bord is niet (meer) beschikbaar.</p>';return}
  const b=d.bedrijf||{},l=d.bezoeken&&d.bezoeken[0],v=d.volgende;document.title="Schoonmaak · "+d.naam;
  const lg=`<div class="lg">${b.logo?`<img src="${esc(b.logo)}" alt="">`:""}<b>${esc(b.naam)}</b></div>`;
  const volgTxt=v?(dagen(v.datum)===0?"Vandaag":dagen(v.datum)===1?"Morgen":hoofd(lang(v.datum)))+(v.tijd?" · rond "+esc(v.tijd):""):"Binnenkort";
  app.innerHTML=`<section class="kop">${lg}<small>Schoonmaak van het gebouw</small><h1>${esc(d.naam)}</h1><p>${esc(d.adres)}${d.plaats?", "+esc(d.plaats):""} · ${esc(d.ritme)}</p>
      <span class="st${d.bezig?" live":""}"><i></i>${d.bezig?"Nu aan het schoonmaken":l?"Laatst schoongemaakt "+esc(lang(l.datum)):"Nog geen beurt geregistreerd"}</span></section>
    ${liveHtml(d.live)}
    ${l?`<section class="kaart"><h2>Laatste schoonmaakbeurt</h2><p class="groot">${esc(hoofd(lang(l.datum)))}</p>${l.tijd||l.door?`<p class="sub">${l.door?`Schoongemaakt door <b>${esc(l.door)}</b>`:""}${l.door&&l.tijd?" · ":""}${l.tijd?`gestart om ${esc(l.tijd)}`:""}</p>`:""}
      ${l.taken.length?`<div class="taken">${l.taken.map(x=>`<span class="${x.ok?"":"niet"}">${x.ok?CHK:X}${esc(x.naam)}</span>`).join("")}</div>`:""}
      ${l.fotos.length?`<div class="fotos">${l.fotos.map(u=>`<img src="${esc(u)}" alt="Opleverfoto" loading="lazy">`).join("")}</div>`:""}${l.notitie?`<p class="not">${esc(l.notitie)}</p>`:""}</section>`:""}
    <section class="kaart"><h2>Volgende schoonmaakbeurt</h2><p class="groot">${volgTxt}</p><p class="sub">${esc(hoofd(d.ritme))}</p></section>
    ${d.bezoeken.length>1?`<section class="kaart"><h2>Eerdere beurten</h2>${d.bezoeken.slice(1).map(x=>`<div class="rij"><div><b>${esc(hoofd(lang(x.datum)))}</b><small>${x.door?"Door "+esc(x.door)+" · ":""}${x.taken.filter(t=>t.ok).length?x.taken.filter(t=>t.ok).map(t=>esc(t.naam)).join(" · "):"Schoongemaakt"}</small></div><span style="color:var(--ok)">${CHK.replace("<svg",'<svg width="18" height="18"')}</span></div>`).join("")}</section>`:""}
    <section class="kaart"><h2>Iets opgevallen?</h2><p class="sub" style="margin-top:4px">Een kapotte lamp, grofvuil of schade in het gebouw? Laat het ons weten, wij geven het door aan het bestuur.</p>
      <div class="contact">${b.telefoon?`<a href="tel:${esc(String(b.telefoon).replace(/\\s/g,""))}">Bellen</a>`:""}${b.email?`<a href="mailto:${esc(b.email)}?subject=${encodeURIComponent("Melding "+d.naam)}">E-mailen</a>`:""}</div></section>
    <p class="voet">Dit bord wordt automatisch bijgewerkt door ${esc(b.naam)}.</p>`;
  const url=location.origin+"/bord/"+t;
  try{const q=qrcode(0,"M");q.addData(url);q.make();document.getElementById("poster").innerHTML=`${lg}<h1>Schoonmaak ${esc(d.naam)}</h1><p>Scan de code en zie wanneer het gebouw voor het laatst is schoongemaakt, wat er is gedaan en wanneer we weer komen.</p><div class="qr">${q.createSvgTag({cellSize:6,margin:0,scalable:true})}</div><p class="naam">${esc(d.ritme.charAt(0).toUpperCase()+d.ritme.slice(1))}</p><p class="url">${esc(url)}</p>`}catch(e){}
  if(print){document.body.classList.add("print");setTimeout(()=>window.print(),600)}
  if(!print&&(d.live||(v&&dagen(v.datum)===0)))setInterval(async()=>{if(document.hidden)return;try{const r=await fetch("/api/portaal/bord?t="+t,{cache:"no-store"});if(!r.ok)return;const n=await r.json(),el=document.getElementById("live"),h=liveHtml(n.live);
    if(el)el.outerHTML=h||"";else if(h){const k=app.querySelector(".kop");if(k)k.insertAdjacentHTML("afterend",h)}}catch(e){}},30000);
})();
</script></body></html>
