function kkBus(Lf,p){return Lf.marker([p.lat,p.lng],{icon:Lf.divIcon({className:"lv-ic",html:`<span class="lv-auto"><span class="lv-puls"></span><span class="lv-rot" style="transform:rotate(${p.koers||0}deg)">${BUS}</span></span>`,iconSize:[64,64],iconAnchor:[32,32]}),keyboard:false,zIndexOffset:500})}
function kkTip(L){const el=document.getElementById("lkMap");if(!el)return;let t=el.querySelector(".lk-tip");const tx=L.pos?(L.km!=null?"Bus op "+String(L.km).replace(".",",")+" km":"Bus onderweg"):"Bus verschijnt als dit gebouw bijna aan de beurt is";if(!t){t=document.createElement("span");t.className="lk-tip";el.appendChild(t)}t.textContent=tx}
function kkFit(){if(!KK.map||KK.zelf)return;const pts=[KK.huis];if(KK.car){const v=KK.car.getLatLng();pts.push([v.lat,v.lng])}
  if(pts.length>1)KK.map.fitBounds(pts,{padding:[50,50],maxZoom:16,animate:true});else KK.map.setView(pts[0],15,{animate:true})}
async function kkInit(L){if(KK.map){KK.map.remove();KK.map=null}KK.car=null;KK.lijn=null;KK.zelf=false;const el=document.getElementById("lkMap");if(!el||!L||!L.huis)return;
  try{await kkLeaflet()}catch(e){el.innerHTML='<p class="leeg" style="padding:100px 0;margin:0">Kaart kon niet laden</p>';return}
  const Lf=window.L;el.innerHTML="";KK.huis=L.huis;

  {const ab=document.createElement("button");ab.type="button";ab.className="lv-bron";ab.setAttribute("aria-label","Kaartgegevens");ab.innerHTML="<span>i</span><em>© OpenStreetMap-bijdragers</em>";ab.onclick=e=>{e.stopPropagation();ab.classList.toggle("open")};el.appendChild(ab)}
  KK.map.on("dragstart zoomstart",e=>{if(e&&e.originalEvent)KK.zelf=true});

function kkPos(L,soepel){const Lf=window.L;if(!KK.map||!Lf)return;const p=L.pos;
  if(!p){if(KK.car){KK.car.remove();KK.car=null}if(KK.lijn){KK.lijn.remove();KK.lijn=null}return}
