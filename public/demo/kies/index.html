<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Demo kiezen · Mansard</title>
<meta name="description" content="Kies uw vak en bekijk de demo van Mansard, het CRM voor bedrijven met een buitendienst.">
<meta name="theme-color" content="#f7f7f6">
<link rel="icon" href="/mansard-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/mansard-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d121b;--sub:#5d6470;--mute:#6e7480;--line:#e3e5e8;--bg:#f7f7f6;--beige:#9c8a6c;--navy:linear-gradient(150deg,#353f56 0%,#252c3c 55%,#171c28 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(90% 60% at 85% 0%,rgba(156,138,108,.16) 0%,rgba(247,247,246,0) 60%),var(--bg)}
a{color:inherit;text-decoration:none}
.nav{background:rgba(247,247,246,.82);border-bottom:1px solid rgba(13,18,27,.07)}
.nav-in{max-width:1120px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.nav img{height:16px;display:block}
.nav-r{display:flex;align-items:center;gap:22px}
.nav-r .lnk{font-size:14.5px;font-weight:600}
.knop{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 1px 2px rgba(13,18,27,.18),0 6px 14px -8px rgba(13,18,27,.45),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .25s}
.knop:hover{transform:translateY(-1px)}.knop svg{width:13px;height:13px}
/* alles in één scherm: de inhoud staat midden in de ruimte onder de balk */
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:clamp(20px,4vh,48px) 24px;display:flex;flex-direction:column;justify-content:center}
.kop{text-align:center;max-width:680px;margin:0 auto clamp(20px,3.5vh,36px)}
.label{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--beige);margin:0 0 10px}
.label:before{content:"";width:18px;height:1px;background:var(--beige)}
h1{font-size:clamp(28px,4vw,42px);line-height:1.08;letter-spacing:-.025em;font-weight:700;margin:0 0 10px;text-wrap:balance}
.kop p.int{font-size:16.5px;line-height:1.55;color:var(--sub);margin:0;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kaart{position:relative;display:flex;flex-direction:column;padding:22px 22px 0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(13,18,27,.04),0 18px 40px -30px rgba(13,18,27,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.kaart:hover{transform:translateY(-3px);border-color:#d3d6db;box-shadow:0 1px 2px rgba(13,18,27,.05),0 30px 50px -30px rgba(13,18,27,.45)}
.kaart:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.kaart>div{flex:1;display:flex;flex-direction:column}
.kk{display:flex;align-items:center;gap:14px}
.ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--navy);box-shadow:0 8px 18px -10px rgba(13,18,27,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.ic svg{width:19px;height:19px}
.nr{position:absolute;top:24px;right:22px;font-size:11.5px;font-weight:600;letter-spacing:.18em;color:#b9bcc2;font-variant-numeric:tabular-nums}
.kaart h2{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0}
.kaart p{font-size:14.5px;line-height:1.55;color:var(--sub);margin:12px 0 18px;flex:1}
.voet-k{display:flex;align-items:center;justify-content:space-between;margin:0 -22px;padding:11px 22px;border-top:1px solid #eef0f2;background:#fbfbfa;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;transition:background .3s,color .3s}
.pijl{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--ink);transition:transform .3s,border-color .3s}
.pijl svg{width:13px;height:13px}
.kaart:hover .voet-k{background:#171c28;color:#fff}
.kaart:hover .pijl{border-color:#fff;transform:translateX(3px)}
.onder{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 24px;margin:clamp(16px,3vh,28px) 0 0;font-size:14px;color:var(--sub);text-align:center}
.onder span{display:inline-flex;align-items:center;gap:7px}.onder span.zin{display:inline}.onder svg{width:14px;height:14px;color:var(--beige)}
.onder a{font-weight:600;color:var(--ink);border-bottom:1px solid rgba(13,18,27,.25)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
/* lage schermen (laptop met browserbalk): compacter, zodat alles zonder scrollen past */
@media (min-width:561px) and (max-height:820px){
  .nav-in{height:56px}main{padding:16px 24px}.kop{margin-bottom:18px}.label{margin-bottom:6px}h1{font-size:34px;margin-bottom:6px}.kop p.int{font-size:15px}
  .grid{gap:12px}.kaart{padding:16px 18px 0;border-radius:16px}.ic{width:36px;height:36px;border-radius:10px}.ic svg{width:17px;height:17px}.nr{top:18px;right:18px}
  .kaart h2{font-size:17px}.kaart p{font-size:13.5px;line-height:1.5;margin:8px 0 12px}.voet-k{margin:0 -18px;padding:8px 18px;font-size:11px}.pijl{width:22px;height:22px}.onder{margin-top:14px;font-size:13px}}
@media (min-width:561px) and (max-height:640px){.kop p.int{display:none}.kaart p{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}}
/* telefoon: zes compacte tegels, twee naast elkaar */
@media (max-width:560px){
  .nav-in{height:56px;padding:0 16px}.nav img{height:13px}.nav-r .lnk{display:none}.knop{padding:8px 11px;font-size:10.5px}
  main{padding:18px 16px 20px;justify-content:flex-start}.kop{margin-bottom:16px}.label{margin-bottom:6px}h1{font-size:28px;margin-bottom:6px}.kop p.int{font-size:14.5px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .kaart{padding:16px 14px;border-radius:14px;align-items:flex-start;gap:12px;min-height:108px;justify-content:space-between}
  .kk{flex-direction:column;align-items:flex-start;gap:12px}.ic{width:38px;height:38px;border-radius:11px}.ic svg{width:17px;height:17px}
  .kaart h2{font-size:15.5px}.kaart p,.nr,.voet-k{display:none}
  .kaart:after{content:"";position:absolute;right:14px;top:22px;width:7px;height:7px;border-top:2px solid #b1b6bd;border-right:2px solid #b1b6bd;transform:rotate(45deg)}
  .onder{font-size:12.5px;gap:6px 14px;margin-top:14px}.onder .zin{display:none}}
</style></head>
<body>
<header class="nav"><div class="nav-in">
  <a href="https://www.mansard.nl" aria-label="Mansard, naar de website"><img src="/mansard-logo.png" alt="Mansard"></a>
  <div class="nav-r"><a class="lnk" href="https://www.mansard.nl">Terug naar de website</a><a class="knop" href="https://app.mansard.nl/">Account aanmaken<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
</div></header>
<main>
  <div class="kop">
    <p class="label">Demo</p>
    <h1>Welk vak heeft u?</h1>
    <p class="int">Kies uw vak en bekijk Mansard zoals het voor u werkt: met uw diensten, uw woorden en voorbeeldklanten.</p>
  </div>
  <div class="grid" id="grid"></div>
  <p class="onder"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Zonder account</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Er wordt niets bewaard</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Op telefoon en computer</span><span class="zin">Vak er niet bij? Kies wat er het meest op lijkt of <a href="https://www.mansard.nl">neem contact op</a>.</span></p>
</main>
<script>
const P='fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const V=[
 ["glazenwasser","Glazenwassers","Vaste rondes, ramen per verdieping en klanten die online hun prijs berekenen.",'<path d="M12 3.5c-3 4-5 6.6-5 9.3a5 5 0 0 0 10 0c0-2.7-2-5.3-5-9.3z"/>'],
 ["schoonmaak","Schoonmakers","Vaste schoonmaakcontracten voor kantoren, trappenhuizen en woningen, met planning per ploeg.",'<path d="M5.5 8h13l-1.4 12.5H6.9z"/><path d="M8.5 8a3.5 3.5 0 0 1 7 0"/><path d="M9 12.5h6"/>'],
 ["schoorsteenveger","Schoorsteenvegers","Jaarlijkse rondes, vaste klanten en een seintje zodra iemand weer aan de beurt is.",'<path d="M12 21a6 6 0 0 0 6-6c0-3.5-2.5-6-4-8-.4 2-1.4 3.2-2.6 3.9C11 8.6 10 6 10 3c-3 2.5-4 6-4 12a6 6 0 0 0 6 6z"/>'],
 ["rietdekker","Rietdekkers","Jaarlijkse inspecties en onderhoud die vanzelf terugkomen, plus offertes per m² voor nieuw riet.",'<path d="M2.5 13.5L12 4.5l9.5 9"/><path d="M5.5 11v9h13v-9"/><path d="M9 15l-1 3M12 14v4M15 15l1 3"/>']];
const pijl='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
document.getElementById("grid").innerHTML=V.map(([id,n,t,ic],i)=>`<a class="kaart" href="/demo/?branche=${id}"><span class="nr">0${i+1}</span><div><span class="kk"><span class="ic"><svg viewBox="0 0 24 24" ${P}>${ic}</svg></span><h2>${n}</h2></span><p>${t}</p></div><span class="voet-k">Bekijk de demo<span class="pijl">${pijl}</span></span></a>`).join("");
</script>
</body></html>
